                                        {/* แถวที่ 3: แถบคำสั่งแอดมิน (ดรอปดาวน์สเตจ + คัดลอก + ลบ) */}
                                        {isAdminAuthenticated && (
                                          <div onClick={(e) => e.stopPropagation()} className="flex items-center justify-between gap-1.5 pt-0.5">
                                            {isPendingVerification ? (
                                              <button
                                                type="button"
                                                onClick={() => {
                                                  const parentReq = requests.find(r => r.id === (item.parentRequestId || item.id));
                                                  if (parentReq) {
                                                    setSelectedRequisitionDetail(parentReq);
                                                  } else {
                                                    setSelectedAdminReviewSlot(item);
                                                    setShowAdminReviewModal(true);
                                                  }
                                                }}
                                                className="h-7 flex-1 min-w-0 px-2 rounded-lg bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-200 border border-amber-300 dark:border-amber-700 text-[10.5px] font-bold flex items-center justify-between gap-1 transition cursor-pointer truncate"
                                                title="Pending Review — ต้องตรวจสอบและอนุมัติคำขอก่อนจึงจะย้ายสเตจได้"
                                              >
                                                <span className="truncate">🔒 Pending Review</span>
                                                <span className="text-[10px] underline shrink-0">Verify</span>
                                              </button>
                                            ) : (
                                              <select
                                                value={item.stage}
                                                onChange={(e) => handleInitiateStageChange(item.slotId, e.target.value)}
                                                className="h-7 flex-1 min-w-0 text-[10.5px] font-semibold px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer truncate"
                                                title="Change Stage (เปลี่ยนสเตจ)"
                                              >
                                                {STAGES.map(st => (
                                                  <option key={st.id} value={st.id}>{st.label}</option>
                                                ))}
                                              </select>
                                            )}

                                            <div className="flex items-center gap-1 shrink-0">
                                              <button
                                                type="button"
                                                onClick={(e) => {
                                                  e.stopPropagation();
                                                  handleDuplicateSlot(item);
                                                }}
                                                className="h-7 w-7 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-sky-50 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 hover:text-sky-600 border border-slate-200 dark:border-slate-700 transition cursor-pointer"
                                                title="Duplicate Position (คัดลอกตำแหน่ง)"
                                              >
                                                <span className="text-xs leading-none">📋</span>
                                              </button>
                                              <button
                                                type="button"
                                                onClick={(e) => {
                                                  e.stopPropagation();
                                                  setSlotToDelete(item);
                                                  setDeletionReasonInput("");
                                                }}
                                                className="h-7 w-7 flex items-center justify-center rounded-lg bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 dark:hover:bg-rose-900 text-rose-600 dark:text-rose-300 border border-rose-200 dark:border-rose-800 transition cursor-pointer"
                                                title="Delete Position (ลบตำแหน่ง)"
                                              >
                                                <span className="text-xs leading-none">🗑️</span>
                                              </button>
                                            </div>
                                          </div>
                                        )}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Headcount Demand by Department */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="building" className="w-5 h-5 text-brand-600" />
                            <span>Headcount Demand by Department (อัตรากำลังพลแยกตามฝ่ายงาน)</span>
                          </h2>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[440px] overflow-y-auto pr-1">
                        {departmentStats.map((item, idx) => (
                          <div 
                            key={item.department} 
                            onClick={() => setSelectedDepartmentDetail(item.department)}
                            className="p-3.5 rounded-2xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 hover:border-brand-400 dark:hover:border-brand-500 hover:bg-white dark:hover:bg-slate-800 hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                          >
                            <div className="flex items-start justify-between gap-2 mb-2">
                              <span className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-1 group-hover:text-brand-600 transition">
                                <span className="text-brand-500 font-semibold mr-1.5">#{idx + 1}</span>
                                {item.department}
                              </span>
                              <div className="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                                <span className="text-slate-700 dark:text-slate-300">Total: {item.total}</span>
                                <span className="text-amber-600">Open: {item.open}</span>
                                <span className="text-emerald-600">Filled: {item.filled}</span>
                              </div>
                            </div>
                            <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                              <div 
                                className="h-full bg-gradient-to-r from-brand-500 to-sky-400 rounded-full"
                                style={{ width: `${item.total > 0 ? (item.total / (departmentStats[0]?.total || 1)) * 100 : 0}%` }}
                              ></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
              )}

              {/* SUB-TAB 3: CANDIDATE POOL & MANPOWER REQUEST (แอดมินเท่านั้นที่เห็นได้) */}
              {isAdminAuthenticated && adminSubTab === "candidates" && (
                <div className="flex flex-col w-full space-y-8">
                    {/* SECTION 1: Manpower Request (Top - Full Width) */}
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex items-center justify-between gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <h2 className="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2 truncate">
                          <span>Manpower Requests (รายการคำขอกำลังคน)</span>
                        </h2>

                        <div className="inline-flex items-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-0.5 shrink-0">
                          <a
                            href="https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/edit?gid=1528284561#gid=1528284561"
                            target="_blank"
                            rel="noreferrer"
                            className="h-8 px-3 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs inline-flex items-center transition whitespace-nowrap"
                            title="Open Google Sheet (เปิดชีทคำขอกำลังคน)"
                          >
                            <span>Sheet</span>
                          </a>

                          <div className="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

                          <button
                            onClick={exportToCSV}
                            className="h-8 px-3 rounded-lg hover:bg-emerald-50 dark:hover:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 font-bold text-xs inline-flex items-center transition whitespace-nowrap"
                            title="Export CSV (ส่งออกไฟล์ CSV)"
                          >
                            <span>Export CSV</span>
                          </button>
                        </div>
                      </div>

                      {/* Tab Selection: In Process vs Closed */}
                      <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 pb-3">
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setManpowerTableTab("in_process")}
                            className={`h-8 px-3.5 rounded-xl text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap ${
                              manpowerTableTab === "in_process"
                                ? "bg-amber-500 text-white shadow-xs"
                                : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                            }`}
                          >
                            <span>In Progress (กำลังดำเนินการ)</span>
                            <span className="px-1.5 py-0.5 rounded-full bg-black/15 text-[10px] leading-none">{inProcessSlots.length}</span>
                          </button>

                          <button
                            onClick={() => setManpowerTableTab("closed")}
                            className={`h-8 px-3.5 rounded-xl text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap ${
                              manpowerTableTab === "closed"
                                ? "bg-emerald-600 text-white shadow-xs"
                                : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                            }`}
                          >
                            <span>Closed (ปิดการสรรหา)</span>
                            <span className="px-1.5 py-0.5 rounded-full bg-black/15 text-[10px] leading-none">{closedSlots.length}</span>
                          </button>
                        </div>

                        {manpowerTableTab === "closed" && (
                          <div className="inline-flex items-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-0.5 shrink-0">
                            <button
                              onClick={handleSyncAllClosedToSheet}
                              className="h-8 px-3 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-emerald-700 dark:text-emerald-300 font-bold text-xs inline-flex items-center transition cursor-pointer whitespace-nowrap"
                              title="Sync Closed Data to Sheet (ซิงค์ข้อมูลที่ปิดแล้ว)"
                            >
                              <span>Sync Closed (ซิงค์ข้อมูล)</span>
                            </button>
                            <div className="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>
                            <a
                              href="https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/edit?gid=396528947#gid=396528947"
                              target="_blank"
                              rel="noreferrer"
                              className="h-8 px-3 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-sky-700 dark:text-sky-300 font-semibold text-xs inline-flex items-center transition whitespace-nowrap"
                              title="Open Closed Google Sheet (เปิดชีท Closed)"
                            >
                              <span>Closed Sheet</span>
                            </a>
                          </div>
                        )}
                      </div>

                      {/* Manpower Request Data Table */}
                      <div className="overflow-x-auto max-h-[380px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-500 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5">Slot ID</th>
                              <th className="px-3 py-2.5">Status</th>
                              <th className="px-3 py-2.5">Position</th>
                              <th className="px-3 py-2.5">Department</th>
                              <th className="px-3 py-2.5">Stage</th>
                              <th className="px-3 py-2.5">Lead Time</th>
                              <th className="px-3 py-2.5">Candidate &amp; Schedule</th>
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">Hire Date &amp; Arrival</th>}
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">Total Duration</th>}
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">Google Drive / เอกสาร</th>}
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">อุปกรณ์ IT ที่ขอ</th>}
                              <th className="px-3 py-2.5">Evaluation</th>
                              <th className="px-3 py-2.5 text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {(manpowerTableTab === "closed" ? closedSlots : inProcessSlots).length === 0 ? (
                              <tr>
                                <td colSpan={manpowerTableTab === "closed" ? "13" : "9"} className="text-center py-6 text-slate-400 italic">
                                  {manpowerTableTab === "closed" ? "ไม่มีรายการที่ปิดการสรรหา (Closed)" : "ไม่มีรายการในหมวดนี้"}
                                </td>
                              </tr>
                            ) : (
                              (manpowerTableTab === "closed" ? closedSlots : inProcessSlots).map(s => {
                                const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
                                const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
                                const hasEvaluation = s.evaluationsCount > 0;
                                const isPassingScore = s.interviewScorePercent >= 70;
                                const isArrivedSuccess = s.onboardingArrivalStatus === "arrived_reported";
                                const isDeclinedOrCancelled = s.stage === "cancelled" || s.onboardingArrivalStatus === "declined_noshow";
                                const parentReq = requests.find(r => r.id === (s.parentRequestId || s.id)) || {};

                                const rowHighlightClass = isDeclinedOrCancelled
                                  ? "bg-rose-50/70 dark:bg-rose-950/40 hover:bg-rose-100/80 transition cursor-pointer"
                                  : isArrivedSuccess
                                  ? "bg-emerald-50/70 dark:bg-emerald-950/40 hover:bg-emerald-100/80 transition cursor-pointer"
                                  : "hover:bg-slate-50/80 dark:hover:bg-slate-800/40 cursor-pointer";

                                return (
                                  <tr 
                                    key={s.slotId} 
                                    className={rowHighlightClass}
                                    onClick={() => setSelectedDetailSlot(s)}
                                    title="คลิกเพื่อดูข้อมูลและลิงก์รายละเอียดทั้งหมด"
                                  >
                                    <td className="px-3 py-2.5 font-semibold text-slate-900 dark:text-white">
                                      <span className="text-brand-600 font-bold">{s.slotId}</span>
                                      <div className="text-[10px] text-slate-400">{s.requestDate}</div>
                                    </td>

                                    <td className="px-3 py-2.5">
                                      {s.slotStatus === "PENDING_ADMIN" ? (
                                        <button
                                          onClick={() => {
                                            setSelectedAdminReviewSlot(s);
                                            setShowAdminReviewModal(true);
                                          }}
                                          className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10.5px] font-bold bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 dark:bg-amber-950 dark:text-amber-200 dark:border-amber-700 shadow-2xs transition active:scale-95"
                                          title="คลิกเพื่อตรวจสอบและอนุมัติคำขอ"
                                        >
                                          <span>Pending Review</span>
                                          <span className="text-amber-700 dark:text-amber-300 font-bold underline ml-1">Review &rarr;</span>
                                        </button>
                                      ) : s.slotStatus === "PENDING_APPROVER" ? (
                                        <span className="inline-flex items-center px-2 py-0.5 rounded-lg text-[10.5px] font-bold bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300 border border-sky-300 dark:border-sky-800">
                                          Pending Approval
                                        </span>
                                      ) : s.slotStatus === "PENDING_IT" ? (
                                        <span className="inline-flex items-center px-2 py-0.5 rounded-lg text-[10.5px] font-bold bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300 border border-purple-300 dark:border-purple-800">
                                          Pending IT Setup
                                        </span>
                                      ) : (
                                        <select
                                          value={s.slotStatus || "READY_FOR_RECRUITMENT"}
                                          onChange={(e) => handleUpdateSlotStatus(s.slotId, e.target.value)}
                                          className={`text-[11px] font-bold px-2 py-1 rounded-lg border transition ${
                                            s.slotStatus === "Closed"
                                              ? "bg-emerald-50 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                              : s.slotStatus === "READY_FOR_RECRUITMENT"
                                              ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-400 font-extrabold ring-1 ring-emerald-500/20"
                                              : "bg-amber-50 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-800"
                                          }`}
                                        >
                                          {REQUISITION_STATUSES.filter(st => st.id !== "PENDING_ADMIN" && st.id !== "REJECTED_BY_ADMIN").map(st => (
                                            <option key={st.id} value={st.id}>{st.label}</option>
                                          ))}
                                        </select>
                                      )}
                                    </td>

                                    <td className="px-3 py-2.5 font-bold text-slate-900 dark:text-white">
                                      <div className="flex items-center gap-1.5">
                                        <span>{s.jobTitle}</span>
                                        {s.totalSlots > 1 && (
                                          <span className="px-1.5 py-0.2 rounded bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 font-extrabold text-[10px] border border-sky-200 dark:border-sky-800 shrink-0">
                                            {s.slotIndex}/{s.totalSlots}
                                          </span>
                                        )}
                                      </div>
                                      <div className="text-[10px] font-normal text-slate-400">
                                        {s.positionType}
                                        {s.positionType === "Replacement" && s.replacedEmployeeName && (
                                          <span className="text-amber-600 ml-1 font-semibold">(แทน: {s.replacedEmployeeName})</span>
                                        )}
                                      </div>
                                    </td>

                                    <td className="px-3 py-2.5">{s.department}</td>

                                    <td className="px-3 py-2.5">
                                      <select
                                        value={s.stage}
                                        onChange={(e) => handleInitiateStageChange(s.slotId, e.target.value)}
                                        className="text-[11px] p-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                                      >
                                        {STAGES.map(stg => (
                                          <option key={stg.id} value={stg.id}>{stg.label}</option>
                                        ))}
                                      </select>
                                    </td>

                                    <td className="px-3 py-2.5">
                                      {s.stage === "offer" ? (
                                        <span className="px-2 py-1 rounded-lg bg-purple-100 text-purple-900 dark:bg-purple-950 dark:text-purple-200 font-bold text-[11px]">
                                          🎯 สรรหาได้ใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                        </span>
                                      ) : (
                                        <span className="text-slate-500 text-[11px]">
                                          ⏱️ {sla.workingDaysElapsed} วันทำการ ({sla.isCompleted ? "Closed" : `เหลือ ${sla.workingDaysRemaining} วัน`})
                                        </span>
                                      )}
                                    </td>

                                    <td className="px-3 py-2.5">
                                      {s.candidateName ? (
                                        <div className="flex flex-col space-y-0.5">
                                          <div className="flex items-center gap-1.5 flex-wrap">
                                            <span className="font-semibold text-slate-900 dark:text-white">{s.candidateName}</span>
                                            {s.candidateNickname && <span className="text-[10px] text-slate-400">({s.candidateNickname})</span>}
                                            {s.resumeUrl && (
                                              <a
                                                href={s.resumeUrl}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                onClick={(e) => e.stopPropagation()}
                                                className="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-sky-50 dark:bg-sky-950/70 text-sky-600 dark:text-sky-300 border border-sky-200 dark:border-sky-800 text-[9.5px] font-bold hover:bg-sky-100 transition shadow-2xs"
                                                title="เปิดดู Google Drive CV / Resume"
                                              >
                                                <Icon name="link" className="w-2.5 h-2.5 text-sky-500" />
                                                <span>Drive / CV</span>
                                              </a>
                                            )}
                                            <button
                                              onClick={() => setUnassignConfirmTarget(s)}
                                              className="p-1 rounded-md text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 text-[10px] font-bold"
                                              title="ถอดผู้สมัคร"
                                            >
                                              ✕ ถอด
                                            </button>
                                          </div>
                                          {s.interviewSchedule && (() => {
                                            const relTime = getInterviewRelativeTimeInfo(s.interviewSchedule);
                                            const googleMeetUrl = extractGoogleMeetUrl(s);
                                            return (
                                              <div className="flex flex-col space-y-1 text-[10px] mt-0.5">
                                                <div className="flex flex-wrap items-center gap-1.5">
                                                  <span className="text-amber-700 dark:text-amber-300 font-medium">
                                                    📅 {s.interviewSchedule}
                                                  </span>
                                                  {relTime && s.stage === "interview" && (
                                                    <span className={`inline-flex items-center gap-1 px-2 py-0.2 rounded-full text-[9.5px] border ${relTime.badge}`}>
                                                      {relTime.ping && (
                                                        <span className="relative flex h-1.5 w-1.5">
                                                          <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                                          <span className={`relative inline-flex rounded-full h-1.5 w-1.5 ${relTime.dotBg}`}></span>
                                                        </span>
                                                      )}
                                                      <span>{relTime.text}</span>
                                                    </span>
                                                  )}
                                                </div>
                                                {googleMeetUrl && (
                                                  <div>
                                                    <a
                                                      href={googleMeetUrl}
                                                      target="_blank"
                                                      rel="noopener noreferrer"
                                                      onClick={(e) => e.stopPropagation()}
                                                      className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-100 hover:bg-emerald-200 dark:bg-emerald-950 dark:hover:bg-emerald-900 text-emerald-800 dark:text-emerald-200 text-[10px] font-bold transition border border-emerald-300 dark:border-emerald-800"
                                                      title="คลิกเพื่อเข้า Google Meet ทันที"
                                                    >
                                                      <Icon name="link" className="w-2.5 h-2.5 text-emerald-600" />
                                                      <span>เข้า Google Meet &rarr;</span>
                                                    </a>
                                                  </div>
                                                )}
                                              </div>
                                            );
                                          })()}
                                          {s.rejectionReason && (
                                            <div className="text-[10px] text-rose-700 dark:text-rose-300 font-bold bg-rose-100 dark:bg-rose-950/80 px-2 py-0.5 rounded-md border border-rose-300 dark:border-rose-900 truncate max-w-[200px]" title={s.rejectionReason}>
                                              ❌ เหตุผล: {s.rejectionReason}
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <span className="text-slate-400 text-[11px] italic">ว่าง (Unassigned)</span>
                                      )}
                                    </td>

                                    {/* Closed-Tab Specific: Hire Date & Arrival Status with Locking */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        <div className="space-y-1">
                                          {isDeclinedOrCancelled ? (
                                            <div className="text-[11px] font-extrabold text-rose-600 dark:text-rose-400 flex items-center gap-1">
                                              <span>❌ ยกเลิก / สละสิทธิ์</span>
                                            </div>
                                          ) : s.hireDate ? (
                                            <div className="text-[11px] font-extrabold text-emerald-800 dark:text-emerald-300 flex items-center gap-1">
                                              <Icon name="calendar" className="w-3 h-3 text-emerald-600" />
                                              <span>วันเริ่มงาน: {s.hireDate}</span>
                                            </div>
                                          ) : (
                                            <div className="text-[10px] text-slate-400 italic">ไม่ระบุวันเริ่มงาน</div>
                                          )}
                                          
                                          <div className="flex items-center gap-1">
                                            <select
                                              disabled={s.onboardingArrivalStatus === "declined_noshow"}
                                              value={s.onboardingArrivalStatus || "pending_arrival"}
                                              onChange={(e) => handleUpdateOnboardingArrivalStatus(s.slotId, e.target.value)}
                                              className={`text-[10px] font-extrabold px-2.5 py-1 rounded-lg border transition ${
                                                s.onboardingArrivalStatus === "declined_noshow"
                                                  ? "bg-rose-600 text-white border-rose-700 shadow-sm ring-2 ring-rose-500/30 cursor-not-allowed opacity-95"
                                                  : s.onboardingArrivalStatus === "arrived_reported"
                                                  ? "bg-emerald-600 text-white border-emerald-700 shadow-sm ring-2 ring-emerald-500/20"
                                                  : "bg-amber-100 text-amber-800 border-amber-300"
                                              }`}
                                            >
                                              {ONBOARDING_ARRIVAL_STATUSES.map(arr => (
                                                <option key={arr.id} value={arr.id}>{arr.label}</option>
                                              ))}
                                            </select>
                                            {s.onboardingArrivalStatus === "declined_noshow" && (
                                              <span className="text-[10px] text-rose-600 font-bold" title="สถานะนี้ถูกล็อกแล้ว">🔒</span>
                                            )}
                                          </div>
                                        </div>
                                      </td>
                                    )}

                                    {/* Closed-Tab Specific: Total Recruitment Duration */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        <div className="space-y-0.5">
                                          <div className="text-[11px] font-extrabold text-slate-900 dark:text-white flex items-center gap-1">
                                            <span className="px-2 py-0.5 rounded-md bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 font-bold">
                                              ⏱️ รวม {duration.totalDays} วัน
                                            </span>
                                          </div>
                                          <div className="text-[10px] text-slate-500 dark:text-slate-400 font-medium pl-1">
                                            ({duration.workingDays} วันทำการ)
                                          </div>
                                          <div className="text-[9px] text-slate-400 pl-1 truncate max-w-[170px]" title={duration.rangeText}>
                                            {duration.rangeText}
                                          </div>
                                        </div>
                                      </td>
                                    )}

                                    {/* Closed-Tab Specific: Prominent Google Drive / Resume Link */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        {s.resumeUrl ? (
                                          <a
                                            href={s.resumeUrl}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            onClick={(e) => e.stopPropagation()}
                                            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 dark:bg-sky-950/70 dark:hover:bg-sky-900 text-sky-700 dark:text-sky-300 border border-sky-300 dark:border-sky-800 font-bold text-xs transition shadow-2xs group"
                                            title="เปิดดูเอกสารสมัครงาน Google Drive"
                                          >
                                            <Icon name="link" className="w-3.5 h-3.5 text-sky-600" />
                                            <span>📄 เปิดดู Drive / CV</span>
                                          </a>
                                        ) : (
                                          <span className="text-[11px] text-slate-400 italic">ไม่มีลิงก์</span>
                                        )}
                                      </td>
                                    )}

                                    {/* Closed-Tab Specific: IT Equipment Information */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        <div className="text-[10.5px] space-y-0.5">
                                          <div className="flex items-center gap-1">
                                            <span className="font-semibold text-slate-500">💻 Laptop:</span>
                                            <span className={(s.itLaptop || parentReq.itLaptop) === "ต้องการ" ? "text-sky-600 font-bold" : "text-slate-400"}>
                                              {s.itLaptop || parentReq.itLaptop || "ต้องการ"}
                                            </span>
                                          </div>
                                          <div className="flex items-center gap-1">
                                            <span className="font-semibold text-slate-500">📱 Sim:</span>
                                            <span className={(s.itSimCard || parentReq.itSimCard) === "ต้องการ" ? "text-sky-600 font-bold" : "text-slate-400"}>
                                              {s.itSimCard || parentReq.itSimCard || "ไม่ต้องการ"}
                                            </span>
                                          </div>
                                          <div className="flex items-center gap-1">
                                            <span className="font-semibold text-slate-500">✉️ Email:</span>
                                            <span className={(s.itEmail || parentReq.itEmail) === "ต้องการ" ? "text-sky-600 font-bold" : "text-slate-400"}>
                                              {s.itEmail || parentReq.itEmail || "ต้องการ"}
                                            </span>
                                          </div>
                                          <div className="flex items-center gap-1">
                                            <span className="font-semibold text-slate-500">ERP Netsuite:</span>
                                            <span className={(s.itNetsuite || parentReq.itNetsuite) === "ต้องการ" ? "text-sky-600 font-bold" : "text-slate-400"}>
                                              {s.itNetsuite || parentReq.itNetsuite || "ไม่ต้องการ"}
                                            </span>
                                          </div>
                                        </div>
                                      </td>
                                    )}

                                    <td className="px-3 py-2.5">
                                      {s.stage === "interview" ? (
                                        <div className="flex items-center gap-2">
                                          <button
                                            onClick={() => handleOpenBlindEvaluationModal(s)}
                                            className="px-2.5 py-1 rounded-lg bg-brand-50 hover:bg-brand-100 dark:bg-brand-950 dark:hover:bg-brand-900 text-brand-700 dark:text-brand-300 font-bold text-[11px] flex items-center gap-1 transition"
                                          >
                                            <Icon name="clipboardCheck" className="w-3.5 h-3.5 text-brand-600" />
                                            <span>+ ประเมินสัมภาษณ์</span>
                                          </button>

                                          {hasEvaluation ? (
                                            <button
                                              onClick={() => setAdminAuditSlot(s)}
                                              className={`px-2.5 py-1 rounded-md text-[10px] font-extrabold flex items-center gap-1 border transition hover:opacity-90 ${
                                                isPassingScore
                                                  ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                                  : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800"
                                              }`}
                                              title="คลิกเพื่อดู Audit Breakdown"
                                            >
                                              <span>⭐ {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน ({isPassingScore ? "ผ่าน" : "ตก"})</span>
                                              <span className="underline ml-0.5">Audit 🔍</span>
                                            </button>
                                          ) : (
                                            <span className="text-[10px] text-slate-400 italic">รอผลประเมิน</span>
                                          )}
                                        </div>
                                      ) : hasEvaluation ? (
                                        <button
                                          onClick={() => setAdminAuditSlot(s)}
                                          className={`px-2.5 py-1 rounded-md text-[10px] font-extrabold flex items-center gap-1 border transition hover:opacity-90 ${
                                            isPassingScore
                                              ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                              : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800"
                                          }`}
                                          title="คลิกเพื่อดู Audit Breakdown"
                                        >
                                          <span>⭐ {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน</span>
                                          <span className="underline ml-0.5">Audit 🔍</span>
                                        </button>
                                      ) : (
                                        <span className="text-slate-400 text-[10px] italic">-</span>
                                      )}
                                    </td>

                                    <td className="px-3 py-2.5 text-center">
                                      <button
                                        onClick={() => setSelectedDetailSlot(s)}
                                        className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 text-slate-600 transition"
                                        title="ดูรายละเอียดคำขอ"
                                      >
                                        <Icon name="eye" className="w-3.5 h-3.5" />
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* SECTION 2: Candidate Pool Directory */}
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex items-center justify-between gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <h2 className="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2 truncate">
                          <span>Candidate Pool (คลังรายชื่อผู้สมัคร)</span>
                        </h2>

                        <div className="flex items-center gap-2 shrink-0">
                          <button
                            onClick={() => setShowAddCandidateModal(true)}
                            className="h-9 px-3.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs inline-flex items-center gap-1.5 shadow-xs transition active:scale-95 whitespace-nowrap"
                          >
                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                            <span>Add Candidate (เพิ่มผู้สมัคร)</span>
                          </button>

                          <div className="inline-flex items-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-0.5 shrink-0">
                            <button
                              onClick={() => syncCandidatesFromGoogleSheet(true)}
                              className="h-8 px-3 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs inline-flex items-center gap-1 transition whitespace-nowrap"
                              title="Sync Candidates from Sheet (ซิงค์ผู้สมัคร)"
                            >
                              <span>Sync (ซิงค์)</span>
                            </button>

                            <div className="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

                            <a
                              href={CANDIDATES_SHEET_EDIT_URL}
                              target="_blank"
                              rel="noreferrer"
                              className="h-8 px-3 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-sky-700 dark:text-sky-300 font-semibold text-xs inline-flex items-center transition whitespace-nowrap"
                              title="Open Candidate Pool Sheet (เปิดชีทผู้สมัคร)"
                            >
                              <span>Sheet</span>
                            </a>
                          </div>
                        </div>
                      </div>

                      {/* Filters: Position and Status (Balanced Single-Line) */}
                      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                        <div className="flex items-center gap-2 text-xs overflow-x-auto pb-1 lg:pb-0">
                          <div className="flex items-center gap-1.5 shrink-0">
                            <span className="text-[11px] font-bold text-slate-400 uppercase whitespace-nowrap">Position:</span>
                            <select
                              value={candidatePositionFilter}
                              onChange={(e) => setCandidatePositionFilter(e.target.value)}
                              className="px-2.5 py-1 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold max-w-[180px] truncate"
                            >
                              <option value="ALL">All Positions</option>
                              {positionFilterOptions.map(pos => (
                                <option key={pos} value={pos}>{pos}</option>
                              ))}
                            </select>
                          </div>

                          <div className="flex items-center gap-1.5 shrink-0">
                            <span className="text-[11px] font-bold text-slate-400 uppercase whitespace-nowrap">Status:</span>
                            <button
                              onClick={() => setSelectedStatusFilter("ALL")}
                              className={`px-2.5 py-1 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                                selectedStatusFilter === "ALL"
                                  ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs"
                                  : "bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300"
                              }`}
                            >
                              All ({candidatePool.length})
                            </button>
                            {CANDIDATE_STATUS_CONFIG.map(st => {
                              const count = candidatePool.filter(c => c.status === st.id).length;
                              return (
                                <button
                                  key={st.id}
                                  onClick={() => setSelectedStatusFilter(st.id)}
                                  className={`px-2 py-1 rounded-xl text-xs font-bold transition border whitespace-nowrap ${st.bg} ${st.text} ${st.border} ${
                                    selectedStatusFilter === st.id ? "ring-2 ring-slate-800 dark:ring-slate-200 shadow-xs" : "opacity-80 hover:opacity-100"
                                  }`}
                                >
                                  <span>{st.id}</span>
                                  <span className="ml-1 px-1.5 py-0.2 rounded-full bg-black/10 text-[10px]">{count}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div className="relative w-full lg:flex-1 lg:min-w-[180px]">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-3.5 h-3.5" />
                          </div>
                          <input
                            type="text"
                            placeholder="Search candidates..."
                            value={candidateSearchQuery}
                            onChange={(e) => setCandidateSearchQuery(e.target.value)}
                            className="h-8 w-full pl-8 pr-3 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      {/* Candidate Pool Data Table */}
                    <div className="overflow-x-auto max-h-[520px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-100 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5 font-bold">Action</th>
                              <th className="px-3 py-2.5 font-bold">No.</th>
                              <th className="px-3 py-2.5 font-bold">Full Name</th>
                              <th className="px-3 py-2.5 font-bold">Nickname</th>
                              <th className="px-3 py-2.5 font-bold">Phone</th>
                              <th className="px-3 py-2.5 font-bold">Position</th>
                              <th className="px-3 py-2.5 font-bold">Level</th>
                              <th className="px-3 py-2.5 font-bold">Status</th>
                              <th className="px-3 py-2.5 font-bold text-center">Manage</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {filteredCandidates.length === 0 ? (
                              <tr>
                                <td colSpan="9" className="text-center py-8 text-slate-400 italic">
                                  ไม่พบข้อมูลผู้สมัครตามเงื่อนไขที่ค้นหา
                                </td>
                              </tr>
                            ) : (
                              filteredCandidates.map((cand, idx) => {
                              const statusCfg = CANDIDATE_STATUS_CONFIG.find(c => c.id === cand.status) || CANDIDATE_STATUS_CONFIG[0];
                              const shouldHideMapping = statusCfg.hideMapping;

                              // 🔒 ตรวจสอบว่าแคนดิเดตรายนี้ผูกกับ Slot ใดอยู่แล้วหรือไม่ (ทั้งจาก assignedSlotId หรือจากชื่อบน slot)
                              const mappedActiveSlot = allPositionSlots.find(s => 
                                (cand.assignedSlotId && s.slotId === cand.assignedSlotId) || 
                                (s.candidateName && isSameCandidate(s.candidateName, cand.fullName) && s.stage !== "cancelled")
                              );
                              const effectiveAssignedSlotId = cand.assignedSlotId || mappedActiveSlot?.slotId;

                              return (
                                <tr key={cand.candidateId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                                  <td className="px-3 py-2">
                                    <div className="flex items-center gap-1.5">
                                      {/* 1. ปุ่มดูรายละเอียด/แก้ไข */}
                                      <button
                                        type="button"
                                        onClick={() => handleOpenCandidateDetail(cand)}
                                        className="p-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 dark:bg-sky-950/60 dark:hover:bg-sky-900 text-sky-700 dark:text-sky-300 transition shadow-2xs border border-sky-200 dark:border-sky-800"
                                        title="ดูรายละเอียด / แก้ไขข้อมูล 18 คอลัมน์"
                                      >
                                        <Icon name="eye" className="w-3.5 h-3.5" />
                                      </button>

                                      {/* 2. ปุ่มแมปตำแหน่ง */}
                                      {effectiveAssignedSlotId ? (
                                        <div className="flex items-center gap-1">
                                          <span className="px-1.5 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 font-extrabold text-[10px] border border-emerald-300">
                                            ✓ {effectiveAssignedSlotId}
                                          </span>
                                          <button
                                            onClick={() => handleUnassignCandidate(effectiveAssignedSlotId, cand.fullName)}
                                            className="text-[10px] text-rose-600 hover:text-rose-800 underline font-semibold shrink-0"
                                            title="Unassign"
                                          >
                                            ถอด
                                          </button>
                                        </div>
                                      ) : shouldHideMapping ? (
                                        <span className="text-[10px] font-semibold italic text-slate-400 dark:text-slate-500">
                                          {cand.status === "Hiring / Offer" ? "✓ บรรจุงานแล้ว" : "(พ้นกระบวนการ)"}
                                        </span>
                                      ) : (
                                        <button
                                          onClick={() => setSlotPickerCandidate(cand)}
                                          className="p-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition shadow-2xs active:scale-95"
                                          title="แมปตำแหน่ง"
                                        >
                                          <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                                        </button>
                                      )}
                                    </div>
                                  </td>

                                    <td className="px-3 py-2 font-bold text-slate-800 dark:text-slate-200">{cand.no || idx + 1}</td>
                                    <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">
                                      <div className="flex items-center gap-1.5">
                                        <span>{cand.fullName}</span>
                                        {cand.resumeUrl && (
                                          <a
                                            href={cand.resumeUrl}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center gap-0.5 px-1.5 py-0.2 rounded bg-sky-50 dark:bg-sky-950/70 text-sky-600 dark:text-sky-300 border border-sky-200 dark:border-sky-800 text-[9px] font-semibold hover:bg-sky-100 transition shadow-2xs"
                                            title="เปิดดู Google Drive CV / Resume"
                                          >
                                            <Icon name="link" className="w-2.5 h-2.5 text-sky-500" />
                                            <span>CV</span>
                                          </a>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-3 py-2">{cand.nickname || "-"}</td>
                                    <td className="px-3 py-2">{cand.phone || "-"}</td>
                                    <td className="px-3 py-2 font-semibold text-brand-600 dark:text-brand-400">{cand.targetJobTitle}</td>
                                    <td className="px-3 py-2">{cand.level || "-"}</td>
                                    
                                    <td className="px-3 py-2">
                                      <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-lg border ${statusCfg.bg} ${statusCfg.text} ${statusCfg.border}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>

                                    <td className="px-3 py-2 text-center">
                                      <button
                                        type="button"
                                        onClick={() => setCandidateToDelete(cand)}
                                        className="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 font-bold text-[11px] border border-rose-200 dark:border-rose-800 transition active:scale-95 shadow-2xs cursor-pointer"
                                        title="ลบข้อมูลผู้สมัครรายนี้"
                                      >
                                        <span>🗑️ ลบ</span>
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
              )}
            </div>
              </>
            )}

          </main>

          {/* Kanban Stage Clear / Hide Modal (Admin Only) */}
          {isAdminAuthenticated && stageClearModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[90vh] flex flex-col">
                <div className="px-6 py-4 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-amber-400 uppercase tracking-wider">
                      CLEAR KANBAN CARDS (ล้างการ์ดออกจากกระดาน)
                    </span>
                    <h3 className="text-base font-extrabold mt-0.5">
                      {stageClearModal.stageLabel}
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      setStageClearModal(null);
                      setClearCardsReasonInput("");
                    }}
                    className="p-1.5 text-slate-400 hover:text-white"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-900/50 text-[11px] text-amber-800 dark:text-amber-200">
                  การล้างการ์ดจะซ่อนการ์ดที่เลือกออกจากกระดาน Kanban เท่านั้น โดยข้อมูลคำขอและ Slot ทั้งหมดยังคงถูกบันทึกไว้ครบถ้วน
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
                    <label className="flex items-center gap-2 cursor-pointer font-bold text-slate-900 dark:text-white select-none">
                      <input
                        type="checkbox"
                        checked={selectedSlotsToClear.length === stageClearModal.slots.length && stageClearModal.slots.length > 0}
                        onChange={(e) => {
                          if (e.target.checked) {
                            setSelectedSlotsToClear(stageClearModal.slots.map(s => s.slotId));
                          } else {
                            setSelectedSlotsToClear([]);
                          }
                        }}
                        className="w-4 h-4 rounded text-brand-600 focus:ring-brand-500"
                      />
                      <span>Select All / เลือกทั้งหมด ({stageClearModal.slots.length} รายการ)</span>
                    </label>
                    <span className="text-[11px] text-slate-400">เลือกแล้ว {selectedSlotsToClear.length} รายการ</span>
                  </div>

                  <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                    {stageClearModal.slots.map(slot => {
                      const stageMeta = STAGES.find(st => st.id === slot.stage);
                      return (
                        <label
                          key={slot.slotId}
                          className={`flex items-start gap-3 p-3 rounded-xl border transition cursor-pointer select-none ${
                            selectedSlotsToClear.includes(slot.slotId)
                              ? "bg-brand-50/80 dark:bg-brand-950/40 border-brand-300 dark:border-brand-700"
                              : "bg-slate-50/50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 hover:bg-slate-50"
                          }`}
                        >
                          <input
                            type="checkbox"
                            checked={selectedSlotsToClear.includes(slot.slotId)}
                            onChange={() => {
                              setSelectedSlotsToClear(prev =>
                                prev.includes(slot.slotId)
                                  ? prev.filter(id => id !== slot.slotId)
                                  : [...prev, slot.slotId]
                              );
                            }}
                            className="w-4 h-4 mt-0.5 rounded text-brand-600 focus:ring-brand-500 shrink-0"
                          />
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center justify-between gap-2">
                              <span className="font-bold text-brand-600 text-xs">{slot.slotId}</span>
                              <span className="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-200/70 dark:bg-slate-700 text-slate-700 dark:text-slate-200 truncate">
                                {stageMeta ? stageMeta.label : slot.stage}
                              </span>
                            </div>
                            <p className="font-bold text-slate-900 dark:text-white truncate mt-0.5">{slot.jobTitle}</p>
                            <p className="text-[11px] text-slate-500 truncate">{slot.department}</p>
                            {slot.candidateName && (
                              <p className="text-[11px] text-emerald-700 dark:text-emerald-300 font-semibold mt-1">
                                Candidate: {slot.candidateName}
                              </p>
                            )}
                          </div>
                        </label>
                      );
                    })}
                  </div>

                  {/* Mandatory Reason Input */}
                  <div className="pt-2 border-t border-slate-200 dark:border-slate-800 space-y-1.5">
                    <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300">
                      Reason (เหตุผลในการล้างการ์ด) <span className="text-rose-600">* (บังคับระบุ)</span>
                    </label>
                    <textarea
                      rows="2"
                      required
                      placeholder="ระบุเหตุผล เช่น ปิดรับเรียบร้อยแล้ว, เคลียร์รายการค้างเก่าบนกระดาน, ยกเลิกตำแหน่ง..."
                      value={clearCardsReasonInput}
                      onChange={(e) => setClearCardsReasonInput(e.target.value)}
                      className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 font-medium text-xs"
                    ></textarea>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setStageClearModal(null);
                      setClearCardsReasonInput("");
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200"
                  >
                    Cancel (ยกเลิก)
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmBatchArchive}
                    disabled={selectedSlotsToClear.length === 0 || !clearCardsReasonInput.trim()}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-md transition"
                  >
                    Confirm Clear / ยืนยันล้างการ์ด ({selectedSlotsToClear.length} รายการ)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Unassigned Interview Slot Alert & Picker Modal */}
          {unassignedInterviewSlotModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-amber-300 dark:border-amber-700 p-6 space-y-4">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-2">
                    <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-lg font-bold shrink-0">
                      ⚠️
                    </div>
                    <div>
                      <span className="text-[10px] font-extrabold text-amber-600 uppercase">
                        INTERVIEW STAGE CANDIDATE CHECK
                      </span>
                      <h3 className="text-base font-extrabold text-slate-900 dark:text-white mt-0.5">
                        ตำแหน่งนี้ยังไม่มีผู้สมัครจับคู่ (Unassigned)
                      </h3>
                    </div>
                  </div>
                  <button onClick={() => setUnassignedInterviewSlotModal(null)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs space-y-1">
                  <p><span className="text-slate-400">ตำแหน่ง:</span> <strong className="text-slate-900 dark:text-white">{unassignedInterviewSlotModal.jobTitle}</strong></p>
                  <p><span className="text-slate-400">Slot ID:</span> <strong className="text-brand-600">#{unassignedInterviewSlotModal.slotId}</strong></p>
                  <p><span className="text-slate-400">ฝ่ายงาน:</span> <strong className="text-slate-700 dark:text-slate-300">{unassignedInterviewSlotModal.department}</strong></p>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 font-medium">
                  ก่อนจะย้ายตำแหน่งเข้าสู่ด่าน <strong>Interview Stage</strong> กรุณาเลือกผู้สมัครจาก Candidate Pool เพื่อนำมาจับคู่และกำหนดวันเวลานัดสัมภาษณ์:
                </p>

                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {(() => {
                    const availableCandidates = candidatePool.filter(c => {
                      if (c.assignedSlotId) return false;
                      if (c.status === "not suitable" || c.status === "cancel by candidate" || c.status === "Hiring / Offer") return false;
                      
                      // 🔒 กรอง Candidate ที่มีชื่อผูกกับ Slot อื่นที่ยังเปิดอยู่ (ห้ามใส่ซ้ำชื่อ)
                      const isAlreadyAssignedElsewhere = allPositionSlots.some(s => 
                        s.candidateName && 
                        isSameCandidate(s.candidateName, c.fullName) && 
                        s.stage !== "cancelled" && 
                        s.slotId !== unassignedInterviewSlotModal.slotId
                      );
                      return !isAlreadyAssignedElsewhere;
                    });

                    if (availableCandidates.length === 0) {
                      return (
                        <div className="p-4 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-xl text-xs">
                          ไม่มีผู้สมัครที่พร้อมแมป (ผู้สมัครท่านอื่นถูกผูกกับตำแหน่งไปแล้ว หรือสถานะไม่พร้อม)
                        </div>
                      );
                    }

                    return availableCandidates.map(cand => (
                      <div
                        key={cand.candidateId}
                        onClick={() => handleSelectSlotForCandidate(unassignedInterviewSlotModal, cand)}
                        className="p-3 rounded-xl bg-slate-50 hover:bg-sky-50 dark:bg-slate-800 dark:hover:bg-sky-950/60 border border-slate-200 dark:border-slate-700 hover:border-sky-500 transition cursor-pointer flex items-center justify-between group active:scale-[0.99] select-none"
                      >
                        <div className="min-w-0 pr-2">
                          <div className="font-bold text-slate-900 dark:text-white text-xs truncate group-hover:text-sky-600">{cand.fullName}</div>
                          <div className="text-[11px] text-slate-500 dark:text-slate-400 truncate">{cand.targetJobTitle} &bull; {cand.phone || "-"}</div>
                        </div>
                        <span className="text-xs font-bold text-sky-600 bg-sky-100/80 dark:bg-sky-950 px-2.5 py-1 rounded-lg shrink-0 group-hover:bg-sky-600 group-hover:text-white transition">
                          เลือก &rarr;
                        </span>
                      </div>
                    ));
                  })()}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    type="button"
                    onClick={() => setUnassignedInterviewSlotModal(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Schedule Interview Assignment Modal */}
          {scheduleAssignModalData && scheduleAssignModalData.candidate && scheduleAssignModalData.targetSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-sky-300 dark:border-sky-800 overflow-hidden flex flex-col max-h-[92vh]">
                
                {/* Header */}
                <div className="px-6 py-4 bg-gradient-to-r from-sky-600 to-indigo-600 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-lg">
                      🗓️
                    </div>
                    <div>
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200 block">
                        CANDIDATE ASSIGNMENT &amp; SCHEDULING
                      </span>
                      <h3 className="text-sm sm:text-base font-extrabold text-white mt-0.5">
                        นัดหมายสัมภาษณ์ &amp; จับคู่ตำแหน่งงาน
                      </h3>
                    </div>
                  </div>
                  <button 
                    onClick={() => setScheduleAssignModalData(null)} 
                    className="p-1.5 text-white/80 hover:text-white rounded-lg hover:bg-white/10 transition"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Body */}
                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {/* Summary Box */}
                  <div className="p-3.5 rounded-2xl bg-sky-50/70 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-900/60 space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="text-slate-500 dark:text-slate-400 text-[11px]">ผู้สมัครที่เลือก:</span>
                      <span className="font-extrabold text-sky-700 dark:text-sky-300 text-xs">
                        👤 {scheduleAssignModalData.candidate.fullName} {scheduleAssignModalData.candidate.nickname ? `(${scheduleAssignModalData.candidate.nickname})` : ''}
                      </span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-slate-500 dark:text-slate-400 text-[11px]">ตำแหน่งงาน (Slot):</span>
                      <span className="font-bold text-slate-900 dark:text-white text-xs">
                        {scheduleAssignModalData.targetSlot.jobTitle} (#{scheduleAssignModalData.targetSlot.slotId})
                      </span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-slate-500 dark:text-slate-400 text-[11px]">ฝ่ายงาน:</span>
                      <span className="font-semibold text-slate-700 dark:text-slate-300 text-[11px]">
                        {scheduleAssignModalData.targetSlot.department}
                      </span>
                    </div>
                  </div>

                  {/* ⚡ Live Appointment Summary Banner */}
