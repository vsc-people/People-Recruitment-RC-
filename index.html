              slotEffectiveStatus = "Closed";
            } else if (String(slotEffectiveStatus).toLowerCase().includes("pending")) {
              slotEffectiveStatus = slot.slotStatus || slotWfStatus;
            }

            const resolvedDriveUrl = slot.resumeUrl || matchedCand?.resumeUrl || matchedCand?.driveUrl || "";

            return {
              ...r,
              slotId: slot.slotId,
              slotIndex: actualSlotIndex,
              totalSlots: actualTotalSlots,
              slotStatus: slotEffectiveStatus,
              workflowStatus: slotWfStatus,
              requestStatus: slotEffectiveStatus,
              parentRequestId: r.id,
              candidateName: slot.candidateName || matchedCand?.fullName || "",
              candidatePhone: slot.candidatePhone || matchedCand?.phone || "",
              candidateNickname: slot.candidateNickname || matchedCand?.nickname || "",
              resumeUrl: resolvedDriveUrl,
              driveUrl: resolvedDriveUrl,
              stage: effectiveStage,
              priority: slot.priority || r.priority || "NORMAL",
              offerSentDate: slot.offerSentDate || r.offerSentDate || "",
              interviewSchedule: interviewInfo,
              interviewScore: currentEvals.length > 0 ? evalStats.combinedAvg : (slot.interviewScore || 0),
              interviewScorePercent: currentEvals.length > 0 ? evalStats.combinedPct : (slot.interviewScorePercent || 0),
              interviewResult: currentEvals.length > 0 ? evalStats.result : (slot.interviewResult || ""),
              evaluations: currentEvals,
              evaluationsCount: currentEvals.length,
              division: slot.division || r.division || "-",
              workLocation: slot.workLocation || r.workLocation || matchedCand?.branch || r.branch || "Dusit Central Park",
              replacedEmployeeName: r.replacedEmployeeName || "",
              hireDate: matchedCand?.hireDate || slot.hireDate || "",
              onboardingArrivalStatus: arrivalStatus,
              itEquipmentConfirmed: Boolean(slot.itEquipmentConfirmed),
              hasAttendedFirstDayTraining: Boolean(slot.hasAttendedFirstDayTraining || arrivalStatus === "arrived_reported"),
              rejectionReason: slot.rejectionReason || r.rejectionReason || "",
              authorizedEmails: normalizeAuthorizedEmails(slot.authorizedEmails),
              isArchivedFromKanban: !!slot.isArchivedFromKanban,
              isItNotified: Boolean(slot.isItNotified || r.isItNotified)
            };
          });
        });
      }, [requests, candidatePool, deletedReqIds, deletedSlotIds]);
      // Slot-level In Process and Closed lists
      const inProcessSlots = useMemo(() => {
        const seen = new Set();
        return allPositionSlots.filter(s => {
          if (seen.has(s.slotId)) return false;
          // หากสถานะเป็น Closed แล้ว ให้ไปอยู่ในแท็บ Closed
          if (s.slotStatus === "Closed" || String(s.slotStatus || "").trim().toLowerCase() === "closed") {
            return false;
          }
          // หากยกเลิกหรือถูกปฏิเสธ ไม่แสดงใน In Progress
          if (
            s.stage === "cancelled" ||
            s.slotStatus === "Cancelled" ||
            s.slotStatus === "REJECTED_BY_ADMIN" ||
            s.workflowStatus === "REJECTED_BY_ADMIN" ||
            s.onboardingArrivalStatus === "declined_noshow"
          ) {
            return false;
          }
          seen.add(s.slotId);
          return true;
        });
      }, [allPositionSlots]);

      const closedSlots = useMemo(() => {
        const seen = new Set();
        return allPositionSlots.filter(s => {
          if (seen.has(s.slotId)) return false;

          const status = String(s.slotStatus || "").trim().toLowerCase();
          const wfStatus = String(s.workflowStatus || "").trim().toLowerCase();
          const stage = String(s.stage || "").trim().toLowerCase();

          // 1. ตัดสถานะ Pending ออกอย่างเด็ดขาด (ห้ามมี Pending Approver, Pending Admin, Pending IT ปน)
          if (status.includes("pending") || wfStatus.includes("pending")) {
            return false;
          }

          // 2. ตัดสเตจที่ไม่ใช่ Closed/Onboarded ออก (ห้ามมี received, manpower, interview, cancelled ปน)
          if (stage === "received" || stage === "manpower" || stage === "interview" || stage === "cancelled") {
            return false;
          }

          // 3. ตัดรายการที่ยกเลิกหรือสละสิทธิ์
          if (status.includes("cancel") || status.includes("reject") || s.onboardingArrivalStatus === "declined_noshow") {
            return false;
          }

          // 4. แสดงเฉพาะรายการที่สถานะเป็น "Closed" เท่านั้น
          if (s.slotStatus !== "Closed" && status !== "closed") {
            return false;
          }

          seen.add(s.slotId);
          return true;
        });
      }, [allPositionSlots]);

      const positionFilterOptions = useMemo(() => {
        const set = new Set();
        candidatePool.forEach(c => {
          if (c.targetJobTitle && c.targetJobTitle.trim()) {
            set.add(c.targetJobTitle.trim());
          }
        });
        return Array.from(set);
      }, [candidatePool]);

      const filteredCandidates = useMemo(() => {
        return candidatePool.filter(c => {
          const matchesQuery = !candidateSearchQuery.trim() ||
            c.fullName?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.nickname?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.phone?.includes(candidateSearchQuery) ||
            c.targetJobTitle?.toLowerCase().includes(candidateSearchQuery.toLowerCase());

          const matchesPos = candidatePositionFilter === "ALL" || c.targetJobTitle === candidatePositionFilter;
          const matchesStatus = selectedStatusFilter === "ALL" || c.status === selectedStatusFilter;

          return matchesQuery && matchesPos && matchesStatus;
        });
      }, [candidatePool, candidateSearchQuery, candidatePositionFilter, selectedStatusFilter]);

      const availableUnassignedSlots = useMemo(() => {
        return allPositionSlots.filter(s => !s.candidateName && s.stage !== "cancelled" && s.stage !== "onboarded" && s.slotStatus !== "Closed");
      }, [allPositionSlots]);

      const departmentStats = useMemo(() => {
        const statsMap = {};
        DEPARTMENTS.forEach(dept => {
          if (dept !== "-") {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }
        });

        allPositionSlots.forEach(s => {
          const dept = s.department;
          if (!dept || dept === "-") return;
          if (!statsMap[dept]) {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }

          const reqDate = new Date(s.requestDate);
          const monthStr = String(reqDate.getMonth() + 1).padStart(2, '0');
          const yearStr = String(reqDate.getFullYear());

          const matchesMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchesYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

          if (matchesMonth && matchesYear) {
            statsMap[dept].total += 1;
            if (s.stage === "onboarded") {
              statsMap[dept].filled += 1;
            } else if (s.stage === "cancelled") {
              statsMap[dept].cancelled += 1;
            } else {
              statsMap[dept].open += 1;
            }
          }
        });

        return Object.entries(statsMap)
          .map(([department, counts]) => ({ department, ...counts }))
          .filter(d => d.total > 0)
          .sort((a, b) => b.total - a.total);
      }, [allPositionSlots, selectedMonthFilter, selectedYearFilter]);

      const departmentModalSlots = useMemo(() => {
        if (!selectedDepartmentDetail) return [];
        return allPositionSlots.filter(s => s.department === selectedDepartmentDetail);
      }, [allPositionSlots, selectedDepartmentDetail]);

      // Sorted Requisitions for Admin Review Queue (PENDING_ADMIN at the TOP)
      const sortedAdminRequisitions = useMemo(() => {
        const priorityWeight = {
          "PENDING_ADMIN": 1,
          "PENDING_APPROVER": 2,
          "PENDING_IT": 3,
          "READY_FOR_RECRUITMENT": 4,
          "Recruiting": 5,
          "REJECTED_BY_ADMIN": 6,
          "Closed": 7
        };

        const filtered = requests.filter(r => {
          const statusMatch = reqQueueFilter === "ALL" || (r.requestStatus || r.workflowStatus || "PENDING_ADMIN") === reqQueueFilter;
          const query = reqQueueSearch.toLowerCase().trim();
          const queryMatch = !query ||
            r.id?.toLowerCase().includes(query) ||
            r.jobTitle?.toLowerCase().includes(query) ||
            r.requesterName?.toLowerCase().includes(query) ||
            r.department?.toLowerCase().includes(query) ||
            r.approverName?.toLowerCase().includes(query);
          return statusMatch && queryMatch;
        });

        return filtered.sort((a, b) => {
          const statusA = a.requestStatus || a.workflowStatus || "PENDING_ADMIN";
          const statusB = b.requestStatus || b.workflowStatus || "PENDING_ADMIN";
          const weightA = priorityWeight[statusA] || 99;
          const weightB = priorityWeight[statusB] || 99;

          if (weightA !== weightB) {
            return weightA - weightB;
          }
          // Secondary sort: newest request date first
          return new Date(b.requestDate || 0) - new Date(a.requestDate || 0);
        });
      }, [requests, reqQueueFilter, reqQueueSearch]);

      const pendingAdminCount = useMemo(() => {
        return requests.filter(r => (r.requestStatus || r.workflowStatus || "PENDING_ADMIN") === "PENDING_ADMIN").length;
      }, [requests]);

      // 📊 Real-Time TA Dashboard Summary Aggregation (สำหรับส่งลง Google Sheet แท็บ TA_Dashboard_Summary เพื่อทำ Dashboard ต่อ)
      const taDashboardSummary = useMemo(() => {
        const now = new Date();
        const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const thaiMonthsFull = [
          "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
          "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];
        const thaiDateLabel = `${now.getDate()} ${thaiMonthsFull[now.getMonth()]} ${now.getFullYear() + 543}`;
        const updatedTimestamp = `${thaiDateLabel} ${now.toLocaleTimeString('th-TH')}`;

        // 1. กรองตำแหน่งที่ไม่ถูกยกเลิก
        const validSlots = allPositionSlots.filter(s =>
          s.stage !== "cancelled" &&
          s.slotStatus !== "Cancelled" &&
          s.slotStatus !== "REJECTED_BY_ADMIN" &&
          s.onboardingArrivalStatus !== "declined_noshow"
        );

        const openSlots = validSlots.filter(s => s.slotStatus !== "Closed" && s.stage !== "onboarded");
        const filledSlots = validSlots.filter(s => s.slotStatus === "Closed" || s.stage === "onboarded");

        const totalRequiredHeadcount = validSlots.length;
        const filledHeadcount = filledSlots.length;
        const pendingHeadcount = openSlots.length;
        const fillRatePct = totalRequiredHeadcount > 0
          ? Number(((filledHeadcount / totalRequiredHeadcount) * 100).toFixed(1))
          : 0;

        // กลุ่มระดับใบคำขอ (Requisition Level)
        const validReqs = requests.filter(r =>
          !deletedReqIds.has(r.id) &&
          r.stage !== "cancelled" &&
          r.requestStatus !== "REJECTED_BY_ADMIN" &&
          r.workflowStatus !== "REJECTED_BY_ADMIN"
        );
        const openReqSet = new Set(openSlots.map(s => s.parentRequestId || s.id));
        const openPositionsCount = openReqSet.size;
        const totalPositionsCount = validReqs.length;

        // อายุเฉลี่ยของตำแหน่งที่เปิด (นับจากวันที่เปิดรับ Request Date ถึงวันนี้)
        let totalOpenAgeDays = 0;
        let openAgeCount = 0;
        openSlots.forEach(s => {
          if (s.requestDate) {
            const dStart = new Date(s.requestDate);
            if (!isNaN(dStart.getTime())) {
              const diffDays = Math.max(0, Math.round((todayMidnight.getTime() - dStart.getTime()) / (1000 * 60 * 60 * 24)));
              totalOpenAgeDays += diffDays;
              openAgeCount += 1;
            }
          }
        });
        const avgOpenAgeDays = openAgeCount > 0 ? Math.round(totalOpenAgeDays / openAgeCount) : 0;

        // ตำแหน่งเลยกำหนดสรรหา (เลย Target Start Date แล้วยังรับไม่ครบ หรือเกิน SLA 30 วันทำการ)
        const overdueReqIds = new Set();
        openSlots.forEach(s => {
          const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
          let isPastTarget = false;
          if (s.targetDate) {
            const dTarget = new Date(s.targetDate);
            if (!isNaN(dTarget.getTime()) && todayMidnight > dTarget) {
              isPastTarget = true;
            }
          }
          if (isPastTarget || sla.isOverdue) {
            overdueReqIds.add(s.parentRequestId || s.id);
          }
        });
        const overduePositionsCount = overdueReqIds.size;

        // 2. ประสิทธิภาพการสรรหา (Recruitment Efficiency)
        const offerOrBeyondSlots = validSlots.filter(s =>
          s.stage === "offer" || s.stage === "onboarded" || s.slotStatus === "Closed"
        );
        const offerAcceptancePct = offerOrBeyondSlots.length > 0
          ? Number(((filledHeadcount / offerOrBeyondSlots.length) * 100).toFixed(1))
          : 0;

        let totalTimeToFillDays = 0;
        let closedWithDurationCount = 0;
        filledSlots.forEach(s => {
          const dur = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
          if (s.requestDate) {
            totalTimeToFillDays += dur.totalDays;
            closedWithDurationCount += 1;
          }
        });
        const avgTimeToFillDays = closedWithDurationCount > 0
          ? Math.round(totalTimeToFillDays / closedWithDurationCount)
          : null;

        // 3. Recruitment Funnel (ผู้สมัคร -> สัมภาษณ์ -> Offer -> รับเข้าแล้ว)
        const activeCandidates = candidatePool.filter(c => c.status !== "not suitable" && c.status !== "cancel by candidate");
        const totalApplicantsCount = Math.max(candidatePool.length, validSlots.filter(s => s.candidateName).length);
        const interviewStageCount = Math.max(
          allPositionSlots.filter(s => s.stage === "interview" || s.stage === "offer" || s.stage === "onboarded" || s.slotStatus === "Closed").filter(s => s.candidateName).length,
          activeCandidates.filter(c => c.assignedSlotId || c.interviewDate).length
        );
        const offerStageCount = offerOrBeyondSlots.length;
        const hiredStageCount = filledHeadcount;

        const appToInterviewPct = totalApplicantsCount > 0
          ? Number(((interviewStageCount / totalApplicantsCount) * 100).toFixed(1))
          : 0;
        const interviewToOfferPct = interviewStageCount > 0
          ? Number(((offerStageCount / interviewStageCount) * 100).toFixed(1))
          : 0;
        const offerToHirePct = offerStageCount > 0
          ? Number(((hiredStageCount / offerStageCount) * 100).toFixed(1))
          : 0;

        // 4. สถานการณ์สรรหา แยกตามสเตจ (จำนวนตำแหน่ง / อัตรา)
        const stageSummary = STAGES.map(stg => {
          const slotsInStg = allPositionSlots.filter(s => s.stage === stg.id);
          const uniqueReqsInStg = new Set(slotsInStg.map(s => s.parentRequestId || s.id));
          return {
            stageId: stg.id,
            stageLabel: stg.label,
            positionCount: uniqueReqsInStg.size,
            headcount: slotsInStg.length
          };
        });

        // 5. Headcount รอสรรหา แยกแผนก (Department Breakdown)
        const deptMap = {};
        validSlots.forEach(s => {
          const dept = (s.department && s.department !== "-") ? s.department : "ไม่ระบุแผนก";
          if (!deptMap[dept]) {
            deptMap[dept] = { department: dept, required: 0, filled: 0, remaining: 0, reqIds: new Set() };
          }
          deptMap[dept].required += 1;
          if (s.slotStatus === "Closed" || s.stage === "onboarded") {
            deptMap[dept].filled += 1;
          } else {
            deptMap[dept].remaining += 1;
            deptMap[dept].reqIds.add(s.parentRequestId || s.id);
          }
        });
        const departmentBreakdown = Object.values(deptMap)
          .map(d => ({
            department: d.department,
            openPositions: d.reqIds.size,
            required: d.required,
            filled: d.filled,
            remaining: d.remaining,
            fillRatePct: d.required > 0 ? Number(((d.filled / d.required) * 100).toFixed(1)) : 0
          }))
          .sort((a, b) => b.remaining - a.remaining || b.required - a.required);

        // 6. ภาระงานผู้รับผิดชอบ (อัตราที่ค้าง)
        const ownerMap = {};
        openSlots.forEach(s => {
          const owner = (s.requesterName && s.requesterName !== "-") ? s.requesterName : "ไม่ระบุผู้รับผิดชอบ";
          if (!ownerMap[owner]) {
            ownerMap[owner] = { owner, remainingHeadcount: 0, reqIds: new Set() };
          }
          ownerMap[owner].remainingHeadcount += 1;
          ownerMap[owner].reqIds.add(s.parentRequestId || s.id);
        });
        const workloadByOwner = Object.values(ownerMap)
          .map(o => ({
            owner: o.owner,
            openPositions: o.reqIds.size,
            remainingHeadcount: o.remainingHeadcount
          }))
          .sort((a, b) => b.remainingHeadcount - a.remainingHeadcount);

        // 7. Headcount รอสรรหา แยกประเภทพนักงาน / กลุ่ม (VSC / Full-Time / Contract / Outsource)
        const groupMap = {
          "VSC": { group: "VSC", required: 0, filled: 0, remaining: 0 }
        };
        validSlots.forEach(s => {
          const empGroup = (s.employeeGroup && s.employeeGroup.trim()) ? s.employeeGroup.trim() : "VSC";
          if (!groupMap[empGroup]) {
            groupMap[empGroup] = { group: empGroup, required: 0, filled: 0, remaining: 0 };
          }
          groupMap[empGroup].required += 1;
          if (s.slotStatus === "Closed" || s.stage === "onboarded") {
            groupMap[empGroup].filled += 1;
          } else {
            groupMap[empGroup].remaining += 1;
          }
        });
        const employeeGroupBreakdown = Object.values(groupMap).sort((a, b) => b.remaining - a.remaining);

        // 8. แหล่งที่มาของผู้สมัครและผู้ได้รับการรับเข้า (Source of Hire)
        const sourceMap = {};
        candidatePool.forEach(c => {
          const src = (c.source && c.source.trim()) ? c.source.trim() : "ไม่ระบุช่องทาง";
          if (!sourceMap[src]) {
            sourceMap[src] = { source: src, totalApplicants: 0, hiredCount: 0 };
          }
          sourceMap[src].totalApplicants += 1;
          const isHired = c.status === "Hiring / Offer" || filledSlots.some(fs =>
            (c.assignedSlotId && fs.slotId === c.assignedSlotId) ||
            (fs.candidateName && isSameCandidate(fs.candidateName, c.fullName))
          );
          if (isHired) {
            sourceMap[src].hiredCount += 1;
          }
        });
        const sourceOfHireBreakdown = Object.values(sourceMap)
          .sort((a, b) => b.hiredCount - a.hiredCount || b.totalApplicants - a.totalApplicants);

        // 9. ตารางรายละเอียด Requisition (เรียงตำแหน่งที่ยังเปิดและค้างนานสุดก่อน ตามรูปที่ 5)
        const reqDetailRows = validReqs.map(r => {
          const rSlots = validSlots.filter(s => (s.parentRequestId || s.id) === r.id);
          const reqCount = Math.max(rSlots.length, Number(r.headcountRequired) || 1);
          const filledCnt = rSlots.filter(s => s.slotStatus === "Closed" || s.stage === "onboarded").length;
          const remCnt = Math.max(0, reqCount - filledCnt);
          const openAge = r.requestDate ? Math.max(0, Math.round((todayMidnight.getTime() - new Date(r.requestDate).getTime()) / (1000 * 60 * 60 * 24))) : 0;
          let isOverdue = false;
          if (remCnt > 0) {
            if (r.targetDate && todayMidnight > new Date(r.targetDate)) isOverdue = true;
            if (calculateWorkingDays(r.requestDate, null) > STANDARD_SLA_WORKING_DAYS) isOverdue = true;
          }
          const closedSlot = rSlots.find(s => s.slotStatus === "Closed" || s.stage === "onboarded");
          const ttfDays = (remCnt === 0 && closedSlot)
            ? getRecruitmentDurationInfo(r.requestDate, closedSlot.hireDate, closedSlot.lastUpdated).totalDays
            : null;

          return {
            reqId: r.id,
            jobTitle: r.jobTitle || "-",
            department: (r.department && r.department !== "-") ? r.department : (r.division || "-"),
            division: r.division || "-",
            employeeGroup: r.employeeGroup || "VSC",
            requesterName: r.requesterName || "-",
            requestDate: r.requestDate || "-",
            targetDate: r.targetDate || "-",
            closedDate: remCnt === 0 ? (closedSlot?.hireDate || r.lastUpdated?.split(' ')[0] || "-") : "-",
            required: reqCount,
            filled: filledCnt,
            remaining: remCnt,
            fillRatePct: reqCount > 0 ? Number(((filledCnt / reqCount) * 100).toFixed(1)) : 0,
            openAgeDays: openAge,
            isOverdue,
            overdueLabel: isOverdue ? "เลยกำหนด" : (remCnt === 0 ? "ปิดแล้ว" : "ปกติ"),
            timeToFillDays: ttfDays !== null ? ttfDays : "-",
            stage: rSlots[0]?.stage || r.stage || "received",
            status: remCnt === 0 ? "Closed" : "Open"
          };
        }).sort((a, b) => {
          if (a.remaining > 0 && b.remaining === 0) return -1;
          if (a.remaining === 0 && b.remaining > 0) return 1;
          return b.openAgeDays - a.openAgeDays;
        });

        return {
          updatedTimestamp,
          thaiDateLabel,
          overview: {
            openPositionsCount,
            totalPositionsCount,
            totalRequiredHeadcount,
            filledHeadcount,
            pendingHeadcount,
            fillRatePct,
            avgOpenAgeDays,
            overduePositionsCount
          },
          efficiency: {
            offerAcceptancePct,
            offerTotalCount: offerOrBeyondSlots.length,
            avgTimeToFillDays,
            costPerHire: null,
            hiredTotalCount: filledHeadcount
          },
          funnel: {
            applicants: totalApplicantsCount,
            interview: interviewStageCount,
            offer: offerStageCount,
            hired: hiredStageCount,
            appToInterviewPct,
            interviewToOfferPct,
            offerToHirePct
          },
          stageSummary,
          departmentBreakdown,
          workloadByOwner,
          employeeGroupBreakdown,
          sourceOfHireBreakdown,
          reqDetailRows
        };
      }, [allPositionSlots, requests, deletedReqIds, candidatePool]);

      // ส่งข้อมูลสรุปภาพรวมเรียลไทม์ไปยัง Google Sheet แท็บ GID 1491221874 ("TA_Dashboard_Summary")
      const syncTADashboardSummaryToSheet = async (manualTrigger = false) => {
        const targetUrls = [googleScriptUrl, BACKUP_APPS_SCRIPT_WEBAPP_URL].filter((u, i, arr) => u && arr.indexOf(u) === i);
        if (targetUrls.length === 0) return;

        if (manualTrigger) setIsSyncingSummarySheet(true);
        try {
          const payload = {
            action: "syncTADashboardSummary",
            sheetGid: DASHBOARD_SUMMARY_SHEET_GID,
            sheetName: "TA_Dashboard_Summary",
            summary: taDashboardSummary
          };

          targetUrls.forEach(scriptUrl => {
            fetch(scriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          });

          const timeNowStr = new Date().toLocaleTimeString('th-TH');
          setLastSummarySyncedAt(timeNowStr);
          if (manualTrigger) {
            triggerToast(`📊 อัปเดตสรุปภาพรวมเรียลไทม์ลงชีท GID ${DASHBOARD_SUMMARY_SHEET_GID} เรียบร้อย (${timeNowStr})`);
          }
        } catch (err) {
          if (manualTrigger) triggerToast("⚠️ ไม่สามารถซิงค์ชีทสรุปได้ กรุณาตรวจสอบ Web App URL");
        } finally {
          if (manualTrigger) setIsSyncingSummarySheet(false);
        }
      };

      const copyDashboardSummaryAppsScript = () => {

      const handleSaveNewCandidate = async (e) => {
        e.preventDefault();
        
        // Strict Validation: Ensure all fields are filled
        const candidateValidationRules = [
          { val: newCandidateForm.fullName, name: "Full Name (ชื่อ - นามสกุล)" },
          { val: newCandidateForm.nickname, name: "Nickname (ชื่อเล่น)" },
          { val: newCandidateForm.phone, name: "Phone Number (เบอร์โทรศัพท์)" },
          { val: newCandidateForm.targetJobTitle, name: "Target Role / Position (ตำแหน่งที่สนใจ)" },
          { val: newCandidateForm.level, name: "Level (ระดับตำแหน่ง)" },
          { val: newCandidateForm.branch, name: "Branch (สาขา)" },
          { val: newCandidateForm.type, name: "Employment Type (ประเภทสัญญาจ้าง)" },
          { val: newCandidateForm.mbti, name: "MBTI (บุคลิกภาพ)" },
          { val: newCandidateForm.status, name: "Initial Status (สถานะเริ่มต้น)" },
          { val: newCandidateForm.source, name: "Application Channel / Source (ช่องทางรับสมัคร)" },
          { val: newCandidateForm.resumeUrl, name: "Google Drive Document Link - CV / Resume (ลิงก์ Google Drive เอกสารสมัครงาน)" },
          { val: newCandidateForm.remark, name: "Remarks / Notes (หมายเหตุ / ประวัติย่อ)" }
        ];

        const missing = candidateValidationRules.filter(item => {
          if (!item.val) return true;
          const s = String(item.val).trim();
          return s === "" || s === "-";
        });

        if (missing.length > 0) {
          triggerToast(`⚠️ ข้อมูลไม่ครบถ้วน: กรุณาระบุ "${missing[0].name}" (ยังเหลืออีก ${missing.length} ช่องที่ต้องตอบ)`);
          return;
        }

        const now = new Date();
        const year = String(now.getFullYear());
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const nextNo = candidatePool.length + 1;
        const candidateId = `CAND-${year}-${String(nextNo).padStart(3, '0')}`;

        const newCandObj = {
          no: nextNo,
          year,
          month,
          candidateId,
          ...newCandidateForm,
          assignedSlotId: ""
        };

        const updatedPool = [newCandObj, ...candidatePool];
        setCandidatePool(updatedPool);
        localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(updatedPool));
        broadcastCentralSync(requests, updatedPool);
        setShowAddCandidateModal(false);
        setNewCandidateForm(initialCandidateForm);

        try {
          if (googleScriptUrl) {
            await fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({ 
                action: "addCandidate", 
                sheetGid: "546067727",
                candidate: newCandObj 
              })
            });
            triggerToast(`เพิ่มคุณ ${newCandObj.fullName} สำเร็จ & ซิงค์ลง Google Sheet (GID 546067727) แล้ว!`);
          } else {
            triggerToast(`เพิ่มคุณ ${newCandObj.fullName} เรียบร้อย!`);
          }
        } catch (err) {
          triggerToast(`เพิ่มคุณ ${newCandObj.fullName} สำเร็จ (แคชออฟไลน์)`);
        }
      };

      const handleSelectSlotForCandidate = (slot, candidateOverride = null) => {
        const cand = candidateOverride || slotPickerCandidate;
        if (!cand) return;

        // 🔒 ตรวจสอบป้องกันการเลือก Candidate ซ้ำชื่อ: หากชื่อนี้ผูกกับตำแหน่งอื่นที่ยังไม่ถูกยกเลิก จะไม่สามารถใส่ซ้ำได้
        const isDuplicateCandidate = allPositionSlots.some(s => 
          s.candidateName && 
          isSameCandidate(s.candidateName, cand.fullName) && 
          s.slotId !== slot.slotId && 
          s.stage !== "cancelled"
        );

        if (isDuplicateCandidate) {
          triggerToast(`⚠️ ไม่สามารถเลือกได้: คุณ ${cand.fullName} มีรายชื่อในตำแหน่งอื่นอยู่แล้ว (ห้ามใส่ผู้สมัครซ้ำ)`);
          return;
        }

        setSlotPickerCandidate(null);

        const now = new Date();
        now.setDate(now.getDate() + 3);
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const defaultDate = `${yyyy}-${mm}-${dd}`;

        let initDate = defaultDate;
        let initTime = "10:00";
        if (cand.interviewDate) {
          const parts = cand.interviewDate.split(/[T ]/);
          if (parts[0]) initDate = parts[0];
          if (parts[1]) initTime = parts[1].substring(0, 5);
        }

        setScheduleAssignModalData({ candidate: cand, targetSlot: slot });
        setScheduleInterviewDate(initDate);
        setScheduleInterviewTime(initTime || "10:00");
        setScheduleInterviewFormat("Online (google Meet)");
        setScheduleGoogleMeetUrl(cand.googleMeetUrl || "");
      };

      const handleConfirmScheduleAssign = () => {
        if (!scheduleAssignModalData || !scheduleAssignModalData.candidate || !scheduleAssignModalData.targetSlot) return;
        const { candidate, targetSlot } = scheduleAssignModalData;
        if (!scheduleInterviewDate) {
          triggerToast("⚠️ กรุณาระบุวันที่นัดสัมภาษณ์");
          return;
        }

        // 🔒 ตรวจสอบซ้ำป้องกันการบันทึกผู้สมัครซ้ำในระบบ
        const isDuplicateCandidate = allPositionSlots.some(s => 
          s.candidateName && 
          isSameCandidate(s.candidateName, candidate.fullName) && 
          s.slotId !== targetSlot.slotId && 
          s.stage !== "cancelled"
        );
        if (isDuplicateCandidate) {
          triggerToast(`⚠️ ไม่สามารถนัดสัมภาษณ์ได้: คุณ ${candidate.fullName} มีรายชื่ออยู่ในตำแหน่งอื่นแล้ว`);
          return;
        }

        const dtDisplay = `${scheduleInterviewDate} ${scheduleInterviewTime || "10:00"} น.`;
        const meetUrlClean = scheduleGoogleMeetUrl ? scheduleGoogleMeetUrl.trim() : "";
        const meetSuffix = (scheduleInterviewFormat === "Online (google Meet)" && meetUrlClean) ? ` (${meetUrlClean})` : "";
        const scheduledInfo = `${dtDisplay} (${scheduleInterviewFormat})${meetSuffix}`;
        const combinedIso = `${scheduleInterviewDate}T${scheduleInterviewTime || "10:00"}`;

        const updatedCandidates = candidatePool.map(c => {
          if (c.candidateId === candidate.candidateId) {
            return {
              ...c,
              assignedSlotId: targetSlot.slotId,
              interviewDate: combinedIso,
              googleMeetUrl: meetUrlClean
            };
          }
          if (c.assignedSlotId === targetSlot.slotId) {
            return { ...c, assignedSlotId: "" };
          }
          return c;
        });

        const updatedRequests = requests.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === targetSlot.slotId) {
              return {
                ...s,
                candidateName: candidate.fullName,
                candidatePhone: candidate.phone,
                candidateNickname: candidate.nickname,
                resumeUrl: candidate.resumeUrl,
                stage: "interview",
                interviewSchedule: scheduledInfo,
                googleMeetUrl: meetUrlClean,
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",
                evaluations: []
              };
            }
            return s;
          });
          return { ...r, stage: "interview", slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
        });

        setCandidatePool(updatedCandidates);
        setRequests(updatedRequests);
        localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(updatedCandidates));
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));

        // 🌟 ส่งสัญญาณกระจายไปยังทุกหน้าต่างทันทีพร้อมข้อมูลเต็ม (0ms)
        broadcastCentralSync(updatedRequests, updatedCandidates);

        // 🔄 ส่งข้อมูลอัปเดตไปยังศูนย์กลาง
        sendCentralSlotStageUpdate(targetSlot.slotId, {
          stage: "interview",
          slotStatus: "READY_FOR_RECRUITMENT",
          candidateName: candidate.fullName,
          candidatePhone: candidate.phone,
          candidateNickname: candidate.nickname,
          interviewSchedule: scheduledInfo,
          googleMeetUrl: meetUrlClean
        }, updatedRequests);

        setScheduleAssignModalData(null);
        setUnassignedInterviewSlotModal(null);
        triggerToast(`แมปคุณ ${candidate.fullName} เข้าสู่ Slot #${targetSlot.slotId} สำเร็จ`);

        // 🔄 ส่งชื่อและลิงก์ Google Drive ไปลงบันทึกในแผ่นงาน "แบบขอกำลังคน" (GID 1528284561) ทันที
        syncSlotToManpowerSheet({
          ...targetSlot,
          candidateName: candidate.fullName,
          candidatePhone: candidate.phone,
          resumeUrl: candidate.resumeUrl
        }, true);
      };

      const handleSendITNotification = async (slotItem) => {
        if (!slotItem) return;
        if (!googleScriptUrl) {
          triggerToast("⚠️ กรุณาตั้งค่า Google Apps Script Web App URL ก่อนส่งอีเมล");
          return;
        }

        // ค้นหาข้อมูลผู้สมัครจาก candidatePool เพื่อดึงชื่อและสาขา (branch)
        const cand = candidatePool.find(c => 
          c.assignedSlotId === slotItem.slotId || 
          (slotItem.candidateName && c.fullName === slotItem.candidateName)
        );

        const candidateName = slotItem.candidateName || cand?.fullName || "พนักงานใหม่";
        const hireDate = slotItem.hireDate || cand?.hireDate || "ยังไม่ระบุวันเริ่มงาน";
        const branch = slotItem.workLocation || cand?.branch || slotItem.branch || "Dusit Central Park";
        const division = slotItem.division || slotItem.department || "-";

        try {
          triggerToast(`⏳ กำลังส่งอีเมลแจ้งทีม IT (people@valuesourcing.co) สำหรับ K. ${candidateName}...`);

          await fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "sendITNotificationEmail",
              reqId: slotItem.parentRequestId || slotItem.id,
              slotId: slotItem.slotId,
              jobTitle: slotItem.jobTitle,
              department: slotItem.department,
              division: division,
              candidateName: candidateName,
              branch: branch,
              workLocation: branch,
              hireDate: hireDate,
              itLaptop: slotItem.itLaptop || "ต้องการ",
              itEmail: slotItem.itEmail || "ต้องการ",
              itSimCard: slotItem.itSimCard || "ไม่ต้องการ",
              itNetsuite: slotItem.itNetsuite || "ไม่ต้องการ"
            })
          });

          // อัปเดต state บันทึกสถานะว่าส่งแจ้ง IT ให้ Slot นี้แล้ว
          setRequests(prev => prev.map(r => {
            if (!r.slots) return r;
            const targetId = slotItem.parentRequestId || slotItem.id;
            if (r.id === targetId || r.slots.some(s => s.slotId === slotItem.slotId)) {
              const updatedSlots = r.slots.map(s => {
                if (s.slotId === slotItem.slotId) {
                  return { ...s, isItNotified: true };
                }
                return s;
              });
              return { ...r, slots: updatedSlots };
            }
            return r;
          }));

          // อัปเดต Modal Detail ทันทีหากกำลังเปิดดูอยู่
          setSelectedDetailSlot(prev => (prev && prev.slotId === slotItem.slotId ? { ...prev, isItNotified: true } : prev));

          triggerToast(`📧 ส่งข้อมูลแจ้งทีม IT (people@valuesourcing.co) สำเร็จแล้ว! (K. ${candidateName})`);
        } catch (err) {
          triggerToast(`❌ ส่งอีเมลไม่สำเร็จ: ${err.message || err}`);
        }
      };

      const handleUnassignCandidate = (targetSlotId, candidateFullName = "") => {
        let resolvedCandidateName = candidateFullName;
        if (!resolvedCandidateName) {
          for (const r of requests) {
            const found = (r.slots || []).find(s => s.slotId === targetSlotId);
            if (found && found.candidateName) {
              resolvedCandidateName = found.candidateName;
              break;
            }
          }
        }

        const updatedPool = candidatePool.map(c => {
          const isMatchedCandidate =
            c.assignedSlotId === targetSlotId ||
            (resolvedCandidateName && (c.fullName === resolvedCandidateName || isSameCandidate(c.fullName, resolvedCandidateName)));

          if (isMatchedCandidate) {
            return {
              ...c,
              assignedSlotId: "",
              status: c.status === "Hiring / Offer" ? "Pending" : c.status
            };
          }
          return c;
        });

        let nextSlotStatusForSync = "READY_FOR_RECRUITMENT";

        const updatedRequests = requests.map(r => {
          if (!r.slots) return r;
          let hasTargetSlot = false;
          const slots = r.slots.map(s => {
            if (s.slotId === targetSlotId) {
              hasTargetSlot = true;
              const preservedStatus =
                s.slotStatus &&
                s.slotStatus !== "Closed" &&
                s.slotStatus !== "PENDING_ADMIN" &&
                s.slotStatus !== "Cancelled"
                  ? s.slotStatus
                  : "READY_FOR_RECRUITMENT";
              nextSlotStatusForSync = preservedStatus;

              return {
                ...s,
                candidateName: "",
                candidatePhone: "",
                candidateNickname: "",
                resumeUrl: "",
                stage: "manpower",
                slotStatus: preservedStatus,
                workflowStatus: preservedStatus,
                stageUpdatedAt: Date.now(),
                interviewSchedule: "",
                googleMeetUrl: "",
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",
                evaluations: [],
                offerSentDate: "",
                hireDate: "",
                hasAttendedFirstDayTraining: false,
                onboardingArrivalStatus: "pending_arrival"
              };
            }
            return s;
          });

          if (!hasTargetSlot) return r;

          return {
            ...r,
            stage: slots.length === 1 ? "manpower" : r.stage,
            requestStatus: r.requestStatus === "Closed" ? "READY_FOR_RECRUITMENT" : r.requestStatus,
            workflowStatus: r.workflowStatus === "Closed" ? "READY_FOR_RECRUITMENT" : r.workflowStatus,
            slots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        });

        setCandidatePool(updatedPool);
        setRequests(updatedRequests);
        localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(updatedPool));
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        broadcastCentralSync(updatedRequests, updatedPool);
        sendCentralSlotStageUpdate(targetSlotId, {
          stage: "manpower",
          slotStatus: nextSlotStatusForSync,
          workflowStatus: nextSlotStatusForSync,
          candidateName: "",
          candidatePhone: "",
          candidateNickname: "",
          resumeUrl: "",
          interviewSchedule: "",
          googleMeetUrl: "",
          hireDate: "",
          offerSentDate: "",
          hasAttendedFirstDayTraining: false,
          onboardingArrivalStatus: "pending_arrival"
        }, updatedRequests);

        setSelectedDetailSlot(prev => {
          if (prev && prev.slotId === targetSlotId) {
            return {
              ...prev,
              candidateName: "",
              candidatePhone: "",
              candidateNickname: "",
              resumeUrl: "",
              stage: "manpower",
              slotStatus: nextSlotStatusForSync,
              workflowStatus: nextSlotStatusForSync,
              interviewSchedule: "",
              googleMeetUrl: "",
              interviewScore: 0,
              interviewScorePercent: 0,
              interviewResult: "",
              evaluations: [],
              offerSentDate: "",
              hireDate: "",
              hasAttendedFirstDayTraining: false,
              onboardingArrivalStatus: "pending_arrival"
            };
          }
          return prev;
        });

        setUnassignConfirmTarget(null);
        triggerToast(`ถอดรายชื่อผู้สมัครออกจาก Slot #${targetSlotId} และย้ายกลับสู่สเตจ 1. Manpower Request เรียบร้อยแล้ว`);
      };

      // Handler to delete candidate with slot detachment
      const handleConfirmDeleteCandidate = () => {
        if (!candidateToDelete) return;
        const targetId = candidateToDelete.candidateId;
        const targetName = candidateToDelete.fullName;
        const linkedSlotId = candidateToDelete.assignedSlotId;

        let updatedRequests = requests;
        // If candidate was assigned to a slot, detach from that slot across all views
        if (linkedSlotId) {
          updatedRequests = requests.map(r => {
            if (!r.slots) return r;
            const slots = r.slots.map(s => {
              if (s.slotId === linkedSlotId) {
                return {
                  ...s,
                  candidateName: "",
                  candidatePhone: "",
                  candidateNickname: "",
                  resumeUrl: "",
                  interviewSchedule: "",
                  evaluations: []
                };
              }
              return s;
            });
            return { ...r, slots };
          });
          setRequests(updatedRequests);
          localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
          sendCentralSlotStageUpdate(linkedSlotId, {
            candidateName: "",
            candidatePhone: "",
            candidateNickname: "",
            resumeUrl: "",
            interviewSchedule: ""
          }, updatedRequests);
        }

        const updatedPool = candidatePool.filter(c => c.candidateId !== targetId);
        setCandidatePool(updatedPool);
        localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(updatedPool));
        broadcastCentralSync(updatedRequests, updatedPool);
        triggerToast(`ลบข้อมูลคุณ ${targetName} ออกจากระบบเรียบร้อย`);
        setCandidateToDelete(null);
      };

      // Handler to update a slot's job title directly from Kanban card or Detail Modal
      const handleUpdateSlotJobTitle = (slotId, newTitle) => {
        const trimmedTitle = (newTitle || "").trim();
        if (!trimmedTitle) {
          triggerToast("⚠️ กรุณาระบุชื่อตำแหน่งงาน");
          return;
        }

        const updatedRequests = requests.map(r => {
          if (!r.slots) return r;
          let hasMatchingSlot = false;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              hasMatchingSlot = true;
              return { ...s, jobTitle: trimmedTitle, stageUpdatedAt: Date.now() };
            }
            return s;
          });

          if (hasMatchingSlot) {
            return {
              ...r,
              jobTitle: r.slots.length === 1 ? trimmedTitle : r.jobTitle,
              slots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        });

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        broadcastCentralSync(updatedRequests, candidatePool);
        sendCentralSlotStageUpdate(slotId, { jobTitle: trimmedTitle }, updatedRequests);

        setSelectedDetailSlot(prev => {
          if (prev && prev.slotId === slotId) {
            return { ...prev, jobTitle: trimmedTitle };
          }
          return prev;
        });

        setEditingCardTitleSlotId(null);
        setIsModalEditingTitle(false);
        triggerToast(`✏️ อัปเดตชื่อตำแหน่ง Slot #${slotId} เป็น "${trimmedTitle}" เรียบร้อยแล้ว`);
      };

      // Handler to duplicate a position slot (for evaluating multiple candidates on the same job role)
      const handleDuplicateSlot = (sourceSlot) => {
        if (!sourceSlot) return;
        const parentReqId = sourceSlot.parentRequestId || sourceSlot.id;
        let createdSlotPayload = null;

        const updatedRequests = requests.map(r => {
          if (r.id === parentReqId) {
            const currentSlots = (r.slots && r.slots.length > 0)
              ? [...r.slots]
              : [{
                  slotId: `${r.id}-1`,
                  slotIndex: 1,
                  slotStatus: r.requestStatus || "READY_FOR_RECRUITMENT",
                  candidateName: r.candidateName || "",
                  candidatePhone: r.candidatePhone || "",
                  candidateNickname: r.candidateNickname || "",
                  resumeUrl: r.resumeUrl || "",
                  stage: r.stage || "manpower"
                }];

            const nextIndex = currentSlots.length + 1;
            const newSlotId = `${r.id}-${nextIndex}`;
            
            // Keep in relevant recruitment stage, or default to manpower
            const defaultStage = (sourceSlot.stage === "onboarded" || sourceSlot.stage === "cancelled" || sourceSlot.stage === "received")
              ? "manpower"
              : (sourceSlot.stage || "manpower");

            const newClonedSlot = {
              slotId: newSlotId,
              slotIndex: nextIndex,
              slotStatus: "READY_FOR_RECRUITMENT",
              workflowStatus: "READY_FOR_RECRUITMENT",
              stage: defaultStage,
              stageUpdatedAt: Date.now(),
              candidateName: "",
              candidatePhone: "",
              candidateNickname: "",
              resumeUrl: "",
              interviewSchedule: "",
              interviewScore: 0,
              interviewScorePercent: 0,
              interviewResult: "",
              evaluations: [],
              offerSentDate: "",
              hireDate: "",
              onboardingArrivalStatus: "pending_arrival",
              rejectionReason: "",
              itEquipmentConfirmed: false,
              isItNotified: false,
              hasAttendedFirstDayTraining: false,
              isArchivedFromKanban: false,
              authorizedEmails: Array.isArray(sourceSlot.authorizedEmails) ? [...sourceSlot.authorizedEmails] : [],
              jobTitle: sourceSlot.jobTitle || r.jobTitle,
              priority: sourceSlot.priority || r.priority || "NORMAL"
            };

            createdSlotPayload = {
              slotId: newSlotId,
              stage: defaultStage,
              slotStatus: "READY_FOR_RECRUITMENT",
              workflowStatus: "READY_FOR_RECRUITMENT",
              parentRequestId: parentReqId,
              jobTitle: newClonedSlot.jobTitle,
              department: r.department,
              authorizedEmails: newClonedSlot.authorizedEmails
            };

            const updatedSlots = [...currentSlots, newClonedSlot];
            return {
              ...r,
              headcountRequired: updatedSlots.length,
              slots: updatedSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        });

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        broadcastCentralSync(updatedRequests, candidatePool);
        if (createdSlotPayload) {
          sendCentralSlotStageUpdate(createdSlotPayload.slotId, createdSlotPayload, updatedRequests);
        }

        triggerToast(`📋 คัดลอกตำแหน่ง "${sourceSlot.jobTitle}" สำเร็จ! เพิ่ม Slot สำหรับ Candidate อีกท่านเรียบร้อย`);
      };

      // Handler for confirming slot deletion with mandatory reason
      const handleConfirmDeleteSlot = () => {
        if (!slotToDelete) return;
        const reason = deletionReasonInput.trim();
        if (!reason) {
          triggerToast("⚠️ กรุณาระบุเหตุผลในการลบ");
          return;
        }

        const targetSlotId = slotToDelete.slotId;
        const parentReqId = slotToDelete.parentRequestId || slotToDelete.id;
        const candName = slotToDelete.candidateName;

        // 1. บันทึกเข้า Blacklist ถาวรทันที
        const updatedDeletedSlotIds = new Set(deletedSlotIds);
        updatedDeletedSlotIds.add(targetSlotId);
        setDeletedSlotIds(updatedDeletedSlotIds);
        localStorage.setItem(DELETED_SLOTS_KEY, JSON.stringify(Array.from(updatedDeletedSlotIds)));

        // 2. ปลดผู้สมัครออกจาก Candidate Pool หากผูกอยู่
        let updatedPool = candidatePool;
        if (candName || slotToDelete.assignedSlotId) {
          updatedPool = candidatePool.map(c => {
            if (c.assignedSlotId === targetSlotId || (candName && isSameCandidate(c.fullName, candName))) {
              return { ...c, assignedSlotId: "" };
            }
            return c;
          });
          setCandidatePool(updatedPool);
          localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(updatedPool));
        }

        // 3. ลบ Slot ออกจาก requests ทันที
        let reqRemoved = false;
        const updatedRequests = requests.map(r => {
          if (r.id === parentReqId || (r.slots && r.slots.some(s => s.slotId === targetSlotId))) {
            const remainingSlots = (r.slots || []).filter(s => s.slotId !== targetSlotId && !updatedDeletedSlotIds.has(s.slotId));
            if (remainingSlots.length === 0) {
              reqRemoved = true;
              return null;
            }
            return {
              ...r,
              headcountRequired: remainingSlots.length,
              slots: remainingSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }).filter(Boolean);

        let updatedDeletedReqIds = new Set(deletedReqIds);
        if (reqRemoved) {
          updatedDeletedReqIds.add(parentReqId);
          setDeletedReqIds(updatedDeletedReqIds);
          localStorage.setItem(DELETED_REQS_KEY, JSON.stringify(Array.from(updatedDeletedReqIds)));
        }

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));

        // 4. กระจายสัญญาณไปยังทุกแท็บ/หน้าต่างทันทีด้วยข้อมูลที่ลบแล้วและรายการ Blacklist ล่าสุด (0ms)
        broadcastCentralSync(updatedRequests, updatedPool, updatedDeletedSlotIds, updatedDeletedReqIds);

        // 5. แจ้งลบไปยังศูนย์กลาง Apps Script เพื่อให้ทุกเซิร์ฟเวอร์และหน้าต่างลบการ์ดนี้ออกถาวร
        sendCentralSlotDeletion(targetSlotId, reason, updatedRequests, parentReqId, reqRemoved);

        if (selectedDetailSlot && selectedDetailSlot.slotId === targetSlotId) {
          setSelectedDetailSlot(null);
        }

        triggerToast(`🗑️ ลบตำแหน่ง Slot #${targetSlotId} ออกจากระบบเรียบร้อย (เหตุผล: ${reason})`);
        setSlotToDelete(null);
        setDeletionReasonInput("");
      };

      // Handler for slot-by-slot approval in Requisition Inspection
      const handleAdminApproveSpecificSlot = (slotId, reqId) => {
        try {
          setIsApprovingEmailSending(true);
          const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
          const nowTs = Date.now();

          const updatedRequests = requests.map(r => {
            if (r.id === reqId || r.slots?.some(s => s.slotId === slotId)) {
              const headcount = Math.max(1, Number(r.headcountRequired) || 1);
              const baseSlots = (r.slots && r.slots.length > 0)
                ? r.slots
                : Array.from({ length: headcount }, (_, i) => ({
                    slotId: `${r.id}-${i + 1}`,
                    slotIndex: i + 1,
                    slotStatus: "PENDING_ADMIN",
                    workflowStatus: "PENDING_ADMIN",
                    stage: "received",
                    jobTitle: r.jobTitle,
                    candidateName: "",
                    candidatePhone: "",
                    candidateNickname: "",
                    resumeUrl: "",
                    authorizedEmails: [],
                    evaluations: []
                  }));

              const updatedSlots = baseSlots.map(s => {
                if (s.slotId === slotId) {
                  return {
                    ...s,
                    jobTitle: s.jobTitle || r.jobTitle,
                    slotStatus: "READY_FOR_RECRUITMENT",
                    workflowStatus: "READY_FOR_RECRUITMENT",
                    stage: "manpower",
                    stageUpdatedAt: nowTs
                  };
                }
                return s;
              });

              const allApproved = updatedSlots.every(s => 
                s.slotStatus === "READY_FOR_RECRUITMENT" || 
                s.slotStatus === "Recruiting" || 
                s.slotStatus === "Closed"
              );

              return {
                ...r,
                requestStatus: allApproved ? "READY_FOR_RECRUITMENT" : r.requestStatus,
                workflowStatus: allApproved ? "READY_FOR_RECRUITMENT" : r.workflowStatus,
                slots: updatedSlots,
                lastUpdated: nowStr
              };
            }
            return r;
          });

          setRequests(updatedRequests);
          localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
          broadcastCentralSync(updatedRequests, candidatePool);

          // 🔄 ส่งอัปเดตสเตจและข้อมูลตำแหน่งเดิมของ Slot นี้ไปยังศูนย์กลางครบถ้วน
          const targetReqObj = updatedRequests.find(r => r.id === reqId || r.slots?.some(s => s.slotId === slotId));
          const targetSlotObj = targetReqObj?.slots?.find(s => s.slotId === slotId);
          sendCentralSlotStageUpdate(slotId, {
            stage: "manpower",
            slotStatus: "READY_FOR_RECRUITMENT",
            workflowStatus: "READY_FOR_RECRUITMENT",
            parentRequestId: targetReqObj?.id || reqId,
            jobTitle: targetSlotObj?.jobTitle || targetReqObj?.jobTitle || "",
            department: targetReqObj?.department || "-",
            requesterName: targetReqObj?.requesterName || "-",
            authorizedEmails: normalizeAuthorizedEmails(targetSlotObj?.authorizedEmails),
            requisitionData: targetReqObj
          }, updatedRequests);

          if (selectedRequisitionDetail && selectedRequisitionDetail.id === reqId) {
            setSelectedRequisitionDetail(prev => {
              if (!prev) return null;
              const updatedSlots = (prev.slots || []).map(s =>
                s.slotId === slotId
                  ? { ...s, slotStatus: "READY_FOR_RECRUITMENT", workflowStatus: "READY_FOR_RECRUITMENT", stage: "manpower" }
                  : s
              );
              const allApproved = updatedSlots.every(s =>
                s.slotStatus === "READY_FOR_RECRUITMENT" || s.slotStatus === "Recruiting" || s.slotStatus === "Closed"
              );
              return {
                ...prev,
                requestStatus: allApproved ? "READY_FOR_RECRUITMENT" : prev.requestStatus,
                workflowStatus: allApproved ? "READY_FOR_RECRUITMENT" : prev.workflowStatus,
                slots: updatedSlots
              };
            });
          }

          triggerToast(`✅ อนุมัติอัตรา #${slotId} เรียบร้อยแล้ว! ย้ายเข้าสู่ 1. Manpower Request บนกระดานทันที`);
        } catch (err) {
          triggerToast("⚠️ เกิดข้อผิดพลาดในการอนุมัติอัตรา");
        } finally {
          setIsApprovingEmailSending(false);
        }
      };

      // Step 1: Validate Manpower Requisition Form & Open Preview Confirmation Modal
      const handleFormSubmit = (e) => {
        e.preventDefault();
        setFormValidationError("");

        const requiredFields = [
          { val: formInput.requesterName, name: "Requester Name - EN (ชื่อผู้ขอภาษาอังกฤษ)" },
          { val: formInput.requesterPosition, name: "Requester Position (ตำแหน่งผู้ขอ)" },
          { val: formInput.requesterEmail, name: "Requester Email (อีเมลผู้ขอ)" },
          { val: formInput.division, name: "Division (สายงาน)" },
          { val: formInput.candidateSupervisor, name: "Candidate Supervisor - EN (หัวหน้างานของผู้สมัคร)" },
          { val: formInput.jobTitle, name: "Job Title (ชื่อตำแหน่งงานที่ต้องการรับ)" },
          { val: formInput.targetDate, name: "Target Start Date (ต้องการให้เริ่มงานภายในวันที่)" },
          { val: formInput.buddy, name: "Buddy / Mentor - EN (พี่เลี้ยงภาษาอังกฤษ)" }
        ];

        if (formInput.positionType === "Replacement") {
          requiredFields.push({
            val: formInput.replacedEmployeeName,
            name: "Replaced Employee Name (ชื่อพนักงานเดิมที่ถูกทดแทน)"
          });
        }

        const missingStrict = requiredFields.filter(item => {
          if (!item.val) return true;
          const s = String(item.val).trim();
          return s === "" || s === "-";
        });

        if (missingStrict.length > 0) {
          const errMsg = `กรุณาระบุข้อมูลให้ครบถ้วน: "${missingStrict[0].name}" (ยังเหลืออีก ${missingStrict.length} ช่องที่ต้องกรอก)`;
          setFormValidationError(errMsg);
          triggerToast(`⚠️ ${errMsg}`);
          const modalBodyEl = document.getElementById("reqFormModalBody");
          if (modalBodyEl) {
            modalBodyEl.scrollTo({ top: 0, behavior: "smooth" });
          }
          return;
        }

        setPendingConfirmationForm({ ...formInput });
        setShowConfirmModal(true);
      };

      // Step 2: Confirm Final Submission -> Save to Requisition Queue & Kanban (Request Received) + Central Sync
      const handleConfirmFinalSubmit = () => {
        const dataToSave = pendingConfirmationForm || formInput;
        const now = new Date();
        const year = now.getFullYear();
        const todayStr = now.toISOString().split('T')[0];
        const nowTimestampStr = now.toISOString().replace('T', ' ').substring(0, 19);
        const nowTs = Date.now();

        // Generate unique REQ-YYYY-XXXX ID avoiding existing, deleted, and stale server tombstones
        let maxSeq = 0;
        const prefix = `REQ-${year}-`;
        const allKnownIds = [
          ...requests.map(r => r.id),
          ...Array.from(deletedReqIds)
        ];
        allKnownIds.forEach(id => {
          if (typeof id === "string" && id.startsWith(prefix)) {
            const num = parseInt(id.slice(prefix.length), 10);
            if (!isNaN(num) && num > maxSeq) maxSeq = num;
          }
        });
        const timeSeq = Number(String(nowTs).slice(-4));
        const nextSeq = Math.max(maxSeq + 1, timeSeq);
        const newId = `${prefix}${String(nextSeq).padStart(4, '0')}`;

        const headcount = Math.max(1, Number(dataToSave.headcountRequired) || 1);
        const generatedSlots = Array.from({ length: headcount }, (_, idx) => ({
          slotId: `${newId}-${idx + 1}`,
          slotIndex: idx + 1,
          slotStatus: "PENDING_ADMIN",
          workflowStatus: "PENDING_ADMIN",
          stage: "received",
          stageUpdatedAt: nowTs,
          jobTitle: dataToSave.jobTitle.trim(),
          priority: "NORMAL",
          candidateName: "",
          candidatePhone: "",
          candidateNickname: "",
          resumeUrl: "",
          interviewSchedule: "",
          interviewScore: 0,
          interviewScorePercent: 0,
          interviewResult: "",
          evaluations: [],
          offerSentDate: "",
          hireDate: "",
          onboardingArrivalStatus: "pending_arrival",
          rejectionReason: "",
          itEquipmentConfirmed: false,
          isItNotified: false,
          hasAttendedFirstDayTraining: false,
          isArchivedFromKanban: false,
          authorizedEmails: []
        }));

        const newReqObj = {
          ...dataToSave,
          id: newId,
          requestDate: todayStr,
          lastUpdated: nowTimestampStr,
          department: (dataToSave.department && dataToSave.department.trim()) ? dataToSave.department.trim() : "-",
          division: (dataToSave.division && dataToSave.division.trim()) ? dataToSave.division.trim() : "-",
          major: (dataToSave.major && dataToSave.major.trim()) ? dataToSave.major.trim() : "-",
          mustHaveQualifications: (dataToSave.mustHaveQualifications && dataToSave.mustHaveQualifications.trim()) ? dataToSave.mustHaveQualifications.trim() : "-",
          jobDescription: (dataToSave.jobDescription && dataToSave.jobDescription.trim()) ? dataToSave.jobDescription.trim() : "-",
          headcountRequired: headcount,
          requestStatus: "PENDING_ADMIN",
          workflowStatus: "PENDING_ADMIN",
          stage: "received",
          slots: generatedSlots
        };

        const updatedRequests = [newReqObj, ...requests];
        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(updatedRequests));

        // Broadcast immediately across all windows/tabs (0ms)
        broadcastCentralSync(updatedRequests, candidatePool);

        // Sync every slot to Central Hub (Apps Script) so all users & admins see identical Kanban & Queue
        generatedSlots.forEach(sl => {
          sendCentralSlotStageUpdate(sl.slotId, {
            stage: "received",
            slotStatus: "PENDING_ADMIN",
            workflowStatus: "PENDING_ADMIN",
            parentRequestId: newId,
            jobTitle: newReqObj.jobTitle,
            department: newReqObj.department,
            requesterName: newReqObj.requesterName,
            requisitionData: newReqObj
          }, updatedRequests);
        });

        const targetUrls = [googleScriptUrl, BACKUP_APPS_SCRIPT_WEBAPP_URL].filter((u, i, arr) => u && arr.indexOf(u) === i);
        targetUrls.forEach(scriptUrl => {
          try {
            fetch(scriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "addRequisition",
                requisition: newReqObj
              })
            }).catch(() => {});
          } catch (e) {}
        });

        setShowConfirmModal(false);
        setShowRequestModal(false);
        setFormValidationError("");
        setPendingConfirmationForm(null);
        setFormInput(initialForm);

        // พาไปยังหน้าที่เหมาะสมตามสิทธิ์ (Admin ไปที่คิวตรวจสอบคำขอ / User อยู่ที่หน้า Kanban Pipeline)
        if (isAdminAuthenticated) {
          setReqQueueFilter("ALL");
          setAdminSubTab("requisitions");
          triggerToast(`🎉 ส่งคำขอ ${newId} สำเร็จ! ปรากฏในคิวตรวจสอบคำขอ (Requisition Queue) และสเตจ Request Received เรียบร้อย`);
        } else {
          setAdminSubTab("kanban");
          triggerToast(`🎉 ส่งคำขอ ${newId} สำเร็จ! ตำแหน่งของคุณแสดงในสเตจ Request Received บนกระดานเรียบร้อย`);
        }
      };

      // Helper: Sync slot info to Manpower Sheet (GID 1528284561)
      const syncSlotToManpowerSheet = async (slotData, silent = true) => {
        if (!googleScriptUrl || !slotData) return;
        try {
          await fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "updateManpowerSlot",
              sheetGid: "1528284561",
              slot: slotData
            })
          });
          if (!silent) triggerToast("ซิงค์ข้อมูลลงแผ่นงานขอกำลังคนสำเร็จ!");
        } catch (err) {}
      };

      // Helper: Sync closed slot info to Closed Sheet (GID 396528947)
      const syncSlotToClosedSheet = async (slotData, silent = true) => {
        if (!googleScriptUrl || !slotData) return;
        try {
          await fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "syncClosedSlot",
              sheetGid: "396528947",
              slot: slotData
            })
          });
          if (!silent) triggerToast("ซิงค์รายการที่ปิดรับลง Google Sheet Closed เรียบร้อย!");
        } catch (err) {}
      };

      const handleSyncAllClosedToSheet = async () => {
        if (closedSlots.length === 0) {
          triggerToast("⚠️ ไม่มีรายการที่ปิดการสรรหา (Closed) ในขณะนี้");
          return;
        }
        triggerToast(`⏳ กำลังซิงค์รายการ Closed ทั้งหมด ${closedSlots.length} รายการลง Google Sheet...`);
        for (const s of closedSlots) {
          await syncSlotToClosedSheet(s, true);
        }
        triggerToast(`✅ ซิงค์ข้อมูล Closed + IT ทั้งหมด (${closedSlots.length} รายการ) ลง Sheet สำเร็จ!`);
      };

      // Direct stage update helper with Central Sync
      const updateSlotStageDirectly = (targetSlotId, targetStage, extraFields = {}) => {
        const nowTimestamp = Date.now();
        const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
        let stagePayload = { stage: targetStage, ...extraFields };

        const updatedRequests = requests.map(r => {
          if (!r.slots || !r.slots.some(s => s.slotId === targetSlotId)) return r;
          const updatedSlots = r.slots.map(s => {
            if (s.slotId === targetSlotId) {
              const isNowCancelled = targetStage === "cancelled";
              const isNowClosed = extraFields.slotStatus === "Closed" || s.slotStatus === "Closed";
              const nextStatus = extraFields.slotStatus || (
                isNowCancelled
                  ? "Cancelled"
                  : isNowClosed
                  ? "Closed"
                  : targetStage === "received"
                  ? "PENDING_ADMIN"
                  : "READY_FOR_RECRUITMENT"
              );

              stagePayload = {
                ...stagePayload,
                slotStatus: nextStatus,
                workflowStatus: nextStatus,
                parentRequestId: r.id,
                jobTitle: s.jobTitle || r.jobTitle,
                department: r.department,
                candidateName: s.candidateName || "",
                candidatePhone: s.candidatePhone || "",
                authorizedEmails: Array.isArray(s.authorizedEmails) ? s.authorizedEmails : []
              };

              return {
                ...s,
                ...extraFields,
                stage: targetStage,
                stageUpdatedAt: nowTimestamp,
                slotStatus: nextStatus,
                workflowStatus: nextStatus
              };
            }
            return s;
          });
          return { ...r, slots: updatedSlots, lastUpdated: nowStr };
        });

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(updatedRequests));
        broadcastCentralSync(updatedRequests, candidatePool);
        sendCentralSlotStageUpdate(targetSlotId, stagePayload, updatedRequests);

        setSelectedDetailSlot(prev => {
          if (prev && prev.slotId === targetSlotId) {
            return { ...prev, ...stagePayload };
          }
          return prev;
        });
      };

      // Initiate Stage Change (with mandatory checks for Request Received lock, Interview, Onboarded, and Cancelled)
      const handleInitiateStageChange = (slotId, targetStage) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);
        if (!slotItem || slotItem.stage === targetStage) return;

        // 🔒 Lock Request Received stage until verified & approved by Admin
        const isUnverifiedReceived =
          slotItem.stage === "received" &&
          (slotItem.slotStatus === "PENDING_ADMIN" || slotItem.workflowStatus === "PENDING_ADMIN");

        if (isUnverifiedReceived) {
          triggerToast("⚠️ รายการนี้อยู่ระหว่างรอผู้ดูแลระบบตรวจสอบ (Pending Review) กรุณายืนยันอนุมัติคำขอในหน้า Requisition Queue ก่อนเปลี่ยนสเตจ");
          return;
        }

        if (targetStage === "interview" && !slotItem.candidateName) {
          setUnassignedInterviewSlotModal(slotItem);
          return;
        }

        if (targetStage === "onboarded") {
          setOnboardHireDateInput(slotItem.hireDate || new Date().toISOString().split('T')[0]);
          setOnboardModalData({ slotId, slotItem });
          return;
        }

        if (targetStage === "cancelled") {
          setRejectionReasonInput(slotItem.rejectionReason || "");
          setRejectionModalData({ slotId, slotItem, isArrivalDecline: false });
          return;
        }

        const extra = targetStage === "offer"
          ? { offerSentDate: new Date().toISOString().split('T')[0] }
          : {};
        updateSlotStageDirectly(slotId, targetStage, extra);
        const stageLabel = STAGES.find(st => st.id === targetStage)?.label || targetStage;
        triggerToast(`ย้าย Slot #${slotId} ไปยัง "${stageLabel}" เรียบร้อย`);
      };

      // Confirm Onboarded & Hire Date
      const handleConfirmOnboardAndClose = (e) => {
        e.preventDefault();
        if (!onboardModalData || !onboardHireDateInput) {
          triggerToast("⚠️ กรุณาระบุวันเริ่มงาน (Hire Date)");
          return;
        }
        const { slotId, slotItem } = onboardModalData;

        updateSlotStageDirectly(slotId, "onboarded", {
          hireDate: onboardHireDateInput,
          slotStatus: "READY_FOR_RECRUITMENT",
          workflowStatus: "READY_FOR_RECRUITMENT"
        });

        const updatedPool = candidatePool.map(c => {
          if (c.assignedSlotId === slotId || (slotItem?.candidateName && isSameCandidate(c.fullName, slotItem.candidateName))) {
            return { ...c, status: "Hiring / Offer", hireDate: onboardHireDateInput };
          }
          return c;
        });
        setCandidatePool(updatedPool);
        localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(updatedPool));

        setOnboardModalData(null);
        triggerToast(`🎉 บรรจุงาน Slot #${slotId} เรียบร้อย (วันเริ่มงาน: ${onboardHireDateInput}) • สถานะยังคงอยู่ใน In Progress จนกว่าจะยืนยันปิดตำแหน่ง`);
      };

      // Confirm Rejection / Cancellation with Mandatory Reason
      const handleConfirmRejectionAndSave = (e) => {
        e.preventDefault();
        if (!rejectionModalData || !rejectionReasonInput.trim()) {
          triggerToast("⚠️ กรุณาระบุเหตุผลในการยกเลิกหรือสละสิทธิ์");
          return;
        }
        const { slotId, slotItem } = rejectionModalData;
        const reason = rejectionReasonInput.trim();

        updateSlotStageDirectly(slotId, "cancelled", {
          slotStatus: "Cancelled",
          workflowStatus: "Cancelled",
          onboardingArrivalStatus: "declined_noshow",
          rejectionReason: reason
        });

        const updatedPool = candidatePool.map(c => {
          if (c.assignedSlotId === slotId || (slotItem?.candidateName && isSameCandidate(c.fullName, slotItem.candidateName))) {
            return { ...c, assignedSlotId: "" };
          }
          return c;
        });
        setCandidatePool(updatedPool);
        localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(updatedPool));

        setRejectionModalData(null);
        setRejectionReasonInput("");
        triggerToast(`❌ บันทึกการยกเลิก/สละสิทธิ์ Slot #${slotId} เรียบร้อยแล้ว`);
      };

      // Confirm First-Day Training / Arrival
      const handleConfirmFirstDayTraining = (slotId) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);
        updateSlotStageDirectly(slotId, "onboarded", {
          hasAttendedFirstDayTraining: true,
          onboardingArrivalStatus: "arrived_reported",
          slotStatus: "Closed",
          workflowStatus: "Closed"
        });
        if (slotItem) {
          syncSlotToClosedSheet({
            ...slotItem,
            stage: "onboarded",
            slotStatus: "Closed",
            onboardingArrivalStatus: "arrived_reported"
          }, true);
        }
        triggerToast(`✅ ยืนยันพนักงานมาเริ่มงาน Slot #${slotId} และปิดการสรรหา (Closed) เรียบร้อย!`);
      };

      // Update Onboarding Arrival Status
      const handleUpdateOnboardingArrivalStatus = (slotId, newArrivalStatus) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);
        if (newArrivalStatus === "declined_noshow") {
          setRejectionReasonInput(slotItem?.rejectionReason || "");
          setRejectionModalData({ slotId, slotItem, isArrivalDecline: true });
          return;
        }
        if (newArrivalStatus === "arrived_reported") {
          handleConfirmFirstDayTraining(slotId);
          return;
        }
        updateSlotStageDirectly(slotId, slotItem?.stage || "onboarded", {
          onboardingArrivalStatus: newArrivalStatus,
          hasAttendedFirstDayTraining: false
        });
        triggerToast(`อัปเดตสถานะการมารายงานตัว Slot #${slotId} เรียบร้อย`);
      };

      // Toggle IT Equipment Confirmed Status
      const handleToggleITEquipmentConfirmed = (slotId) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);
        const nextVal = !slotItem?.itEquipmentConfirmed;
        updateSlotStageDirectly(slotId, slotItem?.stage || "onboarded", {
          itEquipmentConfirmed: nextVal,
          isItNotified: nextVal ? true : Boolean(slotItem?.isItNotified)
        });
        triggerToast(nextVal ? `✅ ยืนยันทีม IT รับทราบและเตรียมอุปกรณ์ Slot #${slotId} เรียบร้อย` : `ยกเลิกการยืนยันอุปกรณ์ IT Slot #${slotId}`);
      };

      // Update Slot Status dropdown in Manpower Requests table
      const handleUpdateSlotStatus = (slotId, newStatus) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);
        const isClosing = newStatus === "Closed";
        const nextStage = isClosing
          ? "onboarded"
          : (slotItem?.stage === "received" && newStatus === "READY_FOR_RECRUITMENT" ? "manpower" : (slotItem?.stage || "manpower"));
        updateSlotStageDirectly(slotId, nextStage, {
          slotStatus: newStatus,
          workflowStatus: newStatus,
          ...(isClosing
            ? {}
            : {
                hasAttendedFirstDayTraining: false,
                onboardingArrivalStatus:
                  slotItem?.onboardingArrivalStatus === "arrived_reported"
                    ? "pending_arrival"
                    : (slotItem?.onboardingArrivalStatus || "pending_arrival")
              })
        });
        triggerToast(`อัปเดตสถานะ Slot #${slotId} เป็น ${newStatus} เรียบร้อย`);
      };

      // Open Blind Interview Evaluation Modal
      const handleOpenBlindEvaluationModal = (slotItem) => {
        if (!slotItem) return;
        let defaultEvaluator = "";
        if (currentUser) {
          const matchedP = personnelList.find(p =>
            (p.email && p.email.toLowerCase() === activeUserEmail) ||
            (p.nameEn && p.nameEn.toLowerCase() === (currentUser.name || "").toLowerCase()) ||
            (p.name && p.name.toLowerCase() === (currentUser.name || "").toLowerCase())
          );
          if (matchedP) {
            defaultEvaluator = (matchedP.nameEn && matchedP.nameEn !== matchedP.name)
              ? `${matchedP.nameEn} (${matchedP.name})`
              : matchedP.name;
          } else {
            defaultEvaluator = currentUser.name || activeUserEmail;
          }
        }

        setBlindEvalForm({
          evaluatorName: defaultEvaluator,
          evaluatorRole: EVALUATOR_ROLES[0],
          date: new Date().toISOString().split('T')[0],
          scores: { c1: 4, c2: 4, c3: 4, c4: 4, c5: 4 },
          strengths: "",
          improvements: "",
          recommendation: "Recommend to Hire"
        });
        setBlindEvalModalSlot(slotItem);
      };

      // Save Blind Interview Evaluation
      const handleSaveBlindEvaluation = (e) => {
        e.preventDefault();
        if (!blindEvalModalSlot) return;
        if (!blindEvalForm.evaluatorName || !blindEvalForm.evaluatorName.trim()) {
          triggerToast("⚠️ กรุณาระบุชื่อผู้ประเมิน");
          return;
        }

        const sc = blindEvalForm.scores;
        const tot = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
        const avg = parseFloat((tot / 5).toFixed(1));
        const pct = Math.round((tot / 25) * 100);

        const newEval = {
          id: `EVAL-${Date.now()}`,
          evaluatorName: blindEvalForm.evaluatorName.trim(),
          evaluatorEmail: activeUserEmail,
          evaluatorRole: blindEvalForm.evaluatorRole,
          date: blindEvalForm.date,
          scores: { ...sc },
          total: tot,
          avg,
          pct,
          strengths: blindEvalForm.strengths.trim(),
          improvements: blindEvalForm.improvements.trim(),
          recommendation: blindEvalForm.recommendation
        };

        const targetSlotId = blindEvalModalSlot.slotId;
        const updatedRequests = requests.map(r => {
          if (!r.slots || !r.slots.some(s => s.slotId === targetSlotId)) return r;
          const updatedSlots = r.slots.map(s => {
            if (s.slotId === targetSlotId) {
              const nextEvals = [...(s.evaluations || []), newEval];
              const stats = calculateOverallScore(nextEvals);
              return {
                ...s,
                evaluations: nextEvals,
                interviewScore: stats.combinedAvg,
                interviewScorePercent: stats.combinedPct,
                interviewResult: stats.result
              };
            }
            return s;
          });
