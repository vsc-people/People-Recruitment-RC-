                      <div className="flex items-center gap-2 mt-0.5">
                        <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                          <span>{selectedDetailSlot.jobTitle}</span>
                          {selectedDetailSlot.totalSlots > 1 && (
                            <span className="text-xs font-extrabold px-2 py-0.5 rounded-lg bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border border-sky-300 dark:border-sky-800">
                              อัตราที่ {selectedDetailSlot.slotIndex}/{selectedDetailSlot.totalSlots}
                            </span>
                          )}
                        </h3>
                        {isAdminAuthenticated && (
                          <button
                            type="button"
                            onClick={() => {
                              setModalEditTitleValue(selectedDetailSlot.jobTitle || "");
                              setIsModalEditingTitle(true);
                            }}
                            className="p-1 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-brand-50 dark:hover:bg-brand-950 transition"
                            title="คลิกเพื่อแก้ไขชื่อตำแหน่งงานนี้"
                          >
                            ✏️
                          </button>
                        )}
                      </div>
                    )}
                    <p className="text-xs text-slate-500">{selectedDetailSlot.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailSlot(null)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-3 text-xs max-h-[70vh] overflow-y-auto pr-1">
                  
                  {/* 🔐 Admin-Only Section: กำหนดสิทธิ์อีเมลเข้าดูข้อมูลและประเมินสัมภาษณ์ในตำแหน่งนี้ */}
                  {isAdminAuthenticated && (
                    <div className="p-4 rounded-2xl bg-sky-50/70 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-800 space-y-2.5">
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-[11px] font-extrabold uppercase tracking-wider text-sky-900 dark:text-sky-200 flex items-center gap-1.5">
                          <span>🔑</span>
                          <span>สิทธิ์การเข้าดูข้อมูลและประเมินสัมภาษณ์ (Authorized User Emails)</span>
                        </span>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300 whitespace-nowrap">
                          {(selectedDetailSlot.authorizedEmails || []).length} อีเมล
                        </span>
                      </div>

                      <p className="text-[11px] text-slate-600 dark:text-slate-300">
                        ระบุอีเมลองค์กรที่อนุญาตให้กดเปิดดูข้อมูลผู้สมัครและประเมินสัมภาษณ์ในตำแหน่งนี้ (หากไม่ระบุ User ทั่วไปจะเห็นเฉพาะชื่อตำแหน่งและสเตจบนกระดาน)
                      </p>

                      {/* ช่องเพิ่มอีเมลในบรรทัดเดียว */}
                      <div className="flex items-center gap-2">
                        <input
                          type="email"
                          list="slot-auth-personnel-list"
                          placeholder="พิมพ์หรือเลือกอีเมล เช่น chana.va@valuesourcing.co"
                          value={newAuthorizedEmailInput}
                          onChange={(e) => setNewAuthorizedEmailInput(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === "Enter") {
                              e.preventDefault();
                              handleAddAuthorizedEmailToSlot(selectedDetailSlot.slotId, newAuthorizedEmailInput);
                            }
                          }}
                          className="flex-1 px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-sky-300 dark:border-sky-700 text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/30"
                        />
                        <datalist id="slot-auth-personnel-list">
                          {personnelList.filter(p => p.email).map((p, idx) => (
                            <option key={idx} value={p.email}>{p.nameEn ? `${p.nameEn} (${p.name})` : p.name}</option>
                          ))}
                        </datalist>
                        <button
                          type="button"
                          onClick={() => handleAddAuthorizedEmailToSlot(selectedDetailSlot.slotId, newAuthorizedEmailInput)}
                          className="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs shadow-xs transition active:scale-95 whitespace-nowrap shrink-0 cursor-pointer"
                        >
                          + เพิ่มสิทธิ์
                        </button>
                      </div>

                      {/* รายการอีเมลที่ได้รับสิทธิ์แล้ว */}
                      {(selectedDetailSlot.authorizedEmails || []).length > 0 ? (
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {(selectedDetailSlot.authorizedEmails || []).map(em => (
                            <span
                              key={em}
                              className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-white dark:bg-slate-800 border border-sky-300 dark:border-sky-700 text-sky-800 dark:text-sky-200 font-mono text-[11px] font-semibold shadow-2xs"
                            >
                              <span>✉️ {em}</span>
                              <button
                                type="button"
                                onClick={() => handleRemoveAuthorizedEmailFromSlot(selectedDetailSlot.slotId, em)}
                                className="text-rose-500 hover:text-rose-700 font-bold ml-0.5 cursor-pointer"
                                title="ถอดสิทธิ์อีเมลนี้"
                              >
                                ✕
                              </button>
                            </span>
                          ))}
                        </div>
                      ) : (
                        <p className="text-[10.5px] text-slate-400 italic">
                          ยังไม่มีอีเมลพนักงานที่ได้รับสิทธิ์ในตำแหน่งนี้
                        </p>
                      )}
                    </div>
                  )}

                  {/* Rejection / Decline Highlight banner if cancelled or declined */}
                  {(selectedDetailSlot.stage === "cancelled" || selectedDetailSlot.onboardingArrivalStatus === "declined_noshow") && (
                    <div className="p-3.5 rounded-2xl bg-rose-100 dark:bg-rose-950/70 border-2 border-rose-400 dark:border-rose-800 text-rose-900 dark:text-rose-200 space-y-1">
                      <div className="font-extrabold flex items-center gap-1.5 text-xs">
                        <Icon name="exclamation" className="w-4 h-4 text-rose-600" />
                        <span>ตำแหน่งนี้ถูกยกเลิก / ผู้สมัครสละสิทธิ์ (Cancelled / Declined)</span>
                      </div>
                      <p className="text-[11px] font-semibold pl-5">
                        เหตุผล: {selectedDetailSlot.rejectionReason || "ไม่ระบุเหตุผล"}
                      </p>
                    </div>
                  )}

                  {/* 🌟 กล่องข้อมูลแคนดิเดตและการนัดหมายสัมภาษณ์ ย้ายขึ้นมาแสดงด้านบนสุด */}
                  {selectedDetailSlot.candidateName ? (
                    <div className="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 space-y-2.5 shadow-xs">
                      <div className="flex items-center justify-between">
                        <p className="font-bold text-emerald-900 dark:text-emerald-200 text-sm flex items-center gap-1.5">
                          <span>👤</span>
                          <span>แคนดิเดต: {selectedDetailSlot.candidateName}</span>
                        </p>
                        {isAdminAuthenticated && (
                          <button
                            onClick={() => {
                              const slot = selectedDetailSlot;
                              setSelectedDetailSlot(null);
                              setUnassignConfirmTarget(slot);
                            }}
                            className="text-[10.5px] font-bold text-rose-600 hover:text-rose-700 hover:underline"
                          >
                            ถอดออกจากตำแหน่ง
                          </button>
                        )}
                      </div>
                      <p className="text-emerald-700 dark:text-emerald-300 font-medium">📞 {selectedDetailSlot.candidatePhone || "-"}</p>
                      {selectedDetailSlot.interviewSchedule && (() => {
                        const relTime = getInterviewRelativeTimeInfo(selectedDetailSlot.interviewSchedule);
                        const googleMeetUrl = extractGoogleMeetUrl(selectedDetailSlot);
                        return (
                          <div className="mt-1 space-y-1.5">
                            <div className="flex flex-wrap items-center justify-between gap-1.5">
                              <p className="text-amber-800 dark:text-amber-300 font-semibold">📅 วันเวลานัดสัมภาษณ์: {selectedDetailSlot.interviewSchedule}</p>
                              {relTime && selectedDetailSlot.stage === "interview" && (
                                <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] border ${relTime.badge}`}>
                                  {relTime.ping && (
                                    <span className="relative flex h-2 w-2">
                                      <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                      <span className={`relative inline-flex rounded-full h-2 w-2 ${relTime.dotBg}`}></span>
                                    </span>
                                  )}
                                  <span>{relTime.text}</span>
                                </span>
                              )}
                            </div>
                            {googleMeetUrl && (
                              <div className="pt-1">
                                <a
                                  href={googleMeetUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  onClick={(e) => e.stopPropagation()}
                                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold transition shadow-xs cursor-pointer"
                                  title="คลิกเพื่อเปิดห้องประชุม Google Meet ทันที"
                                >
                                  <Icon name="link" className="w-3.5 h-3.5 text-white" />
                                  <span>เปิดเข้าห้องประชุม Google Meet ทันที &rarr;</span>
                                </a>
                              </div>
                            )}
                          </div>
                        );
                      })()}

                      {selectedDetailSlot.evaluationsCount > 0 && (
                        <div className="mt-3 pt-3 border-t border-emerald-200 dark:border-emerald-800/80 space-y-1.5">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-800 dark:text-slate-200">ผลประเมินสัมภาษณ์เฉลี่ยรวม ({selectedDetailSlot.evaluationsCount} ท่าน):</span>
                            <span className={`px-2 py-0.5 rounded font-extrabold text-[10px] ${
                              selectedDetailSlot.interviewResult === "Pass" ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                            }`}>
                              {selectedDetailSlot.interviewResult} ({selectedDetailSlot.interviewScore}/5 - {selectedDetailSlot.interviewScorePercent}%)
                            </span>
                          </div>
                          {isAdminAuthenticated && (
                            <button
                              onClick={() => {
                                const s = selectedDetailSlot;
                                setSelectedDetailSlot(null);
                                setAdminAuditSlot(s);
                              }}
                              className="text-xs font-bold text-brand-600 hover:underline mt-1 block"
                            >
                              🔍 เปิดดู Audit Breakdown รายชื่อและคะแนนกรรมการทุกคน &rarr;
                            </button>
                          )}
                        </div>
                      )}

                      {/* Add Interview Evaluation Button in Slot Detail Modal (Strictly ONLY in Interview Stage - สำหรับทุกคนทั้ง User และ Admin) */}
                      {selectedDetailSlot.stage === "interview" && (
                        <div className="mt-3 pt-2.5 border-t border-emerald-200/70 dark:border-emerald-800/70 flex items-center justify-between">
                          <button
                            type="button"
                            onClick={() => handleOpenBlindEvaluationModal(selectedDetailSlot)}
                            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-bold text-xs shadow-xs transition cursor-pointer"
                          >
                            <Icon name="clipboardCheck" className="w-3.5 h-3.5 text-white" />
                            <span>⭐ + บันทึกผลประเมินสัมภาษณ์</span>
                          </button>
                          <span className="text-[11px] text-slate-500 dark:text-slate-400">
                            {selectedDetailSlot.evaluationsCount > 0 ? `ประเมินแล้ว ${selectedDetailSlot.evaluationsCount} ท่าน` : "ยังไม่มีผู้ประเมิน"}
                          </span>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="p-4 text-center bg-slate-50 dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                      <p className="text-slate-400 italic text-xs">ยังไม่มีผู้สมัครจับคู่ในตำแหน่งนี้</p>
                      {isAdminAuthenticated && (
                        <button
                          type="button"
                          onClick={() => {
                            const slot = selectedDetailSlot;
                            setSelectedDetailSlot(null);
                            setUnassignedInterviewSlotModal(slot);
                          }}
                          className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-xs transition inline-flex items-center gap-1.5"
                        >
                          <span>👤 + เลือก Candidate สำหรับตำแหน่งนี้</span>
                        </button>
                      )}
                    </div>
                  )}

                  {/* Google Drive Document Link Box in Detail Modal - รองรับการคลิกดูและการแนบลิงก์ */}
                  {(() => {
                    const cand = candidatePool.find(c => 
                      (c.assignedSlotId && c.assignedSlotId === selectedDetailSlot.slotId) || 
                      (selectedDetailSlot.candidateName && c.fullName && cleanCandidateName(c.fullName).toLowerCase() === cleanCandidateName(selectedDetailSlot.candidateName).toLowerCase())
                    );
                    const currentDriveLink = selectedDetailSlot.resumeUrl || cand?.resumeUrl || cand?.driveUrl || "";

                    return (
                      <div className="p-4 rounded-2xl bg-gradient-to-r from-sky-50 via-indigo-50/60 to-purple-50/50 dark:from-sky-950/50 dark:via-indigo-950/40 dark:to-purple-950/40 border-2 border-sky-300 dark:border-sky-700 shadow-sm space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-[10.5px] uppercase font-extrabold text-sky-800 dark:text-sky-300 tracking-wider flex items-center gap-1.5">
                            <Icon name="link" className="w-3.5 h-3.5 text-sky-600" />
                            <span>GOOGLE DRIVE CV / RESUME LINK (เอกสารสมัครงาน)</span>
                          </span>
                          {currentDriveLink && (
                            <span className="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 font-bold text-[10px]">
                              ✓ มีลิงก์เอกสารแล้ว
                            </span>
                          )}
                        </div>

                        {currentDriveLink ? (
                          <div className="space-y-2 pt-1">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-white dark:bg-slate-800/90 p-3 rounded-xl border border-sky-200 dark:border-sky-800">
                              <p className="text-xs text-slate-700 dark:text-slate-200 font-mono truncate max-w-sm" title={currentDriveLink}>
                                🔗 {currentDriveLink}
                              </p>
                              <a
                                href={currentDriveLink}
                                target="_blank"
                                rel="noopener noreferrer"
                                onClick={(e) => e.stopPropagation()}
                                className="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs shadow-md shadow-sky-500/20 transition shrink-0 active:scale-95 cursor-pointer"
                              >
                                <Icon name="link" className="w-3.5 h-3.5 text-white" />
                                <span>📄 เปิดดูเอกสารใน Drive (คลิก) &rarr;</span>
                              </a>
                            </div>

                            <div className="flex items-center justify-between pt-1 border-t border-sky-200/80 dark:border-sky-800/80 text-[10px] text-slate-500">
                              <span>⚡ ระบบซิงค์ข้อมูลผู้สมัครและลิงก์ Google Drive ลง Google Sheet อัตโนมัติแบบเรียลไทม์</span>
                            </div>
                          </div>
                        ) : (
                          <div className="p-3 rounded-xl bg-white/80 dark:bg-slate-800/80 border border-amber-200 dark:border-amber-800/60 text-slate-600 dark:text-slate-300 text-[11px] space-y-1">
                            <p className="text-amber-800 dark:text-amber-300 font-semibold">
                              ⚠️ ยังไม่มีการระบุลิงก์ Google Drive สำหรับตำแหน่งนี้
                            </p>
                            <p className="text-[10px] text-slate-400">
                              สามารถแก้ไขและเพิ่มลิงก์ Google Drive ในหน้า Candidate Pool เพื่อให้ระบบส่งเข้า Sheet Closed อัตโนมัติได้ครับ
                            </p>
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* Total Recruitment Duration Banner in Detail Modal for Closed Slots */}
                  {(selectedDetailSlot.slotStatus === "Closed" || selectedDetailSlot.stage === "onboarded" || selectedDetailSlot.stage === "cancelled") && (() => {
                    const duration = getRecruitmentDurationInfo(selectedDetailSlot.requestDate, selectedDetailSlot.hireDate, selectedDetailSlot.lastUpdated);
                    return (
                      <div className="p-3.5 rounded-2xl bg-gradient-to-r from-sky-50 to-indigo-50 dark:from-sky-950/60 dark:to-indigo-950/60 border border-sky-200 dark:border-sky-800 text-xs space-y-1.5 shadow-2xs">
                        <div className="font-bold text-sky-900 dark:text-sky-200 flex items-center justify-between">
                          <span className="flex items-center gap-1.5">
                            <span>⏱️ ระยะเวลาที่ใช้สรรหา (Total Recruitment Time)</span>
                          </span>
                          <span className="px-2 py-0.5 rounded-md bg-sky-600 text-white font-extrabold text-[11px]">
                            รวม {duration.totalDays} วัน
                          </span>
                        </div>
                        <div className="text-[11px] text-slate-600 dark:text-slate-300 space-y-0.5">
                          <p>
                            <strong>ช่วงเวลา:</strong> {duration.rangeText} (คำนวณจาก Request Date ถึงวันปิดรับ/เริ่มงาน)
                          </p>
                          <p className="text-sky-700 dark:text-sky-300 font-semibold">
                            <strong>วันทำการ (ไม่รวมเสาร์-อาทิตย์):</strong> {duration.workingDays} วันทำการ
                          </p>
                        </div>
                      </div>
                    );
                  })()}

                  <div className="grid grid-cols-2 gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                    <div>
                      <span className="text-[10px] text-slate-400">Position Type:</span>
                      <p className="font-bold text-slate-800 dark:text-slate-200">{selectedDetailSlot.positionType}</p>
                      {selectedDetailSlot.replacedEmployeeName && (
                        <p className="text-amber-600 font-semibold text-[11px]">แทน: {selectedDetailSlot.replacedEmployeeName}</p>
                      )}
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400">Status ของ Slot:</span>
                      <p className="font-bold text-emerald-600">{selectedDetailSlot.slotStatus || "Recruiting"}</p>
                    </div>
                  </div>

                  {/* Approval Workflow Progress Tracker */}
                  {(() => {
                    const wf = selectedDetailSlot.workflowStatus || selectedDetailSlot.requestStatus || "PENDING_ADMIN";
                    const currentReq = requests.find(r => r.id === (selectedDetailSlot.parentRequestId || selectedDetailSlot.id));
                    const liveWf = currentReq?.workflowStatus || wf;
                    const priorityInfo = getPositionPriorityInfo(selectedDetailSlot);

                    // สเต็ปที่ 1: ยื่นคำขอเรียบร้อยแล้วเสมอ
                    const isStep1Done = true;

                    // สเต็ปที่ 2: แอดมินอนุมัติแล้ว (ผ่าน PENDING_ADMIN มาแล้ว หรืออยู่ในสเตจถัดไป)
                    const isStep2Done = liveWf !== "PENDING_ADMIN" && liveWf !== "REJECTED_BY_ADMIN";

                    // สเต็ปที่ 3: ดำเนินการสัมภาษณ์ & ยื่น Offer
                    const isStep3Done = selectedDetailSlot.stage === "offer" || selectedDetailSlot.stage === "onboarded" || Boolean(selectedDetailSlot.isItNotified);

                    // สเต็ปที่ 4: IT รับทราบและเตรียมอุปกรณ์ (เมื่อแอดมินส่งเมลแจ้ง IT และ IT กดยืนยันแล้ว)
                    const isStep4Done = Boolean(selectedDetailSlot.isItNotified) && (liveWf === "READY_FOR_RECRUITMENT" || liveWf === "Recruiting" || selectedDetailSlot.stage === "onboarded");

                    // สเต็ปที่ 5: เริ่มงาน & ปิดการสรรหา (ต้องมาเริ่มงานจริงจึงจะติ๊กถูก)
                    const isStep5Done = selectedDetailSlot.stage === "onboarded" && (selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported");

                    return (
                      <div className="p-4 rounded-2xl bg-gradient-to-br from-slate-50 to-sky-50/40 dark:from-slate-800/80 dark:to-sky-950/30 border border-slate-200 dark:border-slate-700 space-y-3">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                              <Icon name="clipboardCheck" className="w-4 h-4 text-brand-600" />
                              <span>APPROVAL &amp; RECRUITMENT WORKFLOW TRACKER</span>
                            </span>

                            {/* Priority Tag in Modal */}
                            <span className="relative flex h-2.5 w-2.5 ml-1">
                              {priorityInfo.ping && (
                                <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${priorityInfo.dotBg} opacity-75`}></span>
                              )}
                              <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${priorityInfo.dotBg}`}></span>
                            </span>
                            <span className={`text-[9.5px] font-bold px-1.5 py-0.2 rounded border ${priorityInfo.badge}`}>
                              {priorityInfo.label}
                            </span>
                          </div>

                          {/* Dynamic Badge สะท้อนสถานะจริงตามสเตจ */}
                          <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${
                            liveWf === "PENDING_ADMIN" ? "bg-amber-100 text-amber-900 border-amber-300 dark:bg-amber-950 dark:text-amber-300" :
                            selectedDetailSlot.stage === "interview" ? "bg-blue-100 text-blue-900 border-blue-300 dark:bg-blue-950 dark:text-blue-300" :
                            selectedDetailSlot.stage === "offer" && !selectedDetailSlot.isItNotified ? "bg-purple-100 text-purple-900 border-purple-300 dark:bg-purple-950 dark:text-purple-300 font-bold animate-pulse" :
                            selectedDetailSlot.stage === "offer" && selectedDetailSlot.isItNotified && !isStep4Done ? "bg-sky-100 text-sky-900 border-sky-300 dark:bg-sky-950 dark:text-sky-300 font-bold animate-pulse" :
                            isStep4Done && selectedDetailSlot.stage !== "onboarded" ? "bg-emerald-100 text-emerald-900 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300 font-bold" :
                            selectedDetailSlot.stage === "onboarded" && (selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported") ? "bg-slate-200 text-slate-900 border-slate-300 font-bold" :
                            selectedDetailSlot.stage === "onboarded" ? "bg-emerald-100 text-emerald-900 border-emerald-400 font-bold" :
                            "bg-slate-100 text-slate-700 border-slate-200"
                          }`}>
                            {liveWf === "PENDING_ADMIN" ? "⏳ 1. รอ Admin ตรวจสอบ" :
                             selectedDetailSlot.stage === "manpower" ? "✅ 2. พร้อมสรรหา (รอคัดเลือก)" :
                             selectedDetailSlot.stage === "interview" ? "👥 3. อยู่ระหว่างสัมภาษณ์" :
                             selectedDetailSlot.stage === "offer" && !selectedDetailSlot.isItNotified ? "🎯 4. Confirm สรรหา (รอแจ้ง IT)" :
                             selectedDetailSlot.stage === "offer" && selectedDetailSlot.isItNotified && !isStep4Done ? "💻 5. รอ IT กดรับทราบอุปกรณ์" :
                             isStep4Done && selectedDetailSlot.stage !== "onboarded" ? "💻 6. IT รับทราบแล้ว (พร้อมเริ่มงาน)" :
                             selectedDetailSlot.stage === "onboarded" && (selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported") ? "🎉 7. เริ่มงานแล้ว / ปิดการสรรหา" :
                             selectedDetailSlot.stage === "onboarded" ? "🎉 6. บรรจุงานแล้ว (รอวันอบรมวันแรก)" :
                             "Recruiting"}
                          </span>

                        {/* Stepper 5 ขั้นตอนสอดคล้องกับ Process จริง */}

                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">1. ขอกำลังคน</span>
                            <span className="text-[9px] text-emerald-600 font-semibold block">{selectedDetailSlot.requestDate}</span>
                          </div>

                          {/* Step 2: Admin อนุมัติ */}
                          <div className={`p-2 rounded-xl border ${
                            isStep2Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            liveWf === "PENDING_ADMIN" ? "bg-amber-50 dark:bg-amber-950/60 border-amber-300 ring-2 ring-amber-500/20" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep2Done ? "bg-emerald-500 text-white" :
                              liveWf === "PENDING_ADMIN" ? "bg-amber-500 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep2Done ? "✓" : "2"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">2. Admin อนุมัติ</span>
                            <span className={`text-[9px] font-semibold block ${isStep2Done ? "text-emerald-600" : "text-amber-600"}`}>
                              {isStep2Done ? "อนุมัติแล้ว" : "รอแอดมินตรวจ"}
                            </span>
                          </div>

                          {/* Step 3: สัมภาษณ์ & Offer */}
                          <div className={`p-2 rounded-xl border ${
                            isStep3Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            selectedDetailSlot.stage === "interview" ? "bg-blue-50 dark:bg-blue-950/60 border-blue-300 ring-2 ring-blue-500/20" :
                            selectedDetailSlot.stage === "manpower" ? "bg-slate-50 border-slate-200 dark:border-slate-700" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep3Done ? "bg-emerald-500 text-white" :
                              selectedDetailSlot.stage === "interview" ? "bg-blue-500 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep3Done ? "✓" : "3"}</div>

                              isStep3Done ? "text-emerald-600 font-bold" :
                              selectedDetailSlot.stage === "interview" ? "text-blue-600 font-bold" : "text-slate-400"

                          </div>

                          {/* Step 4: IT ยืนยันอุปกรณ์ */}
                          <div className={`p-2 rounded-xl border ${
                            isStep4Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            selectedDetailSlot.isItNotified ? "bg-sky-50 dark:bg-sky-950/60 border-sky-300 ring-2 ring-sky-500/20" :
                            selectedDetailSlot.stage === "offer" ? "bg-purple-50 dark:bg-purple-950/60 border-purple-300" :

                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep4Done ? "bg-emerald-500 text-white" :

                              selectedDetailSlot.stage === "offer" ? "bg-purple-500 text-white" : "bg-slate-300 text-slate-600"

                            <span className={`text-[9px] font-semibold block ${
                              isStep4Done ? "text-emerald-600 font-bold" :
                              selectedDetailSlot.isItNotified ? "text-sky-600 font-bold" :
                              selectedDetailSlot.stage === "offer" ? "text-purple-600" : "text-slate-400"

                          <div className={`p-2 rounded-xl border col-span-2 sm:col-span-1 ${
                            isStep5Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :

                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"

                              isStep5Done ? "bg-emerald-500 text-white" :
                              selectedDetailSlot.stage === "onboarded" ? "bg-emerald-600 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep5Done ? "✓" : "5"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">5. เริ่มงาน &amp; ปิด</span>
                            <span className={`text-[9px] font-semibold block ${
                              isStep5Done ? "text-emerald-600 font-bold" :
                              selectedDetailSlot.stage === "onboarded" ? "text-emerald-700 font-bold" : "text-slate-400"
                            }`}>
                              {isStep5Done ? "ปิดการสรรหาแล้ว" : selectedDetailSlot.stage === "onboarded" ? "รอเริ่มงาน" : "รอสเตจ Offer"}
                            </span>
                          </div>
                        </div>

                        {/* ข้อความและปุ่มซิงค์สถานะ */}
                        <div className="flex items-center justify-between pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                          <span className="text-[10px] text-slate-400">
                            {selectedDetailSlot.isItNotified ? "📧 ส่งข้อมูลแจ้ง IT เรียบร้อยแล้ว (รอ IT กดรับทราบในอีเมล)" : "💡 ในสเตจ Onboarded สามารถกดปุ่มส่งแจ้งข้อมูลให้ทีม IT เพื่อเตรียมอุปกรณ์และเปิดสิทธิ์"}
                          </span>
                          <button
                            type="button"
                            onClick={() => syncWorkflowStatus(false)}
                            className="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 hover:bg-slate-100 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 text-[10px] font-bold flex items-center gap-1 transition shadow-2xs whitespace-nowrap"
                          >
                            <Icon name="refresh" className="w-3 h-3 text-brand-600" />
                            <span>🔄 ซิงค์สถานะ</span>
                          </button>
                        </div>
                      </div>

                  })()}

                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">

                    </span>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-[11px]">
                      <div>
                        <span className="text-slate-400 block text-[10px]">เพศ:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.gender || "ไม่ระบุ"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">อายุ:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.age || "ไม่จำกัด"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">การศึกษา:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.educationLevel || "ปริญญาตรี"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">สาขาวิชา:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedDetailSlot.major || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">ประสบการณ์:</span>

                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">เป้าหมายเริ่มงาน:</span>

                      </div>
                    </div>

                      <div className="pt-2 border-t border-slate-200/60 dark:border-slate-700/60">

                        <p className="text-slate-700 dark:text-slate-300 text-[11px] mt-0.5">{selectedDetailSlot.mustHaveQualifications}</p>
                      </div>
                    )}
                    {selectedDetailSlot.jobDescription && (
                      <div className="pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                        <span className="text-slate-400 block text-[10px] font-semibold">ลักษณะงานโดยย่อ (JD):</span>
                        <p className="text-slate-700 dark:text-slate-300 text-[11px] mt-0.5">{selectedDetailSlot.jobDescription}</p>
                      </div>
                    )}
                  </div>

                  {/* IT & Equipment Requirements Details */}
                  <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">

                      💻 อุปกรณ์และสิทธิ์ IT ที่ร้องขอ (IT &amp; Equipment Requirements)

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-[10px]">
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itLaptop === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>
                        <span>Laptop / PC</span>
                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itLaptop || "ต้องการ"}</strong>
                      </div>
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itSimCard === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>
                        <span>Sim / โทรศัพท์</span>
                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itSimCard || "ไม่ต้องการ"}</strong>
                      </div>
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itEmail === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>
                        <span>Email องค์กร</span>
                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itEmail || "ต้องการ"}</strong>
                      </div>
                      <div className={`p-2 rounded-xl border ${selectedDetailSlot.itNetsuite === "ต้องการ" ? "bg-sky-50 dark:bg-sky-950/50 border-sky-300 text-sky-800 dark:text-sky-300 font-bold" : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400"}`}>

                        <strong className="block text-xs mt-0.5">{selectedDetailSlot.itNetsuite || "ไม่ต้องการ"}</strong>
                      </div>
                    </div>
                  </div>

                      <div className="flex items-center justify-between border-b border-purple-100 dark:border-purple-800/60 pb-2.5">

                          <span className="font-bold text-xs text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                            <span className="w-5 h-5 rounded-full bg-purple-600 text-white text-[10px] font-bold flex items-center justify-center">1</span>
                            <span>วันเริ่มงาน (Hire Date):</span>
                          </span>
                          <span className="text-xs font-extrabold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/50 px-2.5 py-0.5 rounded-lg border border-rose-200 dark:border-rose-900">
                            📅 {selectedDetailSlot.hireDate || "ยังไม่ได้ระบุวัน"}
                          </span>
                        </div>
                        <p className="text-[10.5px] text-slate-500 dark:text-slate-400 pl-6">
                          ข้อมูลวันเริ่มงานนี้จะถูกนำไปส่งต่อให้ทีม IT จัดเตรียมอุปกรณ์ให้ทันตามกำหนด
                        </p>
                      </div>

                      {/* ขั้นที่ 2: ส่งข้อมูลให้ทีม IT (Send Email to people@valuesourcing.co) */}

                          <span className="font-bold text-xs text-purple-900 dark:text-purple-200 flex items-center gap-1.5">
                            <span className="w-5 h-5 rounded-full bg-purple-600 text-white text-[10px] font-bold flex items-center justify-center">2</span>
                            <span>ส่งข้อมูลแจ้งทีม IT (people@valuesourcing.co):</span>
                          </span>
                          {selectedDetailSlot.isItNotified ? (
                            <span className="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-200 font-bold text-[10px] flex items-center gap-1">
                              <span>✓ ส่งอีเมลแล้ว</span>
                            </span>
                          ) : (
                            <span className="text-[10px] text-amber-600 dark:text-amber-400 font-semibold">
                              ⏳ ยังไม่ได้ส่งแจ้ง
                            </span>
                          )}

                        {/* ตารางสรุป 6 ข้อมูลที่จะส่งไปในอีเมลตามฟอร์มขอกำลังคน */}
                        <div className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 text-[11px] space-y-1 text-slate-700 dark:text-slate-300">
                          <p><strong>Name :</strong> K. {selectedDetailSlot.candidateName || "-"}</p>
                          <p><strong>Position :</strong> {selectedDetailSlot.jobTitle || "-"}</p>
                          <p><strong>Department:</strong> {selectedDetailSlot.department || "-"}</p>
                          <p><strong>Division (SSC):</strong> {selectedDetailSlot.division || selectedDetailSlot.department || "-"}</p>
                          <p><strong>Hire date:</strong> <span className="text-rose-600 dark:text-rose-400 font-bold">{selectedDetailSlot.hireDate || "ยังไม่ระบุวันเริ่มงาน"}</span></p>
                          <p><strong>Work Location:</strong> {selectedDetailSlot.workLocation || candidatePool.find(c => c.assignedSlotId === selectedDetailSlot.slotId || (selectedDetailSlot.candidateName && c.fullName === selectedDetailSlot.candidateName))?.branch || selectedDetailSlot.branch || "Dusit Central Park"}</p>
                        </div>

                        <button
                          type="button"
                          onClick={() => handleSendITNotification(selectedDetailSlot)}
                          className="w-full py-2 px-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 active:scale-95 text-white font-bold text-xs shadow-md shadow-purple-500/20 transition flex items-center justify-center gap-1.5 cursor-pointer"
                        >
                          <Icon name="send" className="w-3.5 h-3.5 text-white" />
                          <span>{selectedDetailSlot.isItNotified ? "ส่งอีเมลแจ้งทีม IT ซ้ำอีกครั้ง" : "ส่ง Email ข้อมูลไปให้ทางทีม IT (people@valuesourcing.co)"}</span>
                        </button>
                      </div>

                      {/* ขั้นที่ 3: เมื่อ IT กดรับทราบ -> ให้ขึ้นเป็นสีเขียวเด่นชัด */}
                      <div className={`p-3 rounded-xl border transition-all ${
                        selectedDetailSlot.itEquipmentConfirmed
                          ? "bg-emerald-50 dark:bg-emerald-950/60 border-emerald-300 dark:border-emerald-700 shadow-sm"
                          : "bg-white dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 shadow-2xs"
                      }`}>
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                          <div className="space-y-0.5">
                            <span className={`font-bold text-xs flex items-center gap-1.5 ${
                              selectedDetailSlot.itEquipmentConfirmed
                                ? "text-emerald-900 dark:text-emerald-200"
                                : "text-slate-800 dark:text-slate-200"
                            }`}>
                              <span className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center ${
                                selectedDetailSlot.itEquipmentConfirmed
                                  ? "bg-emerald-600 text-white"
                                  : "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300"
                              }`}>3</span>
                              <span>สถานะการตอบรับของทีม IT:</span>
                            </span>
                            <p className="text-[10.5px] text-slate-500 dark:text-slate-400 pl-6">
                              {selectedDetailSlot.itEquipmentConfirmed

                                <span>✓ ยืนยันมาเริ่มงาน &amp; ปิดจบตำแหน่ง (Closed)</span>

                                </span>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>

                        : selectedDetailSlot.onboardingArrivalStatus === "arrived_reported"

                              <option key={arr.id} value={arr.id}>{arr.label}</option>

                  </p>
                </div>
                <div className="flex gap-2 justify-center pt-1">
                  <button
                    type="button"
                    onClick={() => setUnassignConfirmTarget(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={() => handleUnassignCandidate(unassignConfirmTarget.slotId, unassignConfirmTarget.candidateName)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md"
                  >
                    ยืนยันถอดออก
                  </button>
                </div>
              </div>
            </div>

                  </div>
                  <button onClick={() => setSlotToDelete(null)} className="p-1 text-slate-400 hover:text-slate-600">

                  <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300">

                  </label>
                  <textarea
                    rows="3"
                    placeholder="ระบุเหตุผล เช่น เปิดซ้ำ, ยกเลิกอัตราชั่วคราว..."

                    onChange={(e) => setDeletionReasonInput(e.target.value)}
                    className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-rose-300 dark:border-rose-800 font-medium"
                  ></textarea>
                </div>

                <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setSlotToDelete(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  >

                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDeleteSlot}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md"
                  >
                    ยืนยันการลบตำแหน่ง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Candidate Deletion Confirmation Modal */}
          {candidateToDelete && (
            <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm animate-fadeIn">

                <div className="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-950/70 text-rose-600 flex items-center justify-center text-xl mx-auto">
                  🗑️
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-slate-900 dark:text-white">ยืนยันการลบข้อมูลผู้สมัคร</h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">

                  </p>
                </div>
                <div className="flex gap-2 justify-center pt-1">
                  <button
                    type="button"
                    onClick={() => setCandidateToDelete(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDeleteCandidate}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md"
                  >
                    ยืนยันลบข้อมูล
                  </button>
                </div>
              </div>
            </div>

          {/* Real-Time TA Dashboard Summary Modal & Sheet Sync (Admin Only) */}
          {isAdminAuthenticated && showDashboardSummaryModal && (
            <div className="fixed inset-0 z-[115] flex items-center justify-center p-3 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-4xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-indigo-200 dark:border-indigo-800 overflow-hidden max-h-[92vh] flex flex-col">

                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-indigo-300">
                        REAL-TIME SHEET EXPORT &bull; GID {DASHBOARD_SUMMARY_SHEET_GID}
                      </span>
                      <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
                        ● ข้อมูลสด {taDashboardSummary.updatedTimestamp}
                      </span>
                    </div>
                    <h3 className="text-base sm:text-lg font-extrabold mt-0.5">
                      สรุปภาพรวมการสรรหาแบบเรียลไทม์ (สำหรับ People Dashboard)
                    </h3>
                  </div>
                  <button onClick={() => setShowDashboardSummaryModal(false)} className="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-white/10 transition">

                  </button>

                    ส่งข้อมูลตรงเข้าชีท <strong className="text-indigo-700 dark:text-indigo-300 font-mono">gid={DASHBOARD_SUMMARY_SHEET_GID}</strong> อัตโนมัติทุกครั้งที่มีการอัปเดต
                    {lastSummarySyncedAt && <span className="text-emerald-600 dark:text-emerald-400 font-bold ml-1.5">(ซิงค์ล่าสุด: {lastSummarySyncedAt})</span>}
                  </span>
                  <div className="flex flex-wrap items-center gap-2 shrink-0">
                    <a
                      href={DASHBOARD_SUMMARY_SHEET_URL}

                      className="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 hover:bg-sky-50 text-sky-700 dark:text-sky-300 border border-sky-300 dark:border-sky-700 font-bold text-xs flex items-center gap-1 transition shadow-2xs"
                    >
                      <span>เปิด Sheet สรุป (GID {DASHBOARD_SUMMARY_SHEET_GID})</span>
                      <Icon name="link" className="w-3 h-3 text-sky-600" />
                    </a>
                    <button
                      type="button"
                      onClick={copyDashboardSummaryAppsScript}
                      className="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-700 font-bold text-xs transition"
                      title="คัดลอกโค้ด Apps Script สำหรับวางใน doPost เพื่อเขียนลง GID 1491221874"
                    >
                      📋 โค้ด Apps Script
                    </button>
                    <button
                      type="button"
                      disabled={isSyncingSummarySheet}
                      onClick={() => syncTADashboardSummaryToSheet(true)}
                      className="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-xs transition active:scale-95 disabled:opacity-50"
                    >
                      {isSyncingSummarySheet ? "⏳ กำลังอัปเดตชีท..." : "🔄 ซิงค์ลง Sheet ทันที"}
                    </button>
                    <button
                      type="button"
                      onClick={exportTADashboardSummaryCSV}
                      className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-xs transition active:scale-95"
                    >
                      📥 Export CSV
                    </button>
                  </div>
                </div>

                {/* Summary Content Body */}
                <div className="p-6 space-y-5 overflow-y-auto flex-1 text-xs">
                  
                  {/* 1. ภาพรวมการสรรหา & ประสิทธิภาพการสรรหา */}

                    <h4 className="font-extrabold text-slate-900 dark:text-white mb-2.5 flex items-center gap-1.5">

                      <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">

                        <strong className="text-xl font-extrabold text-slate-900 dark:text-white mt-0.5 block">{taDashboardSummary.overview.openPositionsCount}</strong>

                      </div>

                        <span className="text-[11px] text-slate-500 block">Headcount รอสรรหา</span>
                        <strong className="text-xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-0.5 block">{taDashboardSummary.overview.pendingHeadcount} อัตรา</strong>
                        <span className="text-[10px] text-slate-400">ต้องการรวม {taDashboardSummary.overview.totalRequiredHeadcount} · รับแล้ว {taDashboardSummary.overview.filledHeadcount}</span>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
                        <span className="text-[11px] text-slate-500 block">Fill Rate</span>
                        <strong className="text-xl font-extrabold text-amber-600 dark:text-amber-400 mt-0.5 block">{taDashboardSummary.overview.fillRatePct}%</strong>
                        <span className="text-[10px] text-slate-400">รับแล้ว ÷ ต้องการ</span>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
                        <span className="text-[11px] text-slate-500 block">อายุเฉลี่ยตำแหน่งที่เปิด</span>
                        <strong className="text-xl font-extrabold text-sky-600 dark:text-sky-400 mt-0.5 block">{taDashboardSummary.overview.avgOpenAgeDays} วัน</strong>
                        <span className="text-[10px] text-slate-400">นับจากวันที่เปิดรับ</span>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-rose-50/60 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800">
                        <span className="text-[11px] text-rose-700 dark:text-rose-300 block">เลยกำหนดสรรหา</span>
                        <strong className="text-xl font-extrabold text-rose-600 dark:text-rose-400 mt-0.5 block">{taDashboardSummary.overview.overduePositionsCount} ตำแหน่ง</strong>
                        <span className="text-[10px] text-rose-500">ยังรับไม่ครบตามกำหนด</span>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
                        <span className="text-[11px] text-slate-500 block">Offer Acceptance</span>
                        <strong className="text-xl font-extrabold text-teal-600 dark:text-teal-400 mt-0.5 block">{taDashboardSummary.efficiency.offerAcceptancePct}%</strong>
                        <span className="text-[10px] text-slate-400">รับเข้า ÷ Offer</span>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
                        <span className="text-[11px] text-slate-500 block">Time to Fill</span>
                        <strong className="text-xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-0.5 block">
                          {taDashboardSummary.efficiency.avgTimeToFillDays !== null ? `${taDashboardSummary.efficiency.avgTimeToFillDays} วัน` : "รอข้อมูล"}
                        </strong>
                        <span className="text-[10px] text-slate-400">วันเปิด &rarr; วันปิด</span>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
                        <span className="text-[11px] text-slate-500 block">รับเข้าแล้ว (รวม)</span>
                        <strong className="text-xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-0.5 block">{taDashboardSummary.efficiency.hiredTotalCount} คน</strong>
                        <span className="text-[10px] text-slate-400">จากต้องการ {taDashboardSummary.overview.totalRequiredHeadcount} อัตรา</span>
                      </div>
                    </div>
                  </div>

                  {/* 2. Recruitment Funnel & Stage Summary */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2.5">
                      <h4 className="font-extrabold text-slate-900 dark:text-white text-xs">
                        2. Recruitment Funnel &amp; Conversion Rate
                      </h4>
                      <div className="space-y-2 text-[11px]">
                        {[
                          { label: "ผู้สมัคร (Applicants)", val: taDashboardSummary.funnel.applicants, max: Math.max(1, taDashboardSummary.funnel.applicants) },
                          { label: "สัมภาษณ์ (Interview)", val: taDashboardSummary.funnel.interview, max: Math.max(1, taDashboardSummary.funnel.applicants) },
                          { label: "Offer (ยื่นข้อเสนอ)", val: taDashboardSummary.funnel.offer, max: Math.max(1, taDashboardSummary.funnel.applicants) },
                          { label: "รับเข้าแล้ว (Hired)", val: taDashboardSummary.funnel.hired, max: Math.max(1, taDashboardSummary.funnel.applicants) }
                        ].map(item => (
                          <div key={item.label} className="space-y-1">
                            <div className="flex justify-between font-semibold">
                              <span>{item.label}</span>
                              <span className="font-bold text-indigo-600 dark:text-indigo-400">{item.val}</span>
                            </div>
                            <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                              <div className="h-full bg-indigo-500 rounded-full" style={{ width: `${Math.min(100, (item.val / item.max) * 100)}%` }}></div>
                            </div>
                          </div>
                        ))}
                      </div>
                      <p className="text-[10.5px] text-slate-500 pt-1 border-t border-slate-200 dark:border-slate-700">
                        ผู้สมัคร&rarr;สัมภาษณ์ <strong>{taDashboardSummary.funnel.appToInterviewPct}%</strong> &bull; สัมภาษณ์&rarr;Offer <strong>{taDashboardSummary.funnel.interviewToOfferPct}%</strong> &bull; Offer&rarr;รับเข้า <strong>{taDashboardSummary.funnel.offerToHirePct}%</strong>
                      </p>
                    </div>

                    <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">
                      <h4 className="font-extrabold text-slate-900 dark:text-white text-xs">
                        3. แหล่งที่มาของผู้สมัครและผู้ได้รับการรับเข้า (Source of Hire)
                      </h4>
                      {taDashboardSummary.sourceOfHireBreakdown.length === 0 ? (
                        <p className="text-slate-400 italic text-[11px] py-4 text-center">ยังไม่มีข้อมูลแหล่งที่มาใน Candidate Pool</p>
                      ) : (
                        <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                          {taDashboardSummary.sourceOfHireBreakdown.map(src => (
                            <div key={src.source} className="flex items-center justify-between p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700">
                              <span className="font-semibold text-slate-800 dark:text-slate-200">{src.source}</span>
                              <div className="flex items-center gap-2 text-[11px]">
                                <span className="text-slate-500">สมัคร: <strong>{src.totalApplicants}</strong></span>
                                <span className="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-bold">
                                  รับเข้า: {src.hiredCount}
                                </span>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* 4. รายละเอียด Requisition Table (เหมือนภาพที่ 5) */}
                  <div className="space-y-2">
                    <h4 className="font-extrabold text-slate-900 dark:text-white flex items-center gap-1.5">
                      <span className="w-1.5 h-4 rounded-full bg-amber-500"></span>
                      <span>4. รายละเอียด Requisition (ตารางข้อมูลที่จะเขียนลงชีท TA_Dashboard_Summary)</span>
                    </h4>
                    <div className="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-2xl">
                      <table className="w-full text-left text-[11px] text-slate-600 dark:text-slate-300 whitespace-nowrap">
                        <thead className="bg-slate-100 dark:bg-slate-800 text-[10px] uppercase text-slate-500 border-b border-slate-200 dark:border-slate-700">
                          <tr>
                            <th className="px-3 py-2">รหัส</th>
                            <th className="px-3 py-2">ตำแหน่ง</th>
                            <th className="px-3 py-2">แผนก / ฝ่ายงาน</th>
                            <th className="px-3 py-2">ประเภท</th>
                            <th className="px-3 py-2">ผู้รับผิดชอบ</th>
                            <th className="px-3 py-2 text-center">ต้องการ</th>
                            <th className="px-3 py-2 text-center">รับแล้ว</th>
                            <th className="px-3 py-2 text-center">รอสรรหา</th>
                            <th className="px-3 py-2 text-center">อายุเปิด (วัน)</th>
                            <th className="px-3 py-2">สถานะกำหนด</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                          {taDashboardSummary.reqDetailRows.length === 0 ? (
                            <tr>
                              <td colSpan="10" className="text-center py-6 text-slate-400 italic">ยังไม่มีรายการ Requisition ในระบบ</td>
                            </tr>
                          ) : (
                            taDashboardSummary.reqDetailRows.map(r => (
                              <tr key={r.reqId} className="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                                <td className="px-3 py-2 font-mono font-bold text-brand-600">{r.reqId}</td>
                                <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">{r.jobTitle}</td>
                                <td className="px-3 py-2">{r.department}</td>
                                <td className="px-3 py-2">{r.employeeGroup}</td>
                                <td className="px-3 py-2">{r.requesterName}</td>
                                <td className="px-3 py-2 text-center font-bold">{r.required}</td>
                                <td className="px-3 py-2 text-center font-bold text-emerald-600">{r.filled}</td>
                                <td className="px-3 py-2 text-center font-bold text-amber-600">{r.remaining}</td>
                                <td className="px-3 py-2 text-center">{r.openAgeDays}</td>
                                <td className="px-3 py-2">
                                  <span className={`px-2 py-0.5 rounded-md font-bold text-[10px] ${
                                    r.isOverdue
                                      ? "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300"
                                      : r.remaining === 0
                                      ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300"
                                      : "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300"
                                  }`}>
                                    {r.overdueLabel}
                                  </span>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>

                </div>

                {/* Footer */}
                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    type="button"
                    onClick={() => setShowDashboardSummaryModal(false)}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-slate-200 hover:bg-slate-300 text-slate-800 dark:bg-slate-700 dark:text-slate-200 transition"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal ยืนยันการล้างข้อมูลในแอปเพื่อเริ่มต้นใช้งานใหม่ (Admin Only) */}
          {isAdminAuthenticated && showResetConfirmModal && (
            <div className="fixed inset-0 z-[120] flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-rose-300 dark:border-rose-800 p-6 space-y-4">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-2.5">
                    <div className="w-11 h-11 rounded-2xl bg-rose-100 dark:bg-rose-950/70 text-rose-600 flex items-center justify-center text-xl shrink-0">
                      🧹
                    </div>
                    <div>
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-rose-600 block">
                        SYSTEM CLEAN RESET
                      </span>
                      <h3 className="text-base font-extrabold text-slate-900 dark:text-white mt-0.5">
                        ล้างข้อมูลในแอปเพื่อเริ่มต้นใหม่
                      </h3>
                    </div>
                  </div>
                  <button onClick={() => setShowResetConfirmModal(false)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-3.5 rounded-2xl bg-rose-50/60 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 text-xs text-rose-900 dark:text-rose-200 space-y-2">
                  <p className="font-bold flex items-center gap-1">
                    <span>⚠️ การดำเนินการนี้จะทำการรีเซ็ตระบบดังนี้:</span>
                  </p>
                  <ul className="list-disc list-inside space-y-1 text-[11px] text-slate-600 dark:text-slate-300">
                    <li>ล้างคำขอและตำแหน่งงานทดสอบทั้งหมดบนกระดานให้เป็น <strong>0 ตำแหน่ง</strong></li>
                    <li>ปลดการผูกผู้สมัครทั้งหมดใน Candidate Pool กลับสู่สถานะว่าง</li>
                    <li>ล้างข้อมูลแคชในเบราว์เซอร์ของเครื่องนี้</li>
                    <li>ส่งคำสั่งล้างข้อมูลกลางไปยังเซิร์ฟเวอร์ Google Apps Script</li>
                    <li>กระจายคำสั่งล้างข้อมูลไปยังทุกหน้าต่าง/แท็บที่เปิดอยู่ทันที</li>
                  </ul>
                </div>

                <p className="text-[11px] text-slate-500 dark:text-slate-400">
                  เหมาะสำหรับเมื่อต้องการนำแอปไปเริ่มใช้งานจริงกับข้อมูลจริงขององค์กร
                </p>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                  <button
                    type="button"
                    disabled={isResetting}
                    onClick={() => setShowResetConfirmModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 transition"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    disabled={isResetting}
                    onClick={handleResetAppData}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 active:scale-95 disabled:opacity-50 shadow-md shadow-rose-600/20 transition flex items-center gap-1.5"
                  >
                    <span>{isResetting ? "กำลังล้างข้อมูล..." : "ยืนยันล้างข้อมูลทั้งหมด"}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Google Sign-in Corporate Authentication Modal (Clean & Minimal) */}
          {showLoginModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-7 overflow-hidden text-center">
                
                {/* Close Button */}
                <button
                  type="button"
                  onClick={() => { setShowLoginModal(false); setLoginError(""); }}
                  className="absolute top-4 right-4 p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>

                {/* Google Icon Badge */}
                <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-3 shadow-inner">
                  <svg className="w-6 h-6" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                </div>

                <h3 className="text-base font-extrabold text-slate-900 dark:text-white mb-5">
                  Sign in with Google
                </h3>

                {/* Official Google Identity Services Button Container */}
                <div className="flex flex-col items-center justify-center min-h-[46px]">
                  <div id="googleSignInBtnContainer" className="flex justify-center"></div>
                  {isGsiLoading && (
                    <span className="text-xs text-slate-400 mt-2">กำลังเชื่อมต่อ Google...</span>
                  )}
                </div>

                {/* Error alert box */}
                {loginError && (
                  <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-semibold leading-relaxed mt-4 text-center">
                    {loginError}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-[200] px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
