  <script>
    // Suppress Babel 500KB styling deoptimisation notice in console
    (function() {
      const origError = console.error;
      const origWarn = console.warn;
      const filterNotice = function(...args) {
        if (args[0] && typeof args[0] === 'string' && (args[0].includes('exceeds the max of 500KB') || args[0].includes('deoptimised the styling'))) {
          return true;
        }
        return false;
      };
      console.error = function(...args) {
        if (filterNotice(...args)) return;
        origError.apply(console, args);
      };
      console.warn = function(...args) {
        if (filterNotice(...args)) return;
        origWarn.apply(console, args);
      };
    })();

    // Register React Classic runtime preset to ensure JSX compiles to React.createElement without ES module imports
    if (window.Babel && Babel.availablePresets && Babel.availablePresets.react) {
      try {
        Babel.registerPreset('react-classic', {
          presets: [
            [Babel.availablePresets.react, { runtime: 'classic' }]
          ]
        });
      } catch (err) {
        console.warn('Preset registration error:', err);
      }
    }
  </script>

      return clean1 === clean2 || clean1.includes(clean2) || clean2.includes(clean1);
    };

    const normalizeAuthorizedEmails = (val) => {
      if (!val) return [];
      let rawList = [];
      if (Array.isArray(val)) {
        rawList = val;
      } else if (typeof val === "string") {
        const trimmed = val.trim();
        if (!trimmed) return [];
        if (trimmed.startsWith("[")) {
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed)) rawList = parsed;
          } catch (e) {
            rawList = trimmed.split(/[,;\s]+/);
          }
        } else {
          rawList = trimmed.split(/[,;\s]+/);
        }
      }
      const seen = new Set();
      return rawList
        .map(em => String(em || "").trim().toLowerCase())
        .filter(em => {
          if (!em || !em.includes("@") || seen.has(em)) return false;
          seen.add(em);
          return true;
        });
    };

    const normalizeDateInput = (val) => {
      if (!val) return "";
      const s = String(val).trim();
      if (!s || s === "-") return "";
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      const slashMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (slashMatch) {
        const dd = slashMatch[1].padStart(2, '0');
        const mm = slashMatch[2].padStart(2, '0');
        let yyyy = parseInt(slashMatch[3], 10);
        if (yyyy > 2400) yyyy -= 543;
        return `${yyyy}-${mm}-${dd}`;
      }
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        return d.toISOString().split('T')[0];
      }
      return s;
    };

    // Helper: แปลงวันที่และเวลาให้อ่านง่าย กระชับ สะอาดตา (เช่น "21 ต.ค. 2026" หรือ "21 ต.ค. 2026 (14:30 น.)")
    const formatCleanDateTime = (val, forceTime = false) => {
      if (!val || val === "-" || String(val).trim() === "") return "-";
      const str = String(val).trim();
      const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

      const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/);
      if (isoMatch) {
        const y = parseInt(isoMatch[1], 10);
        const m = parseInt(isoMatch[2], 10) - 1;
        const day = parseInt(isoMatch[3], 10);
        const datePart = `${day} ${thaiMonths[m] || isoMatch[2]} ${y}`;
        if ((forceTime || isoMatch[4]) && isoMatch[4] && isoMatch[5]) {
          return `${datePart} (${isoMatch[4]}:${isoMatch[5]} น.)`;
        }
        return datePart;
      }

      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const datePart = `${d.getDate()} ${thaiMonths[d.getMonth()]} ${d.getFullYear()}`;
        if (forceTime && (str.includes(":") || str.includes("T"))) {
          const hh = String(d.getHours()).padStart(2, '0');
          const mm = String(d.getMinutes()).padStart(2, '0');
          return `${datePart} (${hh}:${mm} น.)`;
        }
        return datePart;
      }
      return str;
    };

    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      const offerLeadTimeWorkingDays = offerSentDate
        ? calculateWorkingDays(requestDate, offerSentDate)
        : workingDaysElapsed;

      return {
        workingDaysElapsed,
        workingDaysRemaining,
        isCompleted,
        isOverdue,
        offerLeadTimeWorkingDays
      };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate = null, lastUpdated = null) => {
      const startStr = normalizeDateInput(requestDate);
      const endRaw = hireDate || (lastUpdated ? String(lastUpdated).split(' ')[0] : "") || new Date().toISOString().split('T')[0];
      const endStr = normalizeDateInput(endRaw);

      let totalDays = 0;
      if (startStr && endStr) {
        const d1 = new Date(startStr);
        const d2 = new Date(endStr);
        if (!isNaN(d1.getTime()) && !isNaN(d2.getTime())) {
          d1.setHours(0, 0, 0, 0);
          d2.setHours(0, 0, 0, 0);
          totalDays = Math.max(0, Math.round((d2.getTime() - d1.getTime()) / (1000 * 60 * 60 * 24)));
        }
      }

      const workingDays = calculateWorkingDays(startStr, endStr);
      const rangeText = startStr ? `${formatCleanDateTime(startStr)} → ${formatCleanDateTime(endStr)}` : "-";

      return {
        totalDays,
        workingDays,
        rangeText
      };
    };

    const getInterviewRelativeTimeInfo = (interviewSchedule) => {
      if (!interviewSchedule) return null;
      const dateMatch = String(interviewSchedule).match(/(\d{4}-\d{2}-\d{2})/);
      if (!dateMatch) return null;

      const targetDate = new Date(dateMatch[1]);
      if (isNaN(targetDate.getTime())) return null;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      targetDate.setHours(0, 0, 0, 0);

      const diffDays = Math.round((targetDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return {
          text: `ผ่านไปแล้ว ${Math.abs(diffDays)} วัน`,
          badge: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-200 dark:border-slate-700 font-medium",

    // Helper function to extract and normalize Google Meet URLs
    const extractGoogleMeetUrl = (item) => {
      if (!item) return "";
      if (item.googleMeetUrl && typeof item.googleMeetUrl === 'string' && item.googleMeetUrl.trim()) {
        let url = item.googleMeetUrl.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        return url;
      }
      const scheduleStr = item.interviewSchedule || (typeof item === 'string' ? item : "");
      if (typeof scheduleStr === 'string') {
        const match = scheduleStr.match(/(https?:\/\/meet\.google\.com\/[a-zA-Z0-9_\-]+|meet\.google\.com\/[a-zA-Z0-9_\-]+)/);
        if (match) {
          let url = match[0];
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
          }
          return url;
        }
      }
      return "";
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }
    function SearchableSelect({ value, onChange, options, placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, emptyValue = "", className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);

      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim() || searchTerm.trim() === "-") return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm(optVal || "");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={(e) => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm(value || "");
                  try { e.target.select(); } catch (err) {}
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  const val = e.target.value;
                  setSearchTerm(val);
                  if (!isOpen) setIsOpen(true);
                  onChange(val);
                }
              }}
              onBlur={() => {
                if (emptyValue === "-" && (!value || !String(value).trim())) {
                  onChange("-");
                }
              }}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onMouseDown={(e) => {
                      e.preventDefault();
                      handleSelect(opt.value);
                    }}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'

                ))
              )}

          )}
        </div>
      );
    }

        return primaryList;
      });

      const [deletedSlotIds, setDeletedSlotIds] = useState(() => {
        try {
          const saved = localStorage.getItem(DELETED_SLOTS_KEY);
          return saved ? new Set(JSON.parse(saved)) : new Set();
        } catch (e) {
          return new Set();
        }
      });

      const [deletedReqIds, setDeletedReqIds] = useState(() => {
        try {
          const saved = localStorage.getItem(DELETED_REQS_KEY);
          return saved ? new Set(JSON.parse(saved)) : new Set();
        } catch (e) {
          return new Set();
        }
      });

      const [personnelList, setPersonnelList] = useState(() => {
        const saved = localStorage.getItem(PROD_PERSONNEL_KEY);
        return saved ? JSON.parse(saved) : INITIAL_PERSONNEL_LIST;
      });

      const [candidatePool, setCandidatePool] = useState(() => {
        const saved = localStorage.getItem(PROD_CANDIDATES_KEY);
        return saved ? JSON.parse(saved) : INITIAL_CANDIDATE_POOL;
      });

      const [googleScriptUrl, setGoogleScriptUrl] = useState(() => {
        const savedUrl = localStorage.getItem("hr_apps_script_url_v64") || localStorage.getItem("hr_apps_script_url_v62");
        if (savedUrl && savedUrl.trim()) {
          return savedUrl.trim();
        }
        localStorage.setItem("hr_apps_script_url_v64", DEFAULT_APPS_SCRIPT_WEBAPP_URL);
        return DEFAULT_APPS_SCRIPT_WEBAPP_URL;
      });

      const [lastSyncedTime, setLastSyncedTime] = useState(() => new Date().toLocaleTimeString('th-TH'));
      const [isSyncing, setIsSyncing] = useState(false);
      const [showResetConfirmModal, setShowResetConfirmModal] = useState(false);
      const [isResetting, setIsResetting] = useState(false);

      // ฟังก์ชันกระจายสัญญาณอัปเดตแบบเรียลไทม์ระหว่างหน้าต่าง/แท็บทันที (0ms Latency)
      const broadcastCentralSync = (updatedRequests = null, updatedCandidates = null, overrideDeletedSlots = null, overrideDeletedReqs = null) => {
        try {
          if (updatedRequests && Array.isArray(updatedRequests)) {
            localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(updatedRequests));
          }
          const latestDeletedSlots = overrideDeletedSlots
            ? Array.from(overrideDeletedSlots)
            : JSON.parse(localStorage.getItem(DELETED_SLOTS_KEY) || "[]");
          const latestDeletedReqs = overrideDeletedReqs
            ? Array.from(overrideDeletedReqs)
            : JSON.parse(localStorage.getItem(DELETED_REQS_KEY) || "[]");

          if (typeof window !== "undefined" && window.BroadcastChannel) {
            const bc = new BroadcastChannel("hr_central_sync_channel");
            bc.postMessage({
              type: "STATE_BROADCAST",
              time: Date.now(),
              requests: updatedRequests,
              candidates: updatedCandidates,
              deletedSlots: latestDeletedSlots,
              deletedReqs: latestDeletedReqs
            });
            bc.close();
          }
        } catch (e) {}
      };

      // ดักฟังสัญญาณการซิงค์จากหน้าต่างอื่นแบบเรียลไทม์ (ทุกสเตจและรายการที่ลบต้องตรงกันทันที)
      useEffect(() => {
        if (typeof window === "undefined") return;
        
        let bc = null;
        if (window.BroadcastChannel) {
          bc = new BroadcastChannel("hr_central_sync_channel");
          bc.onmessage = (msg) => {
            if (msg.data?.type === "STATE_BROADCAST") {
              const incomingDelSlots = Array.isArray(msg.data.deletedSlots) ? new Set(msg.data.deletedSlots) : null;
              const incomingDelReqs = Array.isArray(msg.data.deletedReqs) ? new Set(msg.data.deletedReqs) : null;

              if (incomingDelSlots) {
                setDeletedSlotIds(incomingDelSlots);
                try { localStorage.setItem(DELETED_SLOTS_KEY, JSON.stringify(Array.from(incomingDelSlots))); } catch (e) {}
              }
              if (incomingDelReqs) {
                setDeletedReqIds(incomingDelReqs);
                try { localStorage.setItem(DELETED_REQS_KEY, JSON.stringify(Array.from(incomingDelReqs))); } catch (e) {}
              }

              if (msg.data.requests && Array.isArray(msg.data.requests)) {
                const filteredReqs = msg.data.requests
                  .filter(r => r && (!incomingDelReqs || !incomingDelReqs.has(r.id)) && (!incomingDelSlots || !incomingDelSlots.has(r.id)))
                  .map(r => ({
                    ...r,
                    slots: (r.slots || []).filter(s => !incomingDelSlots || !incomingDelSlots.has(s.slotId))
                  }))
                  .filter(r => !r.slots || r.slots.length > 0);

                setRequests(filteredReqs);
                localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(filteredReqs));
                localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(filteredReqs));

                setSelectedDetailSlot(prev => {
                  if (!prev) return null;
                  const stillExists = filteredReqs.some(r => (r.slots || []).some(s => s.slotId === prev.slotId));
                  if (!stillExists) {
                    triggerToast("ℹ️ รายการตำแหน่งที่เปิดดูอยู่ถูกลบออกจากระบบแล้ว");
                    return null;
                  }
                  return prev;
                });
              }
              if (msg.data.candidates && Array.isArray(msg.data.candidates)) {
                setCandidatePool(msg.data.candidates);
                localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(msg.data.candidates));
              }
              setLastSyncedTime(new Date().toLocaleTimeString('th-TH'));
            }
          };
        }

        const handleStorageEvent = (e) => {
          if (e.key === DELETED_SLOTS_KEY && e.newValue) {
            try { setDeletedSlotIds(new Set(JSON.parse(e.newValue))); } catch (err) {}
          }
          if (e.key === DELETED_REQS_KEY && e.newValue) {
            try { setDeletedReqIds(new Set(JSON.parse(e.newValue))); } catch (err) {}
          }
          if ((e.key === PROD_REQUESTS_KEY || e.key === SHARED_CENTRAL_REQS_KEY) && e.newValue) {
            try {
              const parsedReqs = JSON.parse(e.newValue);
              setRequests(parsedReqs);
              setSelectedDetailSlot(prev => {
                if (!prev) return null;
                const stillExists = Array.isArray(parsedReqs) && parsedReqs.some(r => (r.slots || []).some(s => s.slotId === prev.slotId));
                return stillExists ? prev : null;
              });
            } catch (err) {}
          }
          if (e.key === PROD_CANDIDATES_KEY && e.newValue) {
            try { setCandidatePool(JSON.parse(e.newValue)); } catch (err) {}
          }
        };
        window.addEventListener("storage", handleStorageEvent);

        return () => {
          if (bc) bc.close();
          window.removeEventListener("storage", handleStorageEvent);
        };
      }, []);

      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem("theme_mode") === "dark" || 
               (!('theme_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem("theme_mode", "dark");
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem("theme_mode", "light");
        }
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(requests));
        try {
          localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(requests));
        } catch (e) {}
      }, [requests]);

      useEffect(() => {
        localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(candidatePool));
      }, [candidatePool]);

      // ฟังก์ชันส่งอัปเดตสเตจและสถานะของ Slot ไปยังศูนย์กลาง (Apps Script Backend)
      const sendCentralSlotStageUpdate = async (slotId, stagePayload, fullUpdatedRequests = null) => {
        if (!slotId) return;
        
        // 1. กระจายสัญญาณไปยังทุกแท็บ/หน้าต่างทันทีด้วยข้อมูลที่อัปเดตแล้ว (0ms)
        broadcastCentralSync(fullUpdatedRequests || requests, candidatePool);

        const targetUrls = [googleScriptUrl, BACKUP_APPS_SCRIPT_WEBAPP_URL].filter((u, i, arr) => u && arr.indexOf(u) === i);
        if (targetUrls.length === 0) return;
        try {
          // 2. ย่อขนาด payload สำหรับ GET URL และส่งพารามิเตอร์หลักระดับบนควบคู่ไปด้วย เพื่อรองรับทุกเวอร์ชันของ Apps Script
          const compactPayload = { ...stagePayload };
          if (compactPayload.requisitionData) {
            const rd = compactPayload.requisitionData;
            compactPayload.requisitionData = {
              id: rd.id,
              requestDate: rd.requestDate,
              lastUpdated: rd.lastUpdated,
              requesterName: rd.requesterName,
              requesterPosition: rd.requesterPosition,
              requesterEmail: rd.requesterEmail,
              department: rd.department,
              division: rd.division,
              candidateSupervisor: rd.candidateSupervisor,
              approverName: rd.approverName,
              approverEmail: rd.approverEmail,
              jobTitle: rd.jobTitle,
              headcountRequired: rd.headcountRequired,
              positionType: rd.positionType,
              replacedEmployeeName: rd.replacedEmployeeName,
              targetDate: rd.targetDate,
              buddy: rd.buddy,
              workLocation: rd.workLocation,
              requestStatus: rd.requestStatus,
              workflowStatus: rd.workflowStatus,
              stage: rd.stage
            };
          }

          const extraQuery = [
            stagePayload.stage ? `stage=${encodeURIComponent(stagePayload.stage)}` : "",
            stagePayload.slotStatus ? `slotStatus=${encodeURIComponent(stagePayload.slotStatus)}` : "",
            stagePayload.workflowStatus ? `workflowStatus=${encodeURIComponent(stagePayload.workflowStatus)}` : "",
            stagePayload.parentRequestId ? `parentRequestId=${encodeURIComponent(stagePayload.parentRequestId)}` : "",
            stagePayload.jobTitle ? `jobTitle=${encodeURIComponent(stagePayload.jobTitle)}` : "",
            stagePayload.department ? `department=${encodeURIComponent(stagePayload.department)}` : "",
            stagePayload.requesterName ? `requesterName=${encodeURIComponent(stagePayload.requesterName)}` : "",
            stagePayload.candidateName !== undefined ? `candidateName=${encodeURIComponent(stagePayload.candidateName)}` : "",
            stagePayload.authorizedEmails !== undefined ? `authorizedEmails=${encodeURIComponent(JSON.stringify(normalizeAuthorizedEmails(stagePayload.authorizedEmails)))}` : ""
          ].filter(Boolean).join("&");

          targetUrls.forEach(scriptUrl => {
            const getUrl = `${scriptUrl}?action=updateSlotStage&slotId=${encodeURIComponent(slotId)}${extraQuery ? `&${extraQuery}` : ""}&data=${encodeURIComponent(JSON.stringify(compactPayload))}&_t=${Date.now()}`;
            fetch(getUrl, { cache: "no-store", mode: "no-cors" }).catch(() => {});

            fetch(scriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "updateSlotStage",
                slotId: slotId,
                ...stagePayload
              })
            }).catch(() => {});
          });
        } catch (e) {}
      };

      // ฟังก์ชันส่งผลการประเมินคะแนนสัมภาษณ์ไปยังศูนย์กลาง (Apps Script Backend)
      const sendCentralEvaluation = async (slotId, evalData, fullUpdatedRequests = null) => {
        if (!slotId || !evalData) return;
        broadcastCentralSync(fullUpdatedRequests || requests, candidatePool);
        if (!googleScriptUrl) return;
        try {
          fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "saveBlindEvaluation",
              slotId: slotId,
              evaluation: evalData
            })
          }).catch(() => {});
        } catch (e) {}
      };

      // ฟังก์ชันส่งการลบตำแหน่งไปยังศูนย์กลาง (Apps Script Backend)
      const sendCentralSlotDeletion = async (slotId, reason, fullUpdatedRequests = null, parentRequestId = "", reqRemoved = false) => {
        if (!slotId) return;
        broadcastCentralSync(fullUpdatedRequests || requests, candidatePool);
        const targetUrls = [googleScriptUrl, BACKUP_APPS_SCRIPT_WEBAPP_URL].filter((u, i, arr) => u && arr.indexOf(u) === i);
        if (targetUrls.length === 0) return;
        try {
          targetUrls.forEach(scriptUrl => {
            // ใช้ทั้ง GET query parameter และ POST เพื่อการันตีว่าคำสั่งลบจะถูกบันทึก 100% ทุก Endpoint
            const getUrl = `${scriptUrl}?action=deleteSlot&slotId=${encodeURIComponent(slotId)}&parentRequestId=${encodeURIComponent(parentRequestId || "")}&reqRemoved=${reqRemoved ? "1" : "0"}&reason=${encodeURIComponent(reason || '')}&_t=${Date.now()}`;
            fetch(getUrl, { cache: "no-store", mode: "no-cors" }).catch(() => {});

            fetch(scriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "deleteSlot",
                slotId: slotId,
                parentRequestId: parentRequestId || "",
                reqRemoved: Boolean(reqRemoved),
                reason: reason || "Deleted by admin"
              })
            }).catch(() => {});
          });
        } catch (e) {}
      };

      // Helper: ดึงข้อมูลกลางแบบทะลุกฎ CORS (Clean Simple Fetch + JSONP Fallback 100%)
      const fetchCentralData = async (targetUrl) => {
        if (!targetUrl) throw new Error("No URL provided");

        // 1. ลองใช้ Simple GET fetch (ไม่มี Custom Headers เพื่อไม่ให้ติด CORS Preflight OPTIONS)
        try {
          const cleanUrl = `${targetUrl}?action=getWorkflowStatuses&_t=${Date.now()}`;
          const res = await fetch(cleanUrl, { method: "GET" });
          if (res.ok) {
            const json = await res.json();
            if (json && json.status === "success") return json;
          }
        } catch (fetchErr) {
          // หาก fetch ติด CORS ให้ลงมาใช้ JSONP อัตโนมัติ
        }

        // 2. JSONP Fallback Engine (ไม่ติดข้อจำกัด CORS ในเบราว์เซอร์หรือ iFrame 100%)
        return new Promise((resolve, reject) => {
          const cbName = "jsonp_sync_" + Math.round(100000 * Math.random()) + "_" + Date.now();
          const script = document.createElement("script");
          let cleaned = false;

          const timer = setTimeout(() => {
            cleanup();
            reject(new Error("Sync timeout"));
          }, 8000);

          const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            clearTimeout(timer);
            if (script.parentNode) script.parentNode.removeChild(script);
            delete window[cbName];
          };

          window[cbName] = (data) => {
            cleanup();
            if (data && data.status === "success") {
              resolve(data);
            } else {
              reject(new Error(data?.message || "Invalid JSONP response"));
            }
          };

          script.onerror = () => {
            cleanup();
            reject(new Error("JSONP load failed"));
          };

          const sep = targetUrl.includes("?") ? "&" : "?";
          script.src = `${targetUrl}${sep}action=getWorkflowStatuses&callback=${cbName}&_t=${Date.now()}`;
          document.body.appendChild(script);
        });
      };

      // Real-time Background Polling & Manual Sync Function (Central Source of Truth)
      const syncWorkflowStatus = async (silent = true) => {
        const urlToUse = googleScriptUrl || DEFAULT_APPS_SCRIPT_WEBAPP_URL;
        if (!urlToUse) return;
        if (!silent) setIsSyncing(true);

        try {
          let resJson = null;

          // ลองดึงจาก URL หลักก่อน ถ้าไม่สำเร็จให้ลอง URL สำรองอัตโนมัติ
          try {
            resJson = await fetchCentralData(urlToUse);
          } catch (primaryErr) {
            if (BACKUP_APPS_SCRIPT_WEBAPP_URL && BACKUP_APPS_SCRIPT_WEBAPP_URL !== urlToUse) {
              resJson = await fetchCentralData(BACKUP_APPS_SCRIPT_WEBAPP_URL);
            } else {
              throw primaryErr;
            }
          }

          if (resJson && resJson.status === "success") {
            // ตรวจสอบว่าแอดมินสั่งล้างข้อมูลกลางจากเครื่องอื่นหรือไม่ หากใช่ให้ล้างแคชเครื่องนี้ให้ตรงกันทันที
            if (resJson.lastResetAt) {
              const localResetAt = localStorage.getItem(LAST_KNOWN_RESET_KEY) || "";
              if (resJson.lastResetAt !== localResetAt) {
                localStorage.setItem(LAST_KNOWN_RESET_KEY, resJson.lastResetAt);
                localStorage.removeItem(PROD_REQUESTS_KEY);
                localStorage.removeItem(SHARED_CENTRAL_REQS_KEY);
                localStorage.removeItem(DELETED_SLOTS_KEY);
                localStorage.removeItem(DELETED_REQS_KEY);
                setRequests([]);
                setDeletedSlotIds(new Set());
                setDeletedReqIds(new Set());
                setSelectedDetailSlot(null);
                setSelectedRequisitionDetail(null);
                setLastSyncedTime(new Date().toLocaleTimeString('th-TH'));
                return;
              }
            }

            const serverStatuses = resJson.data || resJson.slotStages || {};
            const itConfirmedSlots = resJson.itConfirmedSlots || {};
            const slotStages = resJson.slotStages || resJson.data || {};
            const evalsMap = resJson.evaluations || {};
            const remoteRequisitions = resJson.requisitions || resJson.customRequisitions || [];
            const remoteDeletedSlots = resJson.deletedSlots || {};
            const remoteDeletedReqs = resJson.deletedReqs || {};

            // อ่าน Tombstone ล่าสุดจาก localStorage เสมอ (ป้องกันค่าค้างใน Closure ของ Polling) และผสานกับเซิร์ฟเวอร์
            let localStoredDeletedSlots = [];
            let localStoredDeletedReqs = [];
            try { localStoredDeletedSlots = JSON.parse(localStorage.getItem(DELETED_SLOTS_KEY) || "[]"); } catch (e) {}
            try { localStoredDeletedReqs = JSON.parse(localStorage.getItem(DELETED_REQS_KEY) || "[]"); } catch (e) {}

            const currentDeletedSlots = new Set([...deletedSlotIds, ...localStoredDeletedSlots]);
            for (const delId in remoteDeletedSlots) {
              if (remoteDeletedSlots[delId]?.isDeleted) {
                currentDeletedSlots.add(delId);
              }
            }

            const currentDeletedReqs = new Set([...deletedReqIds, ...localStoredDeletedReqs]);
            for (const delReqId in remoteDeletedReqs) {
              if (remoteDeletedReqs[delReqId]) {
                currentDeletedReqs.add(delReqId);
              }
            }

            if (currentDeletedSlots.size > 0) {
              try { localStorage.setItem(DELETED_SLOTS_KEY, JSON.stringify(Array.from(currentDeletedSlots))); } catch (e) {}
              setDeletedSlotIds(new Set(currentDeletedSlots));
            }
            if (currentDeletedReqs.size > 0) {
              try { localStorage.setItem(DELETED_REQS_KEY, JSON.stringify(Array.from(currentDeletedReqs))); } catch (e) {}
              setDeletedReqIds(new Set(currentDeletedReqs));
            }

            setRequests(prevRequests => {
              // 1. ผสานคำขอใหม่จากศูนย์กลาง (ทั้งจาก Local Shared Storage, remoteRequisitions และ slotStages เพื่อให้เห็นตรงกันทุกหน้าต่าง/ทุกอีเมล)
              let baseList = [...prevRequests];
              const existingMap = new Map();
              baseList.forEach(r => existingMap.set(r.id, r));

              // 1.0 ผสานจาก Local Shared Storage (รองรับหลายหน้าต่างในเบราว์เซอร์เดียวกันทันที)
              try {
                const sharedRaw = localStorage.getItem(SHARED_CENTRAL_REQS_KEY);
                if (sharedRaw) {
                  const sharedArr = JSON.parse(sharedRaw);
                  if (Array.isArray(sharedArr)) {
                    sharedArr.forEach(shReq => {
                      if (!shReq || !shReq.id || currentDeletedReqs.has(shReq.id) || currentDeletedSlots.has(shReq.id)) return;
                      if (!existingMap.has(shReq.id)) {
                        const validShSlots = (shReq.slots || []).filter(s => !currentDeletedSlots.has(s.slotId));
                        if (validShSlots.length > 0) {
                          const entry = { ...shReq, slots: validShSlots };
                          baseList.unshift(entry);
                          existingMap.set(shReq.id, entry);
                        }
                      }
                    });
                  }
                }
              } catch (e) {}

              // 1.1 ผสานจาก remoteRequisitions
              if (remoteRequisitions.length > 0) {
                remoteRequisitions.forEach(remReq => {
                  if (currentDeletedReqs.has(remReq.id) || currentDeletedSlots.has(remReq.id)) return;

                  if (!existingMap.has(remReq.id)) {
                    const headcount = Math.max(1, Number(remReq.headcountRequired) || 1);
                    const rawSlots = (remReq.slots && remReq.slots.length > 0)
                      ? remReq.slots
                      : Array.from({ length: headcount }, (_, i) => ({
                          slotId: `${remReq.id}-${i + 1}`,
                          slotIndex: i + 1,
                          slotStatus: remReq.requestStatus || "PENDING_ADMIN",
                          workflowStatus: remReq.workflowStatus || "PENDING_ADMIN",
                          stage: remReq.stage || "received",
                          jobTitle: remReq.jobTitle || "",
                          candidateName: remReq.candidateName || "",
                          candidatePhone: remReq.candidatePhone || "",
                          resumeUrl: remReq.driveUrl || "",
                          driveUrl: remReq.driveUrl || "",
                          authorizedEmails: [],
                          evaluations: []
                        }));

                    const slots = rawSlots
                      .filter(s => !currentDeletedSlots.has(s.slotId))
                      .map(s => ({
                        ...s,
                        jobTitle: (s.jobTitle && s.jobTitle !== "New Position") ? s.jobTitle : (remReq.jobTitle || s.jobTitle || ""),
                        authorizedEmails: normalizeAuthorizedEmails(s.authorizedEmails)
                      }));
                    if (slots.length > 0) {
                      const newEntry = { ...remReq, slots };
                      baseList.unshift(newEntry);
                      existingMap.set(remReq.id, newEntry);
                    }
                  } else {
                    const existingReq = existingMap.get(remReq.id);
                    if (existingReq) {
                      if ((!existingReq.jobTitle || existingReq.jobTitle === "New Position") && remReq.jobTitle && remReq.jobTitle !== "New Position") {
                        existingReq.jobTitle = remReq.jobTitle;
                      }
                      if ((!existingReq.requesterName || existingReq.requesterName === "-") && remReq.requesterName && remReq.requesterName !== "-") {
                        existingReq.requesterName = remReq.requesterName;
                      }
                      if ((!existingReq.department || existingReq.department === "-") && remReq.department && remReq.department !== "-") {
                        existingReq.department = remReq.department;
                      }
                      if ((!existingReq.division || existingReq.division === "-") && remReq.division && remReq.division !== "-") {
                        existingReq.division = remReq.division;
                      }
                    }
                  }
                });
              }

              // 1.2 ผสานคำขอใหม่ที่ถูกส่งผ่าน slotStages (รองรับทุกหน้าต่างและทุกบัญชี User/Admin 100%)
              if (slotStages && typeof slotStages === "object") {
                Object.entries(slotStages).forEach(([slotKey, stageData]) => {
                  if (!stageData || typeof stageData !== "object") return;
                  if (stageData.isDeleted || currentDeletedSlots.has(slotKey)) return;

                  const parentId = stageData.parentRequestId || stageData.requisitionData?.id || String(slotKey).replace(/-\d+$/, "");
                  if (!parentId || currentDeletedReqs.has(parentId) || currentDeletedSlots.has(parentId)) return;

                  const matchedRemoteReq = remoteRequisitions.find(rr => rr.id === parentId) || {};
                  const reqTemplate = { ...matchedRemoteReq, ...(stageData.requisitionData || {}) };
                  const cleanTemplateTitle = (reqTemplate.jobTitle && reqTemplate.jobTitle !== "New Position") ? reqTemplate.jobTitle : "";
                  const cleanStageTitle = (stageData.jobTitle && stageData.jobTitle !== "New Position") ? stageData.jobTitle : "";
                  const resolvedTitle = cleanTemplateTitle || cleanStageTitle;

                  if (!existingMap.has(parentId)) {
                    const headcount = Math.max(1, Number(reqTemplate.headcountRequired) || 1);
                    const reconstructedSlots = (Array.isArray(reqTemplate.slots) && reqTemplate.slots.length > 0)
                      ? reqTemplate.slots.map(sl => {
                          const sOver = slotStages[sl.slotId] || (sl.slotId === slotKey ? stageData : {});
                          const sOverTitle = (sOver.jobTitle && sOver.jobTitle !== "New Position") ? sOver.jobTitle : "";
                          const slTitle = (sl.jobTitle && sl.jobTitle !== "New Position") ? sl.jobTitle : "";
                          return {
                            ...sl,
                            jobTitle: sOverTitle || slTitle || resolvedTitle || "Manpower Requisition",
                            stage: sOver.stage || sl.stage || "received",
                            slotStatus: sOver.slotStatus || sl.slotStatus || "PENDING_ADMIN",
                            workflowStatus: sOver.workflowStatus || sl.workflowStatus || "PENDING_ADMIN",
                            authorizedEmails: sOver.authorizedEmails !== undefined
                              ? normalizeAuthorizedEmails(sOver.authorizedEmails)
                              : normalizeAuthorizedEmails(sl.authorizedEmails)
                          };
                        })
                      : Array.from({ length: headcount }, (_, i) => {
                          const sid = `${parentId}-${i + 1}`;
                          const sOver = slotStages[sid] || (sid === slotKey ? stageData : {});
                          const sOverTitle = (sOver.jobTitle && sOver.jobTitle !== "New Position") ? sOver.jobTitle : "";
                          return {
                            slotId: sid,
                            slotIndex: i + 1,
                            slotStatus: sOver.slotStatus || stageData.slotStatus || "PENDING_ADMIN",
                            workflowStatus: sOver.workflowStatus || stageData.workflowStatus || "PENDING_ADMIN",
                            stage: sOver.stage || stageData.stage || "received",
                            jobTitle: sOverTitle || resolvedTitle || "Manpower Requisition",
                            candidateName: sOver.candidateName || "",
                            candidatePhone: sOver.candidatePhone || "",
                            candidateNickname: sOver.candidateNickname || "",
                            resumeUrl: sOver.resumeUrl || "",
                            authorizedEmails: sOver.authorizedEmails !== undefined
                              ? normalizeAuthorizedEmails(sOver.authorizedEmails)
                              : [],
                            evaluations: []
                          };
                        });

                    const validSlots = reconstructedSlots.filter(sl => !currentDeletedSlots.has(sl.slotId));
                    if (validSlots.length > 0) {
                      const reconstructedReq = {
                        id: parentId,
                        requestDate: reqTemplate.requestDate || new Date().toISOString().split('T')[0],
                        lastUpdated: reqTemplate.lastUpdated || new Date().toISOString().replace('T', ' ').substring(0, 19),
                        requesterName: reqTemplate.requesterName || stageData.requesterName || "-",
                        requesterPosition: reqTemplate.requesterPosition || "-",
                        requesterEmail: reqTemplate.requesterEmail || "-",
                        department: reqTemplate.department || stageData.department || "-",
                        division: reqTemplate.division || "-",
                        candidateSupervisor: reqTemplate.candidateSupervisor || "-",
                        approverName: reqTemplate.approverName || "ศรัณย์ภัทธ อุบล",
                        approverEmail: reqTemplate.approverEmail || "sarunpat.ub@valuesourcing.co",
                        jobTitle: resolvedTitle || "Manpower Requisition",
                        headcountRequired: validSlots.length,
                        positionType: reqTemplate.positionType || "New Headcount",
                        replacedEmployeeName: reqTemplate.replacedEmployeeName || "",
                        targetDate: reqTemplate.targetDate || "",
                        buddy: reqTemplate.buddy || "-",
                        workLocation: reqTemplate.workLocation || "Dusit Central Park",
                        gender: reqTemplate.gender || "ไม่ระบุ",
                        age: reqTemplate.age || "ไม่จำกัด",
                        educationLevel: reqTemplate.educationLevel || "ปริญญาตรี",
                        major: reqTemplate.major || "-",
                        experience: reqTemplate.experience || "1-3 ปี",
                        mustHaveQualifications: reqTemplate.mustHaveQualifications || "-",
                        jobDescription: reqTemplate.jobDescription || "-",
                        itLaptop: reqTemplate.itLaptop || "ต้องการ",
                        itSimCard: reqTemplate.itSimCard || "ไม่ต้องการ",
                        itEmail: reqTemplate.itEmail || "ต้องการ",
                        itNetsuite: reqTemplate.itNetsuite || "ไม่ต้องการ",
                        requestStatus: stageData.slotStatus || reqTemplate.requestStatus || "PENDING_ADMIN",
                        workflowStatus: stageData.workflowStatus || reqTemplate.workflowStatus || "PENDING_ADMIN",
                        stage: stageData.stage || reqTemplate.stage || "received",
                        slots: validSlots
                      };
                      baseList.unshift(reconstructedReq);
                      existingMap.set(parentId, reconstructedReq);
                    }
                  } else {
                    // หากมีคำขอนี้แล้ว อัปเดตข้อมูลที่อาจขาดหายและตรวจสอบ Slot ใหม่ที่ถูกคัดลอกมาจากหน้าต่างอื่น
                    const targetParent = existingMap.get(parentId);
                    if (targetParent) {
                      if ((!targetParent.jobTitle || targetParent.jobTitle === "New Position") && resolvedTitle) {
                        targetParent.jobTitle = resolvedTitle;
                      }
                      if ((!targetParent.requesterName || targetParent.requesterName === "-") && (reqTemplate.requesterName || stageData.requesterName)) {
                        targetParent.requesterName = reqTemplate.requesterName || stageData.requesterName;
                      }
                      if ((!targetParent.department || targetParent.department === "-") && (reqTemplate.department || stageData.department)) {
                        targetParent.department = reqTemplate.department || stageData.department;
                      }
                      if ((!targetParent.division || targetParent.division === "-") && reqTemplate.division) {
                        targetParent.division = reqTemplate.division;
                      }
                      if (Array.isArray(targetParent.slots)) {
                        targetParent.slots = targetParent.slots.map(sl => ({
                          ...sl,
                          jobTitle: (sl.jobTitle && sl.jobTitle !== "New Position") ? sl.jobTitle : (resolvedTitle || targetParent.jobTitle)
                        }));
                        if (!targetParent.slots.some(sl => sl.slotId === slotKey)) {
                          const idxMatch = String(slotKey).match(/-(\d+)$/);
                          const slotIdx = idxMatch ? parseInt(idxMatch[1], 10) : (targetParent.slots.length + 1);
                          targetParent.slots.push({
                            slotId: slotKey,
                            slotIndex: slotIdx,
                            slotStatus: stageData.slotStatus || "READY_FOR_RECRUITMENT",
                            workflowStatus: stageData.workflowStatus || "READY_FOR_RECRUITMENT",
                            stage: stageData.stage || "manpower",
                            jobTitle: cleanStageTitle || targetParent.jobTitle,
                            candidateName: stageData.candidateName || "",
                            candidatePhone: stageData.candidatePhone || "",
                            candidateNickname: stageData.candidateNickname || "",
                            resumeUrl: stageData.resumeUrl || "",
                            authorizedEmails: normalizeAuthorizedEmails(stageData.authorizedEmails),
                            evaluations: []
                          });
                        }
                      }
                    }
                  }
                });
              }

              // 2. นำสถานะกลาง (Central Live Overrides) มาใช้กับทุก Slot โดยกรองรายการที่ลบแล้วทิ้ง 100%
              const updatedList = baseList.map(r => {
                if (currentDeletedReqs.has(r.id) || currentDeletedSlots.has(r.id)) return null;

                const mainId = r.id;
                const cleanId = String(mainId).replace(/-\d+$/, "");
                const remoteWfItem = serverStatuses[mainId] || serverStatuses[cleanId];

                const updatedSlots = (r.slots || []).map(s => {
                  if (currentDeletedSlots.has(s.slotId) || remoteDeletedSlots[s.slotId]?.isDeleted) {
                    return null; // ลบออกอย่างเด็ดขาด ไม่ให้โผล่มาอีก
                  }

                  const stageOverride = slotStages[s.slotId] || slotStages[mainId];
                  const itAckFromRemote = Boolean(itConfirmedSlots[s.slotId] || itConfirmedSlots[mainId]);
                  const remoteEvals = evalsMap[s.slotId] || [];

                  if (stageOverride?.isDeleted) {
                    return null; // ลบออกตามคำสั่งของแอดมินกลาง
                  }

                  const hasRecentLocalUpdate = s.stageUpdatedAt && (Date.now() - s.stageUpdatedAt < 60000);
                  const newWfStatus = hasRecentLocalUpdate ? s.workflowStatus : (stageOverride?.slotStatus || remoteWfItem?.status || s.workflowStatus);
                  const isItConfirmed = itAckFromRemote || s.itEquipmentConfirmed || Boolean(stageOverride?.itEquipmentConfirmed);
                  const effectiveStage = hasRecentLocalUpdate ? s.stage : (stageOverride?.stage || s.stage || "received");
                  const effectiveSlotStatus = hasRecentLocalUpdate ? s.slotStatus : (stageOverride?.slotStatus || s.slotStatus);
                  const effectiveAuthEmails = stageOverride && stageOverride.authorizedEmails !== undefined
                    ? normalizeAuthorizedEmails(stageOverride.authorizedEmails)
                    : normalizeAuthorizedEmails(s.authorizedEmails);
                  const overrideJobTitle = (stageOverride?.jobTitle && stageOverride.jobTitle !== "New Position") ? stageOverride.jobTitle : "";
                  const currentSlotJobTitle = (s.jobTitle && s.jobTitle !== "New Position") ? s.jobTitle : "";
                  const parentReqJobTitle = (r.jobTitle && r.jobTitle !== "New Position") ? r.jobTitle : "";

                  return {
                    ...s,
                    jobTitle: overrideJobTitle || currentSlotJobTitle || parentReqJobTitle || s.jobTitle,
                    workflowStatus: newWfStatus || s.workflowStatus,
                    slotStatus: effectiveSlotStatus,
                    stage: effectiveStage,
                    priority: stageOverride?.priority || s.priority || "NORMAL",
                    candidateName: stageOverride?.candidateName !== undefined ? stageOverride.candidateName : s.candidateName,
                    candidatePhone: stageOverride?.candidatePhone !== undefined ? stageOverride.candidatePhone : s.candidatePhone,
                    candidateNickname: stageOverride?.candidateNickname !== undefined ? stageOverride.candidateNickname : s.candidateNickname,
                    interviewSchedule: stageOverride?.interviewSchedule !== undefined ? stageOverride.interviewSchedule : s.interviewSchedule,
                    googleMeetUrl: stageOverride?.googleMeetUrl !== undefined ? stageOverride.googleMeetUrl : s.googleMeetUrl,
                    hireDate: stageOverride?.hireDate !== undefined ? stageOverride.hireDate : s.hireDate,
                    rejectionReason: stageOverride?.rejectionReason !== undefined ? stageOverride.rejectionReason : s.rejectionReason,
                    onboardingArrivalStatus: stageOverride?.onboardingArrivalStatus || s.onboardingArrivalStatus || "pending_arrival",
                    hasAttendedFirstDayTraining: stageOverride?.hasAttendedFirstDayTraining !== undefined ? stageOverride.hasAttendedFirstDayTraining : s.hasAttendedFirstDayTraining,
                    itEquipmentConfirmed: isItConfirmed,
                    isItNotified: isItConfirmed ? true : Boolean(stageOverride?.isItNotified || s.isItNotified),
                    isArchivedFromKanban: stageOverride && stageOverride.isArchivedFromKanban !== undefined
                      ? Boolean(stageOverride.isArchivedFromKanban)
                      : Boolean(s.isArchivedFromKanban),
                    authorizedEmails: effectiveAuthEmails,
                    evaluations: remoteEvals.length > 0 ? remoteEvals : (s.evaluations || [])
                  };
                }).filter(Boolean);

                if (updatedSlots.length === 0) return null;

                const hasRecentReqSlot = updatedSlots.some(sl => sl.stageUpdatedAt && (Date.now() - sl.stageUpdatedAt < 60000));
                const newStatus = hasRecentReqSlot ? r.requestStatus : (updatedSlots[0]?.slotStatus || remoteWfItem?.status || r.requestStatus);
                const resolvedParentTitle = (r.jobTitle && r.jobTitle !== "New Position")
                  ? r.jobTitle
                  : (updatedSlots[0]?.jobTitle && updatedSlots[0].jobTitle !== "New Position" ? updatedSlots[0].jobTitle : r.jobTitle);
                return {
                  ...r,
                  jobTitle: resolvedParentTitle,
                  headcountRequired: updatedSlots.length,
                  requestStatus: newStatus || r.requestStatus,
                  workflowStatus: newStatus || r.workflowStatus,
                  slots: updatedSlots
                };
              }).filter(Boolean);

              localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedList));
              try {
                localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(updatedList));
              } catch (e) {}
              return updatedList;
            });

            setSelectedDetailSlot(prevSlot => {
              if (!prevSlot) return null;
              if (currentDeletedSlots.has(prevSlot.slotId) || currentDeletedReqs.has(prevSlot.parentRequestId) || slotStages[prevSlot.slotId]?.isDeleted) {
                triggerToast("ℹ️ รายการตำแหน่งที่เปิดดูอยู่ถูกลบออกจากระบบแล้ว");
                return null;
              }
              const stageOverride = slotStages[prevSlot.slotId];
              const itAck = Boolean(itConfirmedSlots[prevSlot.slotId] || itConfirmedSlots[prevSlot.parentRequestId]);
              const remoteEvals = evalsMap[prevSlot.slotId];

              if (stageOverride || itAck || remoteEvals) {
                const safeTitle = (stageOverride?.jobTitle && stageOverride.jobTitle !== "New Position")
                  ? stageOverride.jobTitle
                  : prevSlot.jobTitle;
                return {
                  ...prevSlot,
                  ...(stageOverride || {}),
                  jobTitle: safeTitle,
                  authorizedEmails: stageOverride && stageOverride.authorizedEmails !== undefined
                    ? normalizeAuthorizedEmails(stageOverride.authorizedEmails)
                    : normalizeAuthorizedEmails(prevSlot.authorizedEmails),
                  itEquipmentConfirmed: itAck || prevSlot.itEquipmentConfirmed,
                  evaluations: remoteEvals || prevSlot.evaluations || []
                };
              }
              return prevSlot;
            });

            setLastSyncedTime(new Date().toLocaleTimeString('th-TH'));
            if (!silent) {
              triggerToast("✅ ซิงค์ข้อมูลกลาง (Central Hub) เรียบร้อยแล้ว!");
            }
          }
        } catch (err) {
          if (!silent) {
            triggerToast("⚠️ ไม่สามารถซิงค์สถานะได้ (ตรวจสอบ Web App URL)");
          }
        } finally {
          if (!silent) setIsSyncing(false);
        }
      };

      // ดึงข้อมูลคำขอกำลังคนโดยตรงจากแผ่นงาน Google Sheet GID 1528284561 (ผสานข้อมูลโดยไม่ลบสเตจเดิมทิ้ง)
      const syncRequisitionsFromGoogleSheet = async (showToast = false) => {
        try {
          const res = await fetch(GOOGLE_SHEET_MANPOWER_CSV_URL);
          if (!res.ok) throw new Error("Network error");
          const csvText = await res.text();
          const rows = parseCSVText(csvText);

          if (rows.length > 1) {
            const parsedList = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || r.length < 2) continue;
              const reqId = (r[0] || "").trim();
              if (!reqId || reqId.toLowerCase().includes("request")) continue;

              const headcount = Math.max(1, parseInt(r[11], 10) || 1);
              const driveUrl = (r[32] || "").trim();
              const candName = (r[30] || "").trim();
              const candPhone = (r[31] || "").trim();

              const slots = Array.from({ length: headcount }, (_, idx) => ({
                slotId: `${reqId}-${idx + 1}`,
                slotIndex: idx + 1,
                slotStatus: r[28] || "PENDING_ADMIN",
                workflowStatus: r[28] || "PENDING_ADMIN",
                stage: "received",
                candidateName: candName,
                candidatePhone: candPhone,
                resumeUrl: driveUrl,
                driveUrl: driveUrl,
                evaluations: []
              }));

              parsedList.push({
                id: reqId,
                requestDate: normalizeDateInput((r[1] || "").trim()),
                requesterName: (r[2] || "").trim(),
                requesterPosition: (r[3] || "").trim(),
                requesterEmail: (r[4] || "").trim(),
                department: (r[5] || "-").trim(),
                division: (r[6] || "-").trim(),
                candidateSupervisor: (r[7] || "-").trim(),
                approverName: (r[8] || "ศรัณย์ภัทธ อุบล").trim(),
                approverEmail: (r[9] || "sarunpat.ub@valuesourcing.co").trim(),
                jobTitle: (r[10] || "").trim(),
                headcountRequired: headcount,
                positionType: (r[12] || "Replacement").trim(),
                replacedEmployeeName: (r[13] || "").trim(),
                targetDate: normalizeDateInput((r[14] || "").trim()),
                buddy: (r[15] || "").trim(),
                workLocation: (r[16] || "Dusit Central Park").trim(),
                gender: (r[17] || "ไม่ระบุ").trim(),
                age: (r[18] || "ไม่จำกัด").trim(),
                educationLevel: (r[19] || "ปริญญาตรี").trim(),
                major: (r[20] || "-").trim(),
                experience: (r[21] || "1-3 ปี").trim(),
                mustHaveQualifications: (r[22] || "-").trim(),
                jobDescription: (r[23] || "-").trim(),
                itLaptop: (r[24] || "ต้องการ").trim(),
                itSimCard: (r[25] || "ไม่ต้องการ").trim(),
                itEmail: (r[26] || "ต้องการ").trim(),
                itNetsuite: (r[27] || "ไม่ต้องการ").trim(),
                requestStatus: (r[28] || "PENDING_ADMIN").trim(),
                workflowStatus: (r[28] || "PENDING_ADMIN").trim(),
                lastUpdated: (r[29] || "").trim(),
                candidateName: candName,
                candidatePhone: candPhone,
                driveUrl: driveUrl,
                resumeUrl: driveUrl,
                slots: slots
              });
            }

            if (parsedList.length > 0) {
              setRequests(prev => {
                const prevMap = new Map();
                prev.forEach(item => prevMap.set(item.id, item));

                const mergedList = parsedList.map(item => {
                  const existing = prevMap.get(item.id);
                  if (!existing) return item;

                  // รักษาข้อมูล slots เดิมที่แอดมินหรือระบบกลางได้ย้ายสเตจไปแล้ว 100%
                  const mergedSlots = (existing.slots && existing.slots.length > 0)
                    ? existing.slots.map(es => {
                        const csvSlot = (item.slots || []).find(cs => cs.slotId === es.slotId);
                        return {
                          ...(csvSlot || {}),
                          ...es,
                          stage: es.stage || csvSlot?.stage || "received",
                          candidateName: es.candidateName || csvSlot?.candidateName || "",
                          resumeUrl: es.resumeUrl || csvSlot?.resumeUrl || ""
                        };
                      })
                    : item.slots;

                  return {
                    ...item,
                    ...existing,
                    slots: mergedSlots
                  };
                });

                // เก็บรักษารายการคำขอใหม่ที่สร้างในระบบแต่ยังไม่ปรากฏใน CSV
                const parsedIdSet = new Set(parsedList.map(p => p.id));
                prev.forEach(item => {
                  if (!parsedIdSet.has(item.id)) {
                    mergedList.push(item);
                  }
                });

                localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(mergedList));
                return mergedList;
              });
              if (showToast) triggerToast(`ซิงค์ Requisitions จาก Google Sheet สำเร็จ (${parsedList.length} รายการ)`);
            }
          }
        } catch (e) {
          if (showToast) triggerToast("เชื่อมต่อข้อมูลชีทล้มเหลว");
        }
      };

      // Auto-Polling ทุก 2.5 วินาที และซิงค์ทันทีเมื่อสลับหน้าต่างกลับมา
      useEffect(() => {
        syncWorkflowStatus(true);
        // หมายเหตุ: ไม่ดึงข้อมูลเก่าจาก Google Sheet CSV อัตโนมัติเมื่อเริ่มระบบ เพื่อให้เริ่มต้นใช้งานใหม่ได้อย่างสะอาดหมดจด
        // (สามารถกดปุ่ม "ซิงค์จาก Sheet" ได้เองเมื่อต้องการนำเข้า)

        const pollingInterval = setInterval(() => {
          syncWorkflowStatus(true);
        }, 2500);

        const handleWindowFocus = () => {
          syncWorkflowStatus(true);
          const savedReq = localStorage.getItem(PROD_REQUESTS_KEY);
          if (savedReq) {
            try { setRequests(JSON.parse(savedReq)); } catch (err) {}
          }
          const savedCand = localStorage.getItem(PROD_CANDIDATES_KEY);
          if (savedCand) {
            try { setCandidatePool(JSON.parse(savedCand)); } catch (err) {}
          }
        };

        window.addEventListener("focus", handleWindowFocus);
        window.addEventListener("visibilitychange", handleWindowFocus);

        return () => {
          clearInterval(pollingInterval);
          window.removeEventListener("focus", handleWindowFocus);
          window.removeEventListener("visibilitychange", handleWindowFocus);
        };
      }, [googleScriptUrl]);

      // 🔐 Production Google Authentication & User Profile State
      // Starts clean at Sign in with Google: Admin emails -> Admin View, all other Google logins -> User View
      const [currentUser, setCurrentUser] = useState(() => {
        const savedSession = localStorage.getItem("vs_corporate_auth_token_v2");
        if (savedSession) {
          try {
            const parsed = JSON.parse(savedSession);
            if (parsed && parsed.email) {
              const roleInfo = getUserRoleInfo(parsed.email);
              return {
                ...parsed,
                ...roleInfo
              };
            }
          } catch (e) {}
        }
        return null;
      });

      const [adminSubTab, setAdminSubTab] = useState("kanban");
      const [manpowerTableTab, setManpowerTableTab] = useState("in_process");
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginError, setLoginError] = useState("");
      const [isGsiLoading, setIsGsiLoading] = useState(false);
      const [googleClientId, setGoogleClientId] = useState(() => {
        try {
          localStorage.removeItem("vs_google_oauth_client_id_v1");
        } catch (e) {}
        return localStorage.getItem(GOOGLE_CLIENT_ID_STORAGE_KEY) || DEFAULT_GOOGLE_CLIENT_ID;
      });
      const [clientIdInput, setClientIdInput] = useState(() => {
        return localStorage.getItem(GOOGLE_CLIENT_ID_STORAGE_KEY) || DEFAULT_GOOGLE_CLIENT_ID;
      });

      const isAdminAuthenticated = Boolean(currentUser && (currentUser.isAdmin || currentUser.isSuperAdmin));
      const activeUserEmail = useMemo(() => {
        if (!currentUser || !currentUser.email) return "";
        return currentUser.email.trim().toLowerCase();
      }, [currentUser]);

      // Helper: ตรวจสอบว่าอีเมลที่ล็อกอินมีสิทธิ์ดูข้อมูลและประเมินสัมภาษณ์ในตำแหน่ง/Slot นี้หรือไม่
      const canUserViewSlotDetails = (slotItem) => {
        if (isAdminAuthenticated) return true;
        if (!activeUserEmail || !slotItem) return false;
        const allowedList = normalizeAuthorizedEmails(slotItem.authorizedEmails);
        return allowedList.includes(activeUserEmail);
      };

      // 🔒 สิทธิ์การมองเห็น: หากไม่ใช่แอดมิน (User View) ให้ล็อกหน้าจอให้อยู่ที่กระดาน Kanban Pipeline & Demand เท่านั้น
      useEffect(() => {
        if (currentUser && !isAdminAuthenticated) {
          setAdminSubTab("kanban");
        }
      }, [currentUser, isAdminAuthenticated]);

      // Handle Google Sign-in Callback from GIS SDK
      const handleGoogleCredentialResponse = (response) => {
        try {
          setLoginError("");
          if (!response || !response.credential) {
            setLoginError("ไม่พบข้อมูลการยืนยันตัวตนจาก Google กรุณาลองใหม่อีกครั้ง");
            return;
          }

          const decoded = decodeGoogleCredential(response.credential);
          if (!decoded || !decoded.email) {
            setLoginError("ไม่สามารถถอดรหัสข้อมูลบัญชี Google ได้");
            return;
          }

          const userEmail = decoded.email.trim().toLowerCase();
          const roleInfo = getUserRoleInfo(userEmail);
          const userProfile = {
            email: userEmail,
            name: decoded.name || userEmail.split('@')[0],
            picture: decoded.picture || "",
            token: response.credential,
            ...roleInfo

      const allPositionSlots = useMemo(() => {
        const seenSlotIds = new Set();
        return requests.flatMap(r => {
          if (deletedReqIds.has(r.id)) return [];

          const headcount = Math.max(1, Number(r.headcountRequired) || (r.slots?.length || 1));
          const rawSlots = (r.slots && r.slots.length > 0) 
            ? r.slots 
            : Array.from({ length: headcount }, (_, i) => ({
                slotId: `${r.id}-${i + 1}`,

                slotStatus: r.requestStatus || "READY_FOR_RECRUITMENT",

                candidateNickname: "",
                resumeUrl: "",
                stage: r.stage || "received",

                hireDate: "",
                interviewSchedule: "",
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",

                evaluations: []
              }));

          const slots = rawSlots.filter(s => !deletedSlotIds.has(s.slotId));

          return slots.filter(slot => {
            if (seenSlotIds.has(slot.slotId)) return false;
            if (deletedSlotIds.has(slot.slotId)) return false;
            seenSlotIds.add(slot.slotId);
            return true;
          }).map((slot, sIdx) => {
            const actualSlotIndex = slot.slotIndex || (sIdx + 1);

              (slot.candidateName && c.fullName && isSameCandidate(c.fullName, slot.candidateName))
            );
            const interviewInfo = slot.interviewSchedule || matchedCand?.interviewDate || "";
            const currentEvals = slot.evaluations || [];
            const evalStats = calculateOverallScore(currentEvals);

            const isCancelled = (slot.stage || r.stage) === "cancelled";
            const arrivalStatus = isCancelled
              ? "declined_noshow"
              : (slot.onboardingArrivalStatus || r.onboardingArrivalStatus || "pending_arrival");

            const slotWfStatus = slot.workflowStatus || slot.slotStatus || r.workflowStatus || r.requestStatus || "PENDING_ADMIN";
            
            // 🌟 ยึดตามสเตจจริงของการ์ด (slot.stage) โดยตรง
            let effectiveStage = slot.stage || r.stage || "received";

            // คำนวณ slotEffectiveStatus: ล็อกสถานะ Pending ให้คงเดิม ไม่เผลอเปลี่ยนเป็น Closed เด็ดขาด
