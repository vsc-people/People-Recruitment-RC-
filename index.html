          return { ...r, slots: updatedSlots };
        });

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(updatedRequests));
        broadcastCentralSync(updatedRequests, candidatePool);
        sendCentralEvaluation(targetSlotId, newEval, updatedRequests);

        setBlindEvalModalSlot(null);
        triggerToast(`⭐ บันทึกผลประเมินคุณ ${blindEvalModalSlot.candidateName || "ผู้สมัคร"} เรียบร้อย (${avg}/5 - ${pct}%)`);
      };

      // Reset App Data Handler (from Kanban Reset Button)
      const handleResetAppData = async () => {
        setIsResetting(true);
        try {
          localStorage.removeItem(PROD_REQUESTS_KEY);
          localStorage.removeItem(SHARED_CENTRAL_REQS_KEY);
          localStorage.removeItem(DELETED_SLOTS_KEY);
          localStorage.removeItem(DELETED_REQS_KEY);

          setRequests([]);
          setDeletedSlotIds(new Set());
          setDeletedReqIds(new Set());
          setCandidatePool(prev => {
            const cleaned = prev.map(c => ({ ...c, assignedSlotId: "" }));
            localStorage.setItem(PROD_CANDIDATES_KEY, JSON.stringify(cleaned));
            return cleaned;
          });

          broadcastCentralSync([], candidatePool.map(c => ({ ...c, assignedSlotId: "" })));

          if (googleScriptUrl) {
            try {
              fetch(`${googleScriptUrl}?action=resetCentralState&_t=${Date.now()}`, { mode: 'no-cors' }).catch(() => {});
              fetch(googleScriptUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "resetCentralState" })
              }).catch(() => {});
            } catch (err) {}
          }

          setShowResetConfirmModal(false);
          triggerToast("🧹 ล้างข้อมูลคำขอและตำแหน่งงานทั้งหมดเรียบร้อยแล้ว!");
        } finally {
          setIsResetting(false);
        }
      };

      // Handler: แอดมินเพิ่ม/ลบสิทธิ์อีเมลในการเข้าดูข้อมูลและประเมินผลของแต่ละตำแหน่งบนกระดาน
      const handleAddAuthorizedEmailToSlot = (slotId, emailToAdd) => {
        const cleanEmail = String(emailToAdd || "").trim().toLowerCase();
        if (!cleanEmail || !cleanEmail.includes("@")) {
          triggerToast("⚠️ กรุณาระบุอีเมลให้ถูกต้อง (เช่น name@valuesourcing.co)");
          return;
        }

        const nowTimestamp = Date.now();
        let updatedEmailsForSlot = [];
        let targetSlotSnapshot = null;

        const updatedRequests = requests.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              const currentList = Array.isArray(s.authorizedEmails) ? s.authorizedEmails : [];
              if (currentList.some(em => em.toLowerCase() === cleanEmail)) {
                updatedEmailsForSlot = currentList;
                targetSlotSnapshot = { ...s, parentRequestId: r.id, jobTitle: s.jobTitle || r.jobTitle, department: r.department };
                return s;
              }
              updatedEmailsForSlot = [...currentList, cleanEmail];
              const updatedSlot = { ...s, authorizedEmails: updatedEmailsForSlot, stageUpdatedAt: nowTimestamp };
              targetSlotSnapshot = { ...updatedSlot, parentRequestId: r.id, jobTitle: s.jobTitle || r.jobTitle, department: r.department };
              return updatedSlot;
            }
            return s;
          });
          return { ...r, slots };
        });

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        setSelectedDetailSlot(prev => (prev && prev.slotId === slotId) ? { ...prev, authorizedEmails: updatedEmailsForSlot } : prev);
        setNewAuthorizedEmailInput("");

        broadcastCentralSync(updatedRequests, candidatePool);
        sendCentralSlotStageUpdate(slotId, {
          stage: targetSlotSnapshot?.stage || "received",
          slotStatus: targetSlotSnapshot?.slotStatus || "PENDING_ADMIN",
          workflowStatus: targetSlotSnapshot?.workflowStatus || "PENDING_ADMIN",
          parentRequestId: targetSlotSnapshot?.parentRequestId || String(slotId).replace(/-\d+$/, ""),
          jobTitle: targetSlotSnapshot?.jobTitle || "",
          department: targetSlotSnapshot?.department || "",
          candidateName: targetSlotSnapshot?.candidateName || "",
          authorizedEmails: updatedEmailsForSlot
        }, updatedRequests);
        triggerToast(`🔓 เพิ่มสิทธิ์เข้าดูข้อมูลตำแหน่ง #${slotId} ให้ ${cleanEmail} เรียบร้อยแล้ว`);
      };

      const handleRemoveAuthorizedEmailFromSlot = (slotId, emailToRemove) => {
        const cleanTarget = String(emailToRemove || "").trim().toLowerCase();
        const nowTimestamp = Date.now();
        let updatedEmailsForSlot = [];
        let targetSlotSnapshot = null;

        const updatedRequests = requests.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              const currentList = Array.isArray(s.authorizedEmails) ? s.authorizedEmails : [];
              updatedEmailsForSlot = currentList.filter(em => em.toLowerCase() !== cleanTarget);
              const updatedSlot = { ...s, authorizedEmails: updatedEmailsForSlot, stageUpdatedAt: nowTimestamp };
              targetSlotSnapshot = { ...updatedSlot, parentRequestId: r.id, jobTitle: s.jobTitle || r.jobTitle, department: r.department };
              return updatedSlot;
            }
            return s;
          });
          return { ...r, slots };
        });

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        setSelectedDetailSlot(prev => (prev && prev.slotId === slotId) ? { ...prev, authorizedEmails: updatedEmailsForSlot } : prev);

        broadcastCentralSync(updatedRequests, candidatePool);
        sendCentralSlotStageUpdate(slotId, {
          stage: targetSlotSnapshot?.stage || "received",
          slotStatus: targetSlotSnapshot?.slotStatus || "PENDING_ADMIN",
          workflowStatus: targetSlotSnapshot?.workflowStatus || "PENDING_ADMIN",
          parentRequestId: targetSlotSnapshot?.parentRequestId || String(slotId).replace(/-\d+$/, ""),
          jobTitle: targetSlotSnapshot?.jobTitle || "",
          department: targetSlotSnapshot?.department || "",
          candidateName: targetSlotSnapshot?.candidateName || "",
          authorizedEmails: updatedEmailsForSlot
        }, updatedRequests);
        triggerToast(`🔒 ถอดสิทธิ์ของ ${cleanTarget} ออกจากตำแหน่ง #${slotId} เรียบร้อย`);
      };

      // Admin Review: Transition immediately to READY_FOR_RECRUITMENT and move to manpower stage (No email)
      const handleAdminApproveAndMoveToManpower = async (reqOrSlot) => {
        const parentReqId = reqOrSlot.parentRequestId || reqOrSlot.id;
        const targetReq = requests.find(r => r.id === parentReqId) || reqOrSlot;

        try {
          setIsApprovingEmailSending(true);
          triggerToast(`⏳ กำลังอนุมัติคำขอ ${parentReqId} และเริ่มกระบวนการสรรหา...`);

          const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
          const nowTs = Date.now();

          // Update state of requests to READY_FOR_RECRUITMENT and stage to manpower
          const updatedRequests = requests.map(r => {
            if (r.id === parentReqId) {
              const headcount = Math.max(1, Number(r.headcountRequired) || 1);
              const baseSlots = (r.slots && r.slots.length > 0)
                ? r.slots
                : Array.from({ length: headcount }, (_, i) => ({
                    slotId: `${r.id}-${i + 1}`,
                    slotIndex: i + 1,
                    jobTitle: r.jobTitle,
                    candidateName: "",
                    candidatePhone: "",
                    candidateNickname: "",
                    resumeUrl: "",
                    authorizedEmails: [],
                    evaluations: []
                  }));

              const updatedSlots = baseSlots.map(s => ({
                ...s,
                jobTitle: s.jobTitle || r.jobTitle,
                slotStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower",
                stageUpdatedAt: nowTs
              }));

              return {
                ...r,
                requestStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower",
                slots: updatedSlots,
                lastUpdated: nowStr
              };
            }
            return r;
          });

          setRequests(updatedRequests);
          localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
          localStorage.setItem(SHARED_CENTRAL_REQS_KEY, JSON.stringify(updatedRequests));

          // 🌟 ส่งสัญญาณกระจายไปยังทุกหน้าต่างทันที (0ms)
          broadcastCentralSync(updatedRequests, candidatePool);

          // 🔄 ส่งอัปเดตสถานะและข้อมูลตำแหน่งเดิมของทุก Slot ในคำขอนี้ไปยังศูนย์กลาง Apps Script
          const updatedReqObj = updatedRequests.find(r => r.id === parentReqId) || targetReq;
          const slotsToSync = Array.isArray(updatedReqObj.slots) && updatedReqObj.slots.length > 0
            ? updatedReqObj.slots
            : Array.from({ length: Math.max(1, Number(updatedReqObj.headcountRequired) || 1) }, (_, idx) => ({
                slotId: `${parentReqId}-${idx + 1}`,
                jobTitle: updatedReqObj.jobTitle,
                authorizedEmails: []
              }));

          slotsToSync.forEach(sl => {
            sendCentralSlotStageUpdate(sl.slotId, {
              stage: "manpower",
              slotStatus: "READY_FOR_RECRUITMENT",
              workflowStatus: "READY_FOR_RECRUITMENT",
              parentRequestId: parentReqId,
              jobTitle: sl.jobTitle || updatedReqObj.jobTitle,
              department: updatedReqObj.department,
              requesterName: updatedReqObj.requesterName,
              authorizedEmails: normalizeAuthorizedEmails(sl.authorizedEmails),
              requisitionData: updatedReqObj
            }, updatedRequests);
          });

          // Background sync to Google Sheet
          if (googleScriptUrl) {
            fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "confirmITReady",
                reqId: parentReqId
              })
            }).catch(() => {});
          }

          setShowAdminReviewModal(false);
          setSelectedAdminReviewSlot(null);
          if (selectedRequisitionDetail && selectedRequisitionDetail.id === parentReqId) {
            setSelectedRequisitionDetail(prev => {
              if (!prev) return null;
              const headcount = Math.max(1, Number(prev.headcountRequired) || 1);
              const baseSlots = (prev.slots && prev.slots.length > 0)
                ? prev.slots
                : Array.from({ length: headcount }, (_, i) => ({
                    slotId: `${prev.id}-${i + 1}`,
                    slotIndex: i + 1,
                    candidateName: "",
                    candidatePhone: "",
                    candidateNickname: "",
                    resumeUrl: "",
                    evaluations: []
                  }));

              const updatedSlots = baseSlots.map(s => ({
                ...s,
                slotStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower"
              }));

              return {
                ...prev,
                requestStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower",
                slots: updatedSlots
              };
            });
          }
          triggerToast(`ยืนยันอนุมัติคำขอ ${parentReqId} เรียบร้อยแล้ว ปรับสถานะเป็น Ready to Recruit และย้ายเข้าสู่ 1. Manpower Request`);
        } catch (err) {
          triggerToast("บันทึกสถานะเป็น Ready to Recruit เรียบร้อยแล้ว");
        } finally {
          setIsApprovingEmailSending(false);
        }
      };

      // Admin Action: Reject Requisition with Reason
      const handleAdminRejectRequisition = (reqId) => {
        if (!rejectionNoteInput.trim()) {
          triggerToast("⚠️ กรุณาระบุเหตุผลการตีกลับหรือปฏิเสธคำขอ");
          return;
        }

        const reason = rejectionNoteInput.trim();
        const nowTs = Date.now();
        const targetReq = requests.find(r => r.id === reqId);

        const updatedRequests = requests.map(r => {
          if (r.id === reqId) {
            const updatedSlots = (r.slots || []).map(s => ({
              ...s,
              slotStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              stageUpdatedAt: nowTs,
              rejectionReason: reason
            }));
            return {
              ...r,
              requestStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              rejectionReason: reason,
              slots: updatedSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        });

        setRequests(updatedRequests);
        localStorage.setItem(PROD_REQUESTS_KEY, JSON.stringify(updatedRequests));
        broadcastCentralSync(updatedRequests, candidatePool);

        if (targetReq && Array.isArray(targetReq.slots)) {
          targetReq.slots.forEach(s => {
            sendCentralSlotStageUpdate(s.slotId, {
              stage: "cancelled",
              slotStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              parentRequestId: reqId,
              rejectionReason: reason
            }, updatedRequests);
          });
        }

        if (selectedRequisitionDetail && selectedRequisitionDetail.id === reqId) {
          setSelectedRequisitionDetail(prev => ({
            ...prev,
            requestStatus: "REJECTED_BY_ADMIN",
            workflowStatus: "REJECTED_BY_ADMIN",
            rejectionReason: reason
          }));
        }

        setShowRejectModal(false);
        setRejectionNoteInput("");
        triggerToast(`❌ ตีกลับคำขอ ${reqId} เรียบร้อยแล้ว`);
      };

      const handleCopyShareLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const textArea = document.createElement("textarea");
        textArea.value = baseUrl;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        triggerToast("คัดลอกลิงก์สำเร็จ! 🔗");
      };

      const exportToCSV = () => {
        const headers = [
          "Slot ID", "Request ID", "Date", "Slot Status", "Job Title", "Position Type", "Replaced Name",
          "Department", "Stage", "Working Days Elapsed", "Total Recruitment Days", "Candidate", "Interview Schedule",
          "Evaluations Count", "Combined Score (1-5)", "Score %", "Result", "Hire Date", "Arrival Status", "Rejection Reason",
          "Google Drive Link", "Laptop / PC", "Sim Card / โทรศัพท์", "Email องค์กร", "ERP Netsuite"
        ];
        const rows = allPositionSlots.map(s => {
          const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
          const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
          const parentReq = requests.find(r => r.id === (s.parentRequestId || s.id)) || {};
          return [
            s.slotId,
            s.parentRequestId || s.id,
            s.requestDate,
            s.slotStatus || "READY_FOR_RECRUITMENT",
            s.jobTitle,
            s.positionType,
            s.replacedEmployeeName || "-",
            s.department,
            s.stage,
            sla.workingDaysElapsed,
            duration.totalDays,
            s.candidateName || "-",
            s.interviewSchedule || "-",
            s.evaluationsCount || 0,
            s.interviewScore || 0,
            s.interviewScorePercent || 0,
            s.interviewResult || "-",
            s.hireDate || "-",
            s.onboardingArrivalStatus || "-",
            s.rejectionReason || "-",
            s.resumeUrl || "-",
            s.itLaptop || parentReq.itLaptop || "ต้องการ",
            s.itSimCard || parentReq.itSimCard || "ไม่ต้องการ",
            s.itEmail || parentReq.itEmail || "ต้องการ",
            s.itNetsuite || parentReq.itNetsuite || "ไม่ต้องการ"
          ].map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",");
        });

        const csvContent = "\uFEFF" + [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `HR_Recruitment_Export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        triggerToast("ดาวน์โหลดไฟล์ CSV สำเร็จ!");
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50/80 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors">
          {/* Header - Modern Soft Tone & Bilingual (Balanced Single-Line Layout) */}
          <header className="sticky top-0 z-30 border-b border-slate-200/70 dark:border-slate-800/80 bg-white/85 dark:bg-slate-900/85 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between gap-3 h-16 sm:h-18">
                
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-sky-500/20 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div className="min-w-0">
                    <h1 className="text-sm sm:text-base lg:text-lg font-extrabold text-slate-900 dark:text-white tracking-tight truncate">
                      HR Recruitment Dashboard
                    </h1>
                  </div>
                </div>

                <div className="flex items-center gap-2 shrink-0">
                  {/* Fixed Role Badge (Determined automatically upon Google Login - No manual switching) */}
                  {currentUser && (
                    <span
                      className={`hidden sm:inline-flex items-center px-2.5 py-1 rounded-xl text-[11px] font-bold whitespace-nowrap border ${
                        isAdminAuthenticated
                          ? "bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border-amber-300 dark:border-amber-700"
                          : "bg-sky-50 dark:bg-sky-950/60 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800"
                      }`}
                    >
                      {isAdminAuthenticated ? "Admin View" : "User View"}
                    </span>
                  )}

                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="h-9 w-9 flex items-center justify-center rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800 transition shrink-0"
                    title={darkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {/* User Profile & Role Info */}
                  {currentUser ? (
                    <div className="flex items-center gap-2 shrink-0">
                      <div className="h-9 flex items-center gap-2 px-3 rounded-xl bg-slate-100/90 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700">
                        {currentUser.picture ? (
                          <img src={currentUser.picture} alt="" className="w-5 h-5 rounded-full object-cover shrink-0" />
                        ) : (
                          <div className="w-5 h-5 rounded-full bg-brand-600 text-white font-bold text-[10px] flex items-center justify-center shrink-0">
                            {(activeUserEmail || "U")[0].toUpperCase()}
                          </div>
                        )}
                        <span className="hidden lg:block font-semibold text-xs text-slate-800 dark:text-slate-100 truncate max-w-[190px]" title={activeUserEmail}>
                          {activeUserEmail}
                        </span>
                      </div>

                      <button
                        onClick={handleUserLogout}
                        className="h-9 w-9 flex items-center justify-center rounded-xl text-rose-600 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 border border-rose-200/70 dark:border-rose-900 transition shrink-0"
                        title="ออกจากระบบ (Logout)"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                      </button>
                    </div>
                  ) : null}

                  {/* ปุ่ม + New Requisition สำหรับทุกคนที่เข้าสู่ระบบ (ทั้ง User และ Admin สามารถยื่นคำขอกำลังคนได้) */}
                  {currentUser && (
                    <button
                      onClick={() => {
                        setFormValidationError("");
                        syncPersonnelFromGoogleSheet(false);
                        // ดึงข้อมูลผู้ยื่นคำขออัตโนมัติจากบัญชีที่เข้าสู่ระบบ (อ้างอิงจาก Google Sheet gid=62738333)
                        if (activeUserEmail) {
                          const matchedPersonnel = personnelList.find(
                            p => (p.email && p.email.toLowerCase() === activeUserEmail.toLowerCase()) ||
                                 (p.nameEn && p.nameEn.toLowerCase() === (currentUser.name || "").toLowerCase()) ||
                                 (p.name && p.name.toLowerCase() === (currentUser.name || "").toLowerCase())
                          );
                          if (matchedPersonnel) {
                            const displayName = (matchedPersonnel.nameEn && matchedPersonnel.nameEn !== matchedPersonnel.name)
                              ? matchedPersonnel.nameEn
                              : (matchedPersonnel.name || currentUser.name || "");
                            setFormInput(prev => ({
                              ...prev,
                              requesterName: displayName,
                              requesterPosition: (matchedPersonnel.position && matchedPersonnel.position !== "-") ? matchedPersonnel.position : prev.requesterPosition,
                              requesterEmail: matchedPersonnel.email || activeUserEmail,
                              department: (matchedPersonnel.department && matchedPersonnel.department !== "-") ? matchedPersonnel.department : prev.department,
                              division: (matchedPersonnel.division && matchedPersonnel.division !== "-") ? matchedPersonnel.division : ""
                            }));
                          } else {
                            setFormInput(prev => ({
                              ...prev,
                              requesterName: currentUser.name || prev.requesterName,
                              requesterEmail: activeUserEmail,
                              division: ""
                            }));
                          }
                        }
                        setShowRequestModal(true);
                      }}
                      className="h-9 inline-flex items-center gap-1.5 px-3.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-sm shadow-brand-500/20 transition active:scale-95 cursor-pointer whitespace-nowrap shrink-0"
                    >
                      <Icon name="plus" className="w-3.5 h-3.5 text-white shrink-0" />
                      <span>New Requisition</span>
                    </button>
                  )}

                  <button
                    onClick={handleCopyShareLink}
                    className="h-9 w-9 flex items-center justify-center rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800 transition shrink-0"
                    title="คัดลอกลิงก์แชร์ (Copy Shareable Link)"
                  >
                    <Icon name="link" className="w-4 h-4" />
                  </button>
                </div>

              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* 🔒 Authentication Gate: หน้าเข้าสู่ระบบแบบเรียบง่ายเฉพาะ Sign in with Google */}
            {!currentUser ? (
              <div className="min-h-[calc(100vh-8rem)] flex items-center justify-center px-4 py-12">
                <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-8 text-center">
                  {/* Lock Icon */}
                  <div className="w-14 h-14 mx-auto mb-5 rounded-2xl bg-sky-50 dark:bg-sky-950/60 border border-sky-200/80 dark:border-sky-800 flex items-center justify-center text-sky-600 dark:text-sky-400">
                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                  </div>

                  {/* Title & Subtitle */}
                  <h2 className="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                    Sign in with Google
                  </h2>
                  <p className="mt-2 text-xs text-slate-500 dark:text-slate-400 leading-relaxed max-w-[280px] mx-auto">
                    ลงชื่อเข้าใช้ด้วยบัญชี <span className="font-semibold text-slate-600 dark:text-slate-300">@valuesourcing.co</span> หรือ Google Account เพื่อเข้าสู่ระบบสรรหาและติดตามอัตรากำลังพล
                  </p>

                  {/* Google Sign-In Button Only */}
                  <div className="mt-6 flex justify-center">
                    <div id="gateGoogleSignInBtn" className="flex justify-center min-h-[42px] items-center">
                      <button
                        type="button"
                        onClick={() => {
                          initGoogleSignIn("gateGoogleSignInBtn", googleClientId);
                          if (window.google && window.google.accounts && window.google.accounts.id) {
                            window.google.accounts.id.prompt();
                          } else {
                            setLoginError("กำลังโหลดบริการ Google Sign-In กรุณารอสักครู่แล้วกดอีกครั้ง");
                          }
                        }}
                        className="inline-flex items-center justify-center gap-3 px-6 py-2.5 rounded-full bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium border border-slate-300 shadow-2xs transition cursor-pointer"
                      >
                        <svg className="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z" />
                          <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z" />
                          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z" />
                        </svg>
                        <span>Sign in with Google</span>
                      </button>
                    </div>
                  </div>

                  {loginError && (
                    <div className="mt-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-semibold leading-relaxed text-center">
                      {loginError}
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <>
                {/* KPI Cards - Soft Tone & Bilingual (Balanced Uniform Grid) */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider truncate">Total Positions (อัตราทั้งหมด)</p>
                  <p className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white mt-1">{allPositionSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center shrink-0">
                  <Icon name="users" className="w-5 h-5 text-brand-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider truncate">In Progress (กำลังดำเนินการ)</p>
                  <p className="text-xl sm:text-2xl font-extrabold text-amber-600 dark:text-amber-400 mt-1">{inProcessSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center shrink-0">
                  <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider truncate">Closed Positions (ปิดการสรรหาแล้ว)</p>
                  <p className="text-xl sm:text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">{closedSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center shrink-0">
                  <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-xs flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <p className="text-[11px] text-slate-400 font-bold uppercase tracking-wider truncate">Candidate Pool (คลังผู้สมัคร)</p>
                  <p className="text-xl sm:text-2xl font-extrabold text-sky-600 dark:text-sky-400 mt-1">{candidatePool.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-950 text-sky-600 flex items-center justify-center shrink-0">
                  <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                </div>
              </div>
            </div>

            <div className="space-y-6">
              {/* Navigation Tabs - Clean English (Thai) without Emojis */}
              <div className="flex items-center justify-between gap-3 border-b border-slate-200/80 dark:border-slate-800 pb-3.5 overflow-x-auto">
                <div className="flex items-center gap-2 shrink-0">
                  {/* หน้า 1: Requisition Queue (แอดมินเท่านั้น) */}
                  {isAdminAuthenticated && (
                    <button
                      onClick={() => setAdminSubTab("requisitions")}
                      className={`h-9 px-3.5 rounded-xl text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap ${
                        adminSubTab === "requisitions"
                          ? "bg-brand-600 text-white shadow-sm shadow-brand-500/20"
                          : "bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 hover:bg-slate-100"
                      }`}
                    >
                      <span>1. Requisition Queue (คิวตรวจสอบคำขอ)</span>
                      {pendingAdminCount > 0 && (
                        <span className="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-500 text-white leading-none">
                          {pendingAdminCount}
                        </span>
                      )}
                    </button>
                  )}

                  {/* หน้า 2: Kanban Pipeline & Demand (ทุกคนเข้าถึงได้) */}
                  <button
                    onClick={() => setAdminSubTab("kanban")}
                    className={`h-9 px-3.5 rounded-xl text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap ${
                      adminSubTab === "kanban"
                        ? "bg-brand-600 text-white shadow-sm shadow-brand-500/20"
                        : "bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    <span>2. Kanban Pipeline (กระดานสรรหา)</span>
                  </button>

                  {/* หน้า 3: Candidate Pool & Requisitions (แอดมินเท่านั้น) */}
                  {isAdminAuthenticated && (
                    <button
                      onClick={() => setAdminSubTab("candidates")}
                      className={`h-9 px-3.5 rounded-xl text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap ${
                        adminSubTab === "candidates"
                          ? "bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-sm"
                          : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 hover:bg-slate-100"
                      }`}
                    >
                      <span>3. Candidate Pool &amp; Manpower (คลังผู้สมัครและกำลังคน)</span>
                    </button>
                  )}
                </div>

                {!isAdminAuthenticated && (
                  <div className="h-9 inline-flex items-center gap-1.5 text-[11px] text-sky-800 dark:text-sky-200 bg-sky-50/90 dark:bg-sky-950/50 border border-sky-200/80 dark:border-sky-800 px-3 rounded-xl font-medium whitespace-nowrap shrink-0">
                    <span>User View · Access granted by assigned position (ดูข้อมูลและประเมินได้เฉพาะตำแหน่งที่ได้รับสิทธิ์)</span>
                  </div>
                )}
              </div>

              {/* SUB-TAB 1: REQUISITION QUEUE (แอดมินเท่านั้นที่เห็นได้) */}
              {isAdminAuthenticated && adminSubTab === "requisitions" && (
                <div className="space-y-6">
                    {/* KPI Quick Status Cards - Modern Enterprise Style */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                      <div 
                        onClick={() => setReqQueueFilter("PENDING_ADMIN")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "PENDING_ADMIN"
                            ? "bg-amber-50/80 dark:bg-amber-950/30 border-amber-300 ring-2 ring-amber-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300 shadow-card"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-slate-600 dark:text-slate-300">Pending Review (รอตรวจสอบ)</span>
                          <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_ADMIN").length}
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "READY_FOR_RECRUITMENT"
                            ? "bg-emerald-50/80 dark:bg-emerald-950/30 border-emerald-300 ring-2 ring-emerald-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300 shadow-card"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-slate-600 dark:text-slate-300">Ready to Recruit (พร้อมสรรหา)</span>
                          <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length}
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("REJECTED_BY_ADMIN")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "REJECTED_BY_ADMIN"
                            ? "bg-rose-50/80 dark:bg-rose-950/30 border-rose-300 ring-2 ring-rose-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300 shadow-card"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-slate-600 dark:text-slate-300">Rejected (ปฏิเสธ / ส่งกลับ)</span>
                          <span className="w-2 h-2 rounded-full bg-rose-400"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "REJECTED_BY_ADMIN").length}
                        </div>
                      </div>
                    </div>

                    {/* Filter Bar & Search (Single-Line Uniform Height) */}
                    <div className="bg-white dark:bg-[#0F172A] rounded-2xl border border-slate-200/70 dark:border-slate-800 p-3.5 shadow-card flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                      <div className="flex items-center gap-1.5 text-xs overflow-x-auto shrink-0">
                        <button
                          onClick={() => setReqQueueFilter("ALL")}
                          className={`h-8 px-3 rounded-xl font-semibold transition whitespace-nowrap ${
                            reqQueueFilter === "ALL"
                              ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/80"
                          }`}
                        >
                          All ({requests.length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("PENDING_ADMIN")}
                          className={`h-8 px-3 rounded-xl font-semibold transition border whitespace-nowrap ${
                            reqQueueFilter === "PENDING_ADMIN"
                              ? "bg-amber-50 text-amber-900 border-amber-300 dark:bg-amber-950/50 dark:text-amber-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700 hover:bg-slate-50"
                          }`}
                        >
                          Pending Review ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_ADMIN").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}
                          className={`h-8 px-3 rounded-xl font-semibold transition border whitespace-nowrap ${
                            reqQueueFilter === "READY_FOR_RECRUITMENT"
                              ? "bg-emerald-50 text-emerald-900 border-emerald-300 dark:bg-emerald-950/50 dark:text-emerald-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700 hover:bg-slate-50"
                          }`}
                        >
                          Ready to Recruit ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("REJECTED_BY_ADMIN")}
                          className={`h-8 px-3 rounded-xl font-semibold transition border whitespace-nowrap ${
                            reqQueueFilter === "REJECTED_BY_ADMIN"
                              ? "bg-rose-50 text-rose-900 border-rose-300 dark:bg-rose-950/50 dark:text-rose-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700 hover:bg-slate-50"
                          }`}
                        >
                          Rejected ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "REJECTED_BY_ADMIN").length})
                        </button>
                      </div>

                      <div className="relative w-full lg:flex-1 lg:min-w-[180px]">
                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                          <Icon name="search" className="w-3.5 h-3.5" />
                        </div>
                        <input
                          type="text"
                          placeholder="Search requisition (ค้นหาคำขอกำลังคน)..."
                          value={reqQueueSearch}
                          onChange={(e) => setReqQueueSearch(e.target.value)}
                          className="h-8 w-full pl-8 pr-3 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
                        />
                      </div>
                    </div>

                    {/* Data Table with Clean Modern Enterprise Styling */}
                    <div className="bg-white dark:bg-[#0F172A] rounded-2xl border border-slate-200/70 dark:border-slate-800 shadow-card overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50/80 dark:bg-slate-800/40 text-[11px] font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 dark:border-slate-800">
                            <tr>
                              <th className="px-4 py-3">วันที่ขอ</th>
                              <th className="px-4 py-3">รหัส</th>
                              <th className="px-4 py-3">ผู้ยื่นคำขอ</th>
                              <th className="px-4 py-3">ตำแหน่งที่ขอ</th>
                              <th className="px-4 py-3">ฝ่ายงาน</th>
                              <th className="px-4 py-3 text-center">อัตรา</th>
                              <th className="px-4 py-3">สถานะ</th>
                              <th className="px-4 py-3 text-center">จัดการ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                            {sortedAdminRequisitions.length === 0 ? (
                              <tr>
                                <td colSpan="8" className="text-center py-10 text-slate-400 italic">
                                  ไม่พบรายการคำขอกำลังคนตามเงื่อนไขที่เลือก
                                </td>
                              </tr>
                            ) : (
                              sortedAdminRequisitions.map((req) => {
                                const currentStatus = req.requestStatus || req.workflowStatus || "PENDING_ADMIN";
                                const isPendingAdmin = currentStatus === "PENDING_ADMIN";
                                const statusCfg = REQUISITION_STATUSES.find(s => s.id === currentStatus) || REQUISITION_STATUSES[0];

                                return (
                                  <tr 
                                    key={req.id}
                                    onClick={() => setSelectedRequisitionDetail(req)}
                                    className={`cursor-pointer transition-colors ${
                                      isPendingAdmin
                                        ? "bg-amber-50/40 hover:bg-amber-50/70 dark:bg-amber-950/10 dark:hover:bg-amber-950/30"
                                        : "hover:bg-slate-50/60 dark:hover:bg-slate-800/30"
                                    }`}
                                  >
                                    <td className="px-4 py-3 text-slate-500 font-normal">{formatCleanDateTime(req.requestDate)}</td>
                                    <td className="px-4 py-3 font-mono font-medium text-sky-600 dark:text-sky-400">{req.id}</td>
                                    <td className="px-4 py-3 font-medium text-slate-900 dark:text-white">
                                      <div>{req.requesterName}</div>
                                      <div className="text-[10px] text-slate-400 font-normal">{req.requesterPosition || "-"}</div>
                                    </td>
                                    <td className="px-4 py-3 font-semibold text-slate-900 dark:text-white">
                                      <div>{req.jobTitle}</div>
                                      <div className="text-[10px] text-slate-400 font-normal">
                                        {req.positionType}
                                        {req.positionType === "Replacement" && req.replacedEmployeeName && (
                                          <span className="text-amber-600 ml-1">(แทน: {req.replacedEmployeeName})</span>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-4 py-3 text-slate-600 dark:text-slate-300 font-normal">{req.department}</td>
                                    <td className="px-4 py-3 text-center font-medium">{req.headcountRequired || 1}</td>
                                    <td className="px-4 py-3">
                                      <span className={`inline-flex items-center px-2 py-0.5 rounded-lg text-[11px] font-medium border ${statusCfg.badge}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>
                                    <td className="px-4 py-3 text-center" onClick={(e) => e.stopPropagation()}>
                                      {isPendingAdmin ? (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="px-2.5 py-1 rounded-lg text-xs font-semibold text-amber-800 bg-amber-50 hover:bg-amber-100 border border-amber-200 transition"
                                        >
                                          Review (ตรวจสอบ)
                                        </button>
                                      ) : (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                                          title="View Details (ดูรายละเอียด)"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
              )}

              {/* SUB-TAB 2: KANBAN PIPELINE & DEMAND (ทุกคนเห็นได้ & User ร่วมประเมินได้ที่นี่) */}
              {adminSubTab === "kanban" && (
                <div className="space-y-6">
                    {/* Interactive Kanban Pipeline */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-5 sm:p-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-200/80 dark:border-slate-800 mb-5">
                        <div className="flex items-center gap-2.5 shrink-0">
                          <h2 className="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2 whitespace-nowrap">
                            <span>Kanban Pipeline (กระดานสรรหา)</span>
                          </h2>
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-300 border border-emerald-200/80 dark:border-emerald-800 inline-flex items-center gap-1 whitespace-nowrap shrink-0">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>LIVE</span>
                          </span>
                        </div>

                        <div className="flex items-center gap-2 w-full sm:flex-1">
                          {isAdminAuthenticated && (
                            <div className="inline-flex items-center rounded-xl border border-slate-200/90 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-0.5 shrink-0">
                              <button
                                type="button"
                                onClick={() => syncWorkflowStatus(false)}
                                disabled={isSyncing}
                                className="h-8 px-2.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold inline-flex items-center gap-1 transition cursor-pointer whitespace-nowrap"
                                title={`Sync Now (${lastSyncedTime})`}
                              >
                                <span className={`text-sm leading-none ${isSyncing ? "animate-spin inline-block" : ""}`}>🔄</span>
                                <span className="hidden md:inline text-[11px] font-mono text-slate-600 dark:text-slate-300">{lastSyncedTime}</span>
                              </button>

                              <div className="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

                              <button
                                type="button"
                                onClick={() => setShowDashboardSummaryModal(true)}
                                className="h-8 w-8 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 inline-flex items-center justify-center transition cursor-pointer"
                                title="Summary (สรุปผล)"
                              >
                                <span className="text-sm leading-none">📊</span>
                              </button>

                              <div className="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

                              <button
                                type="button"
                                onClick={handleOpenGlobalClearCardsModal}
                                className="h-8 w-8 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 inline-flex items-center justify-center transition cursor-pointer"
                                title="Clear Cards (ล้างการ์ดบนกระดาน)"
                              >
                                <span className="text-sm leading-none">🧹</span>
                              </button>

                              <div className="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

                              <button
                                type="button"
                                onClick={() => {
                                  setScriptUrlInput(googleScriptUrl);
                                  setShowSheetsModal(true);
                                }}
                                className="h-8 w-8 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 inline-flex items-center justify-center transition cursor-pointer"
                                title="Settings (ตั้งค่า)"
                              >
                                <span className="text-sm leading-none">⚙️</span>
                              </button>

                              {allPositionSlots.some(s => s.isArchivedFromKanban) && (
                                <>
                                  <div className="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>
                                  <button
                                    type="button"
                                    onClick={handleRestoreAllArchivedCards}
                                    className="h-8 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-brand-600 dark:text-brand-400 text-xs font-bold inline-flex items-center gap-1 transition cursor-pointer whitespace-nowrap"
                                    title="Restore Hidden Cards (กู้คืนการ์ดที่ซ่อนไว้)"
                                  >
                                    <span className="text-sm leading-none">♻️</span>
                                    <span className="text-[10.5px]">{allPositionSlots.filter(s => s.isArchivedFromKanban).length}</span>
                                  </button>
                                </>
                              )}
                            </div>
                          )}

                          <div className="relative flex-1 min-w-[160px]">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                              <Icon name="search" className="w-3.5 h-3.5" />
                            </div>
                            <input
                              type="text"
                              placeholder="Search position / department / candidate (ค้นหาตำแหน่ง / ฝ่ายงาน / ผู้สมัคร)..."
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              className="h-9 w-full pl-8 pr-3 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200/90 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                        {STAGES.map(stage => {
                          const stageItems = allPositionSlots.filter(s => {
                            const matches = !searchQuery.trim() ||
                              s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (canUserViewSlotDetails(s) && s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase()));
                            return s.stage === stage.id && !s.isArchivedFromKanban && matches;
                          });

                          return (
                            <div
                              key={stage.id}
                              onDragOver={(e) => isAdminAuthenticated && handleDragOver(e, stage.id)}
                              onDragLeave={(e) => isAdminAuthenticated && handleDragLeave(e, stage.id)}
                              onDrop={(e) => isAdminAuthenticated && handleDrop(e, stage.id)}
                              className={`w-80 shrink-0 snap-start flex flex-col rounded-2xl p-3 border-2 transition-all duration-150 ${
                                dragOverStage === stage.id
                                  ? 'border-brand-500 bg-brand-50/70 dark:bg-brand-950/50 ring-2 ring-brand-500/20'
                                  : draggedSlotId
                                  ? 'border-dashed border-slate-300 dark:border-slate-700 bg-slate-50/60 dark:bg-slate-800/30'
                                  : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40'
                              }`}
                            >
                              <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700 gap-1.5">
                                <div className="flex items-center gap-1.5 min-w-0">
                                  <span className="text-xs font-bold text-slate-700 dark:text-slate-300 truncate">{stage.label}</span>
                                  <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 shadow-2xs shrink-0">
                                    {stageItems.length}
                                  </span>
                                </div>

                                {isAdminAuthenticated && (stage.id === "onboarded" || stage.id === "cancelled") && stageItems.length > 0 && (
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      handleOpenStageClearModal(stage.id, stage.label);
                                    }}
                                    className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition shrink-0"
                                    title={`Hide Cards in ${stage.label} (ซ่อนการ์ด)`}
                                  >
                                    <span>Hide</span>
                                  </button>
                                )}
                              </div>

                              <div className="space-y-2.5 flex-1 overflow-y-auto max-h-[560px] pr-0.5">
                                {stageItems.map(item => {
                                  const isBeingDragged = draggedSlotId === item.slotId;
                                  const priorityInfo = getPositionPriorityInfo(item);
                                  const isArrived = item.stage === "onboarded" && (item.hasAttendedFirstDayTraining || item.onboardingArrivalStatus === "arrived_reported");
                                  const userHasAccess = canUserViewSlotDetails(item);
                                  const authCount = Array.isArray(item.authorizedEmails) ? item.authorizedEmails.length : 0;
                                  const isPendingVerification =
                                    item.stage === "received" &&
                                    (item.slotStatus === "PENDING_ADMIN" || item.workflowStatus === "PENDING_ADMIN");

                                  return (
                                    <div
                                      key={item.slotId}
                                      draggable={isAdminAuthenticated && !isPendingVerification}
                                      onDragStart={(e) => {
                                        if (!isAdminAuthenticated) return;
                                        if (isPendingVerification) {
                                          e.preventDefault();
                                          triggerToast("⚠️ กรุณาตรวจสอบและอนุมัติคำขอในหน้า Requisition Queue ก่อนย้ายสเตจ");
                                          return;
                                        }
                                        handleDragStart(e, item.slotId);
                                      }}
                                      onDragEnd={() => { setDraggedSlotId(null); setDragOverStage(null); }}
                                      onClick={() => {
                                        if (userHasAccess) {
                                          setSelectedDetailSlot(item);
                                        } else {
                                          triggerToast("🔒 ท่านไม่มีสิทธิ์เข้าถึงข้อมูลผู้สมัครในตำแหน่งนี้ (กรุณาติดต่อผู้ดูแลระบบเพื่อขอสิทธิ์)");
                                        }
                                      }}
                                      className={`p-3.5 rounded-2xl border transition-all duration-150 select-none group overflow-hidden ${
                                        userHasAccess ? 'cursor-pointer hover:shadow-sm' : 'cursor-not-allowed opacity-95'
                                      } ${
                                        isBeingDragged
                                          ? 'opacity-40 scale-98 border-sky-400 bg-sky-50/50'
                                          : item.stage === 'cancelled'
                                          ? 'border-slate-200 dark:border-slate-800 bg-rose-50/20 dark:bg-rose-950/10'
                                          : isArrived
                                          ? 'border-emerald-200 dark:border-emerald-800/60 bg-emerald-50/30 dark:bg-emerald-950/20'
                                          : 'border-slate-200/70 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-slate-300 dark:hover:border-slate-700'
                                      }`}
                                      title={
                                        isAdminAuthenticated
                                          ? isPendingVerification
                                            ? "รอผู้ดูแลระบบตรวจสอบและอนุมัติคำขอก่อนจึงจะย้ายสเตจได้"
                                            : "คลิกการ์ดเพื่อดูรายละเอียดและจัดการสิทธิ์ (ลากย้ายสเตจได้)"
                                          : userHasAccess
                                          ? "คลิกการ์ดเพื่อดูข้อมูลผู้สมัครและบันทึกผลประเมินสัมภาษณ์"
                                          : "🔒 เฉพาะผู้ที่ได้รับสิทธิ์เท่านั้นจึงจะสามารถเข้าดูข้อมูลได้"
                                      }
                                    >
                                      {/* Top Row: Clean Slot ID & Subtle Priority Indicator */}
                                      <div className="flex items-center justify-between text-[11px] mb-1.5 gap-1">
                                        <div className="flex items-center gap-1.5 min-w-0">
                                          {isAdminAuthenticated && !isPendingVerification && (
                                            <span className="text-slate-300 dark:text-slate-600 font-mono text-xs cursor-grab shrink-0" title="ลากเพื่อย้ายสเตจ">⋮⋮</span>
                                          )}
                                          {isPendingVerification && (
                                            <span className="text-[11px] shrink-0" title="Pending Review (รอผู้ดูแลระบบตรวจสอบ)">🔒</span>
                                          )}
                                          <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${priorityInfo.dotBg}`}></span>
                                          <span className="font-medium text-slate-400 dark:text-slate-500 text-[10px] truncate">
                                            {priorityInfo.label.split(' ')[0]}
                                          </span>
                                        </div>
                                        <div className="flex items-center gap-1 font-mono text-[10.5px] text-slate-400 shrink-0">
                                          <span>{item.slotId}</span>
                                          {item.totalSlots > 1 && (
                                            <span className="font-extrabold text-[9.5px] px-1.5 py-0.2 rounded bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 border border-sky-300 dark:border-sky-700 shadow-2xs" title={`อัตราที่ ${item.slotIndex} จากทั้งหมด ${item.totalSlots} อัตรา`}>
                                              {item.slotIndex}/{item.totalSlots}
                                            </span>
                                          )}
                                        </div>
                                      </div>

                                      {/* Title & Department with Balanced Hierarchy */}
                                      {isAdminAuthenticated && editingCardTitleSlotId === item.slotId ? (
                                        <div onClick={(e) => e.stopPropagation()} className="my-1.5 flex items-center gap-1">
                                          <input
                                            type="text"
                                            autoFocus
                                            value={editingCardTitleValue}
                                            onChange={(e) => setEditingCardTitleValue(e.target.value)}
                                            onKeyDown={(e) => {
                                              if (e.key === 'Enter') handleUpdateSlotJobTitle(item.slotId, editingCardTitleValue);
                                              if (e.key === 'Escape') setEditingCardTitleSlotId(null);
                                            }}
                                            className="w-full px-2 py-1 text-xs font-bold rounded-lg border border-sky-500 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none"
                                          />
                                          <button
                                            type="button"
                                            onClick={() => handleUpdateSlotJobTitle(item.slotId, editingCardTitleValue)}
                                            className="px-2 py-1 rounded-lg bg-emerald-600 text-white text-[10px] font-bold hover:bg-emerald-700 shrink-0"
                                            title="บันทึก"
                                          >
                                            ✓
                                          </button>
                                          <button
                                            type="button"
                                            onClick={() => setEditingCardTitleSlotId(null)}
                                            className="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[10px] shrink-0"
                                            title="ยกเลิก"
                                          >
                                            ✕
                                          </button>
                                        </div>
                                      ) : (
                                        <div className="flex items-start justify-between gap-1 group/title">
                                          <h4 className={`text-xs font-semibold text-slate-900 dark:text-white line-clamp-2 leading-snug ${userHasAccess ? 'group-hover:text-sky-600 dark:group-hover:text-sky-400' : ''} transition-colors`}>
                                            {item.jobTitle}
                                          </h4>
                                          {isAdminAuthenticated && (
                                            <button
                                              type="button"
                                              onClick={(e) => {
                                                e.stopPropagation();
                                                setEditingCardTitleSlotId(item.slotId);
                                                setEditingCardTitleValue(item.jobTitle || "");
                                              }}
                                              className="opacity-0 group-hover:opacity-100 p-0.5 text-slate-400 hover:text-sky-600 rounded transition shrink-0"
                                              title="แก้ไขชื่อตำแหน่ง"
                                            >
                                              ✏️
                                            </button>
                                          )}
                                        </div>
                                      )}
                                      <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                        {item.department}
                                      </p>

                                      {/* Candidate Info & Actions Footer: กระชับ สบายตา */}
                                      <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-800 space-y-2">
                                        {/* แถวที่ 1: ชื่อผู้สมัคร + สิทธิ์การเข้าถึง */}
                                        <div className="flex items-center justify-between gap-1.5 min-w-0">
                                          {userHasAccess ? (
                                            item.candidateName ? (
                                              <span className="text-[11px] font-medium text-slate-700 dark:text-slate-300 truncate" title={item.candidateName}>
                                                {item.candidateName}
                                              </span>
                                            ) : (
                                              <span className="text-[10.5px] text-slate-400 italic truncate">
                                                Unassigned (ว่าง)
                                              </span>
                                            )
                                          ) : (
                                            <span className="text-[10.5px] text-slate-400 dark:text-slate-500 truncate" title="Restricted Access (จำกัดสิทธิ์ดูข้อมูล)">
                                              Restricted (จำกัดสิทธิ์)
                                            </span>
                                          )}

                                          {isAdminAuthenticated ? (
                                            <span
                                              className={`text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap shrink-0 border ${
                                                authCount > 0
                                                  ? "bg-sky-50 dark:bg-sky-950/60 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800"
                                                  : "bg-slate-100 dark:bg-slate-800 text-slate-400 border-slate-200 dark:border-slate-700"
                                              }`}
                                              title={`Authorized Users: ${authCount}`}
                                            >
                                              Access: {authCount}
                                            </span>
                                          ) : (
                                            <span
                                              className={`text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap shrink-0 border ${
                                                userHasAccess
                                                  ? "bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800"
                                                  : "bg-slate-100 dark:bg-slate-800 text-slate-400 border-slate-200 dark:border-slate-700"
                                              }`}
                                              title={userHasAccess ? "Authorized (มีสิทธิ์ดูข้อมูลและประเมิน)" : "View Only (ดูได้เฉพาะสเตจบนกระดาน)"}
                                            >
                                              {userHasAccess ? "Authorized" : "View Only"}
                                            </span>
                                          )}
                                        </div>

                                        {/* แถวที่ 2 (ถ้ามี): ปุ่มร่วมประเมินคะแนนสัมภาษณ์ */}
                                        {userHasAccess && item.stage === "interview" && (
                                          <div onClick={(e) => e.stopPropagation()}>
                                            <button
                                              type="button"
                                              onClick={(e) => {
                                                e.stopPropagation();
                                                handleOpenBlindEvaluationModal(item);
                                              }}
                                              className="w-full flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-xl bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 active:scale-98 text-white text-[11px] font-bold shadow-xs transition cursor-pointer whitespace-nowrap"
                                              title="Evaluate Candidate (ประเมินสัมภาษณ์)"
                                            >
                                              <span>Evaluate (ประเมินสัมภาษณ์)</span>
                                            </button>
                                          </div>
                                        )}

                                        {isAdminAuthenticated && item.stage === "onboarded" && (
                                          <div onClick={(e) => e.stopPropagation()}>
                                            {isArrived ? (
                                              <div className="w-full text-center py-1 rounded-xl text-[10px] font-bold text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800">
                                                Onboarded (เริ่มงานแล้ว)
                                              </div>
                                            ) : (
                                              <button
                                                type="button"
                                                onClick={(e) => {
                                                  e.stopPropagation();
                                                  handleConfirmFirstDayTraining(item.slotId);
                                                }}
                                                className="w-full flex items-center justify-center gap-1 py-1.5 px-3 rounded-xl text-[10.5px] font-bold text-white bg-emerald-600 hover:bg-emerald-700 active:scale-98 transition cursor-pointer shadow-xs whitespace-nowrap"
                                                title="Confirm Start Date (ยืนยันมาเริ่มงาน)"
                                              >
                                                <span>Confirm Start (ยืนยันมาเริ่มงาน)</span>
                                              </button>
                                            )}
                                          </div>
                                        )}
