                  {scheduleInterviewDate && (
                    <div className="p-3 rounded-2xl bg-gradient-to-r from-emerald-500/10 via-sky-500/10 to-indigo-500/10 border border-emerald-400/40 dark:border-emerald-700/50 flex items-center gap-2.5">
                      <span className="text-xl shrink-0">📌</span>
                      <div className="min-w-0 flex-1">
                        <span className="text-[10px] uppercase font-extrabold text-emerald-700 dark:text-emerald-300 tracking-wider block">
                          สรุปกำหนดการนัดหมายสัมภาษณ์
                        </span>
                        <p className="text-xs font-bold text-slate-900 dark:text-white mt-0.5 truncate">
                          {(() => {
                            const [y, m, d] = (scheduleInterviewDate || "").split("-");
                            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                            const mIndex = parseInt(m, 10) - 1;
                            const thaiYear = parseInt(y, 10) + 543;
                            return `${parseInt(d, 10)} ${thaiMonths[mIndex] || m} ${thaiYear} เวลา ${scheduleInterviewTime || "10:00"} น.`;
                          })()}
                        </p>
                        <span className="text-[10.5px] font-semibold text-sky-600 dark:text-sky-400 block truncate">
                          รูปแบบ: {scheduleInterviewFormat}
                        </span>
                      </div>
                    </div>
                  )}

                  {/* 1. Date Selection with 1-Click Quick Chips */}
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <label className="text-[11px] font-bold text-slate-700 dark:text-slate-300">
                        1. วันที่นัดสัมภาษณ์ <span className="text-rose-500">*</span>
                      </label>
                      <span className="text-[10px] text-slate-400">เลือกวันด่วน หรือเลือกจากปฏิทิน</span>
                    </div>

                    {/* Quick Date Chips */}
                    <div className="flex flex-wrap gap-1.5 pb-1">
                      {[
                        { label: "⚡ พรุ่งนี้", offset: 1 },
                        { label: "อีก 2 วัน", offset: 2 },
                        { label: "อีก 3 วัน", offset: 3 },
                        { label: "อีก 5 วัน", offset: 5 },
                        { label: "สัปดาห์หน้า (+7 วัน)", offset: 7 }
                      ].map(item => {
                        const targetD = new Date();
                        targetD.setDate(targetD.getDate() + item.offset);
                        const isoStr = `${targetD.getFullYear()}-${String(targetD.getMonth() + 1).padStart(2, '0')}-${String(targetD.getDate()).padStart(2, '0')}`;
                        const isSelected = scheduleInterviewDate === isoStr;

                        return (
                          <button
                            key={item.label}
                            type="button"
                            onClick={() => setScheduleInterviewDate(isoStr)}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition active:scale-95 border ${
                              isSelected
                                ? "bg-sky-600 text-white border-sky-600 shadow-xs ring-1 ring-sky-500/30"
                                : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                            }`}
                          >
                            {item.label}
                          </button>
                        );
                      })}
                    </div>

                    {/* Exact Date Picker Input */}
                    <div className="relative">
                      <input
                        type="date"
                        required
                        value={scheduleInterviewDate}
                        onChange={(e) => setScheduleInterviewDate(e.target.value)}
                        className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold focus:ring-2 focus:ring-sky-500 text-xs text-slate-900 dark:text-white"
                      />
                    </div>
                  </div>

                  {/* 2. Time Selection with 1-Click Quick Chips */}
                  <div className="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <div className="flex items-center justify-between">
                      <label className="text-[11px] font-bold text-slate-700 dark:text-slate-300">
                        2. เวลาที่นัดหมาย (08:00 - 19:00 น.) <span className="text-rose-500">*</span>
                      </label>
                      <span className="text-[10px] text-slate-400">คลิกเลือกช่วงเวลาได้ทันที</span>
                    </div>

                    {/* Time Slot Layout: Morning (08:00 - 13:00) & Afternoon (13:00 - 19:00) */}
                    <div className="space-y-2.5">
                      {/* ☀️ ช่วงเช้า: 08:00 - 13:00 น. */}
                      <div className="p-2.5 rounded-2xl bg-amber-50/50 dark:bg-amber-950/20 border border-amber-200/70 dark:border-amber-900/40 space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-[11px] font-bold text-amber-800 dark:text-amber-300 flex items-center gap-1.5">
                            <span>☀️</span>
                            <span>ช่วงเช้า (08:00 - 13:00 น.)</span>
                          </span>
                          <span className="text-[9.5px] text-amber-700/80 dark:text-amber-400 font-medium">11 ช่วงเวลา</span>
                        </div>
                        <div className="grid grid-cols-4 sm:grid-cols-6 gap-1.5">
                          {["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00"].map(t => (
                            <button
                              key={`morning-${t}`}
                              type="button"
                              onClick={() => setScheduleInterviewTime(t)}
                              className={`w-full py-1.5 rounded-xl text-[11px] font-mono font-bold transition-all active:scale-95 border ${
                                scheduleInterviewTime === t
                                  ? "bg-sky-600 text-white border-sky-600 shadow-sm ring-2 ring-sky-500/25 scale-[1.02]"
                                  : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-sky-400 hover:bg-slate-50 dark:hover:bg-slate-700"
                              }`}
                            >
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* 🌤️ ช่วงบ่าย: 13:00 - 19:00 น. */}
                      <div className="p-2.5 rounded-2xl bg-sky-50/50 dark:bg-sky-950/20 border border-sky-200/70 dark:border-sky-900/40 space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-[11px] font-bold text-sky-800 dark:text-sky-300 flex items-center gap-1.5">
                            <span>🌤️</span>
                            <span>ช่วงบ่าย (13:00 - 19:00 น.)</span>
                          </span>
                          <span className="text-[9.5px] text-sky-700/80 dark:text-sky-400 font-medium">12 ช่วงเวลา</span>
                        </div>
                        <div className="grid grid-cols-4 sm:grid-cols-6 gap-1.5">
                          {["13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00"].map(t => (
                            <button
                              key={`afternoon-${t}`}
                              type="button"
                              onClick={() => setScheduleInterviewTime(t)}
                              className={`w-full py-1.5 rounded-xl text-[11px] font-mono font-bold transition-all active:scale-95 border ${
                                scheduleInterviewTime === t
                                  ? "bg-sky-600 text-white border-sky-600 shadow-sm ring-2 ring-sky-500/25 scale-[1.02]"
                                  : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-sky-400 hover:bg-slate-50 dark:hover:bg-slate-700"
                              }`}
                            >
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Custom Time Input if needed */}
                    <div className="flex items-center justify-between pt-1">
                      <span className="text-[10.5px] text-slate-500 dark:text-slate-400">หรือระบุเวลาเจาะจงเอง:</span>
                      <input
                        type="time"
                        min="08:00"
                        max="19:00"
                        required
                        value={scheduleInterviewTime}
                        onChange={(e) => setScheduleInterviewTime(e.target.value)}
                        className="w-36 px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold focus:ring-2 focus:ring-sky-500 text-xs text-slate-900 dark:text-white"
                      />
                    </div>
                  </div>

                  {/* 3. Format Selection: 1-Click Cards */}
                  <div className="space-y-1.5 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300">
                      3. รูปแบบการสัมภาษณ์ <span className="text-rose-500">*</span>
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { id: "Online (google Meet)", label: "Online (Google Meet)", icon: "💻", desc: "สัมภาษณ์ออนไลน์ผ่าน Meet" },
                        { id: "On-site (Dusit Central Park)", label: "On-site (Dusit Central Park)", icon: "🏢", desc: "ดุสิต เซ็นทรัล พาร์ค" },
                        { id: "On-site (Headquarter)", label: "On-site (Headquarter)", icon: "🏢", desc: "สำนักงานใหญ่" },
                        { id: "On-site (Factory)", label: "On-site (Factory)", icon: "🏭", desc: "โรงงาน" }
                      ].map(item => {
                        const isSelected = scheduleInterviewFormat === item.id;
                        return (
                          <div
                            key={item.id}
                            onClick={() => setScheduleInterviewFormat(item.id)}
                            className={`p-2.5 rounded-xl border transition cursor-pointer select-none flex items-center gap-2 ${
                              isSelected
                                ? "bg-sky-50 dark:bg-sky-950/60 border-sky-500 dark:border-sky-500 ring-2 ring-sky-500/20 shadow-xs"
                                : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-slate-300"
                            }`}
                          >
                            <span className="text-lg shrink-0">{item.icon}</span>
                            <div className="min-w-0 flex-1">
                              <span className={`block text-xs font-bold truncate ${isSelected ? "text-sky-700 dark:text-sky-300" : "text-slate-800 dark:text-slate-200"}`}>
                                {item.label}
                              </span>
                              <span className="block text-[10px] text-slate-400 truncate">
                                {item.desc}
                              </span>
                            </div>
                            {isSelected && <span className="text-sky-600 font-bold text-xs shrink-0">✓</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Google Meet Link (Only for Online) */}
                  {scheduleInterviewFormat.includes("Google Meet") || scheduleInterviewFormat.includes("Online") ? (

                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                        ลิงก์ Google Meet (ถ้ามี)
                      </label>
                      <div className="relative">
                        <input
                          type="url"
                          placeholder="https://meet.google.com/xxx-xxxx-xxx"
                          value={scheduleGoogleMeetUrl}
                          onChange={(e) => setScheduleGoogleMeetUrl(e.target.value)}
                          className="w-full pl-8 pr-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono text-slate-900 dark:text-white focus:ring-2 focus:ring-sky-500"
                        />
                        <div className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400">
                          <Icon name="link" className="w-3.5 h-3.5" />
                        </div>
                      </div>
                    </div>
                  ) : null}

                  <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-[11px] text-emerald-800 dark:text-emerald-300">

                  </div>
                </div>

                {/* Footer Actions */}
                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">

                    type="button"
                    onClick={() => setScheduleAssignModalData(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 transition"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmScheduleAssign}
                    className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 shadow-md shadow-sky-500/20 active:scale-95 transition flex items-center gap-1.5"
                  >
                    <span>ยืนยันนัดสัมภาษณ์ &amp; จับคู่ตำแหน่ง</span>
                    <Icon name="checkCircle" className="w-4 h-4 text-white" />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Candidate Full 18-Column Details & Edit Modal */}
          {selectedCandidateDetail && candidateEditForm && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-3 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                {/* Modal Header */}
                <div className="px-6 py-4 bg-gradient-to-r from-slate-900 via-slate-800 to-sky-950 text-white flex items-center justify-between">

                    <div className="w-10 h-10 rounded-2xl bg-sky-500/20 text-sky-300 flex items-center justify-center text-lg font-bold border border-sky-400/30 shadow-inner">
                      👤
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-400">
                          {selectedCandidateDetail.candidateId || `CAND-2026-${String(selectedCandidateDetail.no || 1).padStart(3, '0')}`}
                        </span>
                        <span className="text-[10px] text-slate-400 font-semibold">&bull; ลำดับที่ (No.) #{selectedCandidateDetail.no || '-'}</span>
                      </div>
                      <h3 className="text-base sm:text-lg font-extrabold text-white leading-tight">
                        {isEditingCandidate ? "แก้ไขข้อมูลผู้สมัคร" : `${selectedCandidateDetail.fullName} ${selectedCandidateDetail.nickname ? `(${selectedCandidateDetail.nickname})` : ''}`}
                      </h3>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setIsEditingCandidate(!isEditingCandidate)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                        isEditingCandidate 
                          ? "bg-amber-500 hover:bg-amber-600 text-white shadow-md"
                          : "bg-white/10 hover:bg-white/20 text-sky-300 border border-sky-400/30"
                      }`}
                    >
                      <span>{isEditingCandidate ? "👁️ โหมดดูข้อมูล" : "✏️ แก้ไขข้อมูล"}</span>
                    </button>
                    <button 
                      type="button"
                      onClick={() => { setSelectedCandidateDetail(null); setIsEditingCandidate(false); }} 
                      className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition cursor-pointer"
                    >
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Modal Body */}
                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {isEditingCandidate ? (
                    <form id="candidateEditForm" onSubmit={handleSaveCandidateEdit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="sm:col-span-2">
                          <label className="block text-[11px] font-semibold mb-1">ชื่อ - นามสกุล *</label>
                          <input
                            type="text"
                            required
                            value={candidateEditForm.fullName}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, fullName: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ชื่อเล่น</label>
                          <input
                            type="text"
                            value={candidateEditForm.nickname || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, nickname: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">เบอร์โทรศัพท์</label>
                          <input
                            type="tel"
                            value={candidateEditForm.phone || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, phone: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ตำแหน่งที่สนใจ (Target Role) *</label>
                          <input
                            type="text"
                            required
                            value={candidateEditForm.targetJobTitle}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, targetJobTitle: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ระดับ (Level)</label>
                          <select
                            value={candidateEditForm.level || "L3"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, level: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          >
                            {CANDIDATE_LEVELS.map(lvl => (
                              <option key={lvl} value={lvl}>{lvl}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">สาขา / Branch</label>
                          <select
                            value={candidateEditForm.branch || "Dusit Central Park"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, branch: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                          >
                            {CANDIDATE_BRANCH_OPTIONS.map(br => (
                              <option key={br} value={br}>{br}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ประเภท (Type)</label>
                          <select
                            value={candidateEditForm.type || "Full-Time"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, type: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          >
                            <option value="Full-Time">Full-Time</option>
                            <option value="Contract">Contract</option>
                            <option value="Internship">Internship</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">MBTI *</label>
                          <input
                            type="text"
                            required
                            list="mbti-options-edit"
                            placeholder="พิมพ์หรือเลือก MBTI"
                            value={candidateEditForm.mbti || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, mbti: e.target.value.toUpperCase() })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold font-mono text-xs uppercase"
                          />
                          <datalist id="mbti-options-edit">
                            {CANDIDATE_MBTI_OPTIONS.map(m => (
                              <option key={m} value={m} />
                            ))}
                          </datalist>
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">สถานะ (Status)</label>
                          <select
                            value={candidateEditForm.status}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, status: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          >
                            {CANDIDATE_STATUS_CONFIG.map(st => (
                              <option key={st.id} value={st.id}>{st.label}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">Prescreen Date</label>
                          <input
                            type="date"
                            value={candidateEditForm.prescreenDate || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, prescreenDate: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">Resume Confirm Date</label>
                          <input
                            type="date"
                            value={candidateEditForm.resumeConfirmDate || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, resumeConfirmDate: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">วันเริ่มงาน (Hire Date)</label>
                          <input
                            type="date"
                            value={candidateEditForm.hireDate || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, hireDate: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">แหล่งที่มา (Channel)</label>
                          <select
                            value={candidateEditForm.source || "LinkedIn"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, source: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          >
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="JobsDB">JobsDB</option>
                            <option value="JobThai">JobThai</option>
                            <option value="Facebook Page">Facebook Page</option>
                            <option value="Employee Referral">Employee Referral</option>
                            <option value="Direct Email">Direct Email</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ลิงก์ Google Drive (CV / Resume Link)</label>
                        <div className="relative">
                          <input
                            type="url"
                            placeholder="https://drive.google.com/file/d/.../view"
                            value={candidateEditForm.resumeUrl || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, resumeUrl: e.target.value })}
                            className="w-full p-2.5 pl-8 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono"
                          />
                          <div className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="link" className="w-3.5 h-3.5" />
                          </div>
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">หมายเหตุ (Remark)</label>
                        <textarea
                          rows="2"
                          value={candidateEditForm.remark || ""}
                          onChange={(e) => setCandidateEditForm({ ...candidateEditForm, remark: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                        ></textarea>
                      </div>
                    </form>
                  ) : (
                    <>

                              <span className="font-bold text-brand-600">{s.slotId}</span>
                              <span className="text-slate-400">&bull;</span>
                              <span className="text-slate-500 font-semibold">{s.positionType}</span>
                              <span className="text-slate-400">&bull;</span>
                              <span className={`px-2 py-0.5 rounded font-bold ${s.slotStatus === "Closed" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}`}>
                                {s.slotStatus}
                              </span>
                            </div>
                            <h4 className="font-bold text-sm text-slate-900 dark:text-white">{s.jobTitle}</h4>
                            {s.candidateName && (
                              <p className="text-emerald-700 dark:text-emerald-300 font-semibold text-xs mt-1">
                                👤 แคนดิเดต: {s.candidateName} {s.candidateNickname ? `(${s.candidateNickname})` : ''}
                              </p>
                            )}
                            {isAdminAuthenticated && (
                              <div className="mt-2 text-[10px] text-slate-400 space-y-0.5">
                                <p>ผู้ขอ: {s.requesterName} &bull; ผู้อนุมัติ: {s.approverName}</p>
                                {s.hireDate && <p className="text-emerald-600 font-bold">🎉 วันเริ่มงาน: {s.hireDate}</p>}
                                {s.evaluationsCount > 0 && (
                                  <p className="text-brand-600 font-semibold">⭐ ผลประเมิน: {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน</p>
                                )}
                              </div>
                            )}
                          </div>

                          <div className="flex sm:flex-col items-end gap-1.5 shrink-0">
                            <span className="px-2.5 py-1 rounded-xl bg-slate-200 dark:bg-slate-700 font-bold text-[11px]">
                              Stage: {s.stage}
                            </span>
                            <span className="text-[10px] text-slate-500">
                              ⏱️ {sla.workingDaysElapsed} วันทำการ
                            </span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                <div className="pt-3 pb-4 px-6 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setSelectedDepartmentDetail(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Blind Evaluation Modal Form */}
          {blindEvalModalSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[94vh] flex flex-col">
                
                <div className="px-6 py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200">
                      แบบฟอร์มประเมินสัมภาษณ์งาน (INTERVIEW EVALUATION FORM)
                    </span>
                    <h3 className="text-base sm:text-lg font-extrabold mt-0.5">
                      {blindEvalModalSlot.candidateName || "ผู้สมัคร"} &bull; {blindEvalModalSlot.jobTitle}
                    </h3>
                  </div>
                  <button onClick={() => setBlindEvalModalSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="bg-sky-50 dark:bg-sky-950/70 border-b border-sky-200/80 dark:border-sky-800 px-6 py-2.5 flex items-center gap-2 text-xs text-sky-800 dark:text-sky-200 font-medium">
                  <Icon name="shieldCheck" className="w-4 h-4 text-sky-600 shrink-0" />
                  <span>
                    <strong>การประเมินแบบอิสระ (Blind Assessment):</strong> แบบฟอร์มนี้จะไม่แสดงคะแนนหรือความคิดเห็นของกรรมการท่านอื่น เพื่อความเป็นกลาง
                  </span>
                </div>

                <form onSubmit={handleSaveBlindEvaluation} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ชื่อผู้ประเมิน <span className="text-rose-600">*</span>
                      </label>
                      <SearchableSelect
                        value={blindEvalForm.evaluatorName}
                        placeholder="-- เลือกหรือพิมพ์ชื่อผู้ประเมิน --"
                        options={evaluatorOptions}
                        onChange={(name) => setBlindEvalForm({ ...blindEvalForm, evaluatorName: name })}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        บทบาท (Role) <span className="text-rose-600">*</span>
                      </label>
                      <select
                        value={blindEvalForm.evaluatorRole}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, evaluatorRole: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      >
                        {EVALUATOR_ROLES.map(role => (
                          <option key={role} value={role}>{role}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        วันที่ประเมิน <span className="text-rose-600">*</span>
                      </label>
                      <input
                        type="date"
                        required
                        value={blindEvalForm.date}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, date: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      />
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="font-bold text-slate-900 dark:text-white text-xs pb-1 border-b border-slate-200 dark:border-slate-800">
                      เกณฑ์การประเมิน 5 ด้าน (1 = ต่ำกว่ามาตรฐานมาก, 5 = เหนือกว่ามาตรฐานมาก)
                    </div>

                    {EVALUATION_CRITERIA.map(crit => {
                      const score = blindEvalForm.scores[crit.id];

                      return (
                        <div key={crit.id} className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-700/80 space-y-2">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                            <div>
                              <h4 className="font-bold text-slate-900 dark:text-white text-xs">{crit.label}</h4>
                              <p className="text-[11px] text-slate-500 dark:text-slate-400">{crit.desc}</p>
                            </div>
                            <span className="text-brand-600 dark:text-brand-400 font-extrabold text-xs shrink-0">
                              คะแนน: {score} / 5
                            </span>
                          </div>

                          <div className="flex items-center gap-1.5 pt-1 border-t border-slate-200/50 dark:border-slate-700/50">
                            {[1, 2, 3, 4, 5].map(val => (
                              <button
                                key={`score-${crit.id}-${val}`}
                                type="button"
                                onClick={() => setBlindEvalForm({
                                  ...blindEvalForm,
                                  scores: { ...blindEvalForm.scores, [crit.id]: val }
                                })}
                                className={`flex-1 py-1.5 rounded-xl font-bold text-xs transition border ${
                                  score === val
                                    ? "bg-brand-600 text-white border-brand-600 shadow-sm"
                                    : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                                }`}
                              >
                                {val}
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {(() => {
                    const sc = blindEvalForm.scores;
                    const tot = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
                    const avg = (tot / 5).toFixed(1);
                    const pct = Math.round((tot / 25) * 100);
                    const isPass = pct >= 70;

                    return (
                      <div className={`p-3.5 rounded-2xl border flex items-center justify-between ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-200"
                      }`}>
                        <div>
                          <p className="text-[10px] uppercase font-bold opacity-80">สรุปคะแนนประเมินของคุณ</p>
                          <h4 className="text-base font-extrabold mt-0.5">{tot} / 25 คะแนน (เฉลี่ย {avg}/5 &bull; {pct}%)</h4>
                        </div>
                        <span className={`px-2.5 py-1 rounded-lg font-bold text-xs ${
                          isPass ? "bg-emerald-600 text-white" : "bg-amber-600 text-white"
                        }`}>
                          {isPass ? "เกณฑ์ผ่าน (≥ 70%)" : "ต่ำกว่า 70%"}
                        </span>
                      </div>
                    );
                  })()}

                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        จุดเด่นของผู้สมัคร (Strengths) <span className="text-rose-600">*</span>
                      </label>
                      <textarea
                        required
                        rows="2"
                        placeholder="ระบุจุดเด่น ทักษะ หรือประสบการณ์สำคัญ..."
                        value={blindEvalForm.strengths}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, strengths: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ข้อควรพัฒนา (Areas for Improvement) <span className="text-rose-600">*</span>
                      </label>
                      <textarea
                        required
                        rows="2"
                        placeholder="ระบุข้อควรพัฒนาเพิ่มเติม..."
                        value={blindEvalForm.improvements}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, improvements: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ข้อเสนอแนะสรุปผล (Recommendation) <span className="text-rose-600">*</span>
                      </label>
                      <select
                        required
                        value={blindEvalForm.recommendation}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, recommendation: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                      >
                        <option value="Recommend to Hire">Recommend to Hire (เสนอรับเข้าทำงาน)</option>
                        <option value="Compare">Compare (เปรียบเทียบกับผู้สมัครรายอื่น)</option>
                        <option value="Keep in Pool / Reserve">Keep in Pool / Reserve (เก็บเป็นตัวสำรอง)</option>
                        <option value="Not Recommended">Not Recommended (ไม่ผ่านการคัดเลือก)</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setBlindEvalModalSlot(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md"
                    >
                      บันทึกผลการประเมิน
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* Admin Audit Modal */}
          {adminAuditSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-3xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">
                      ADMIN &amp; HR AUDIT REPORT: DETAILED EVALUATION BREAKDOWN
                    </span>
                    <h3 className="text-base sm:text-lg font-bold mt-0.5">
                      {adminAuditSlot.candidateName || "ผู้สมัคร"} &bull; {adminAuditSlot.jobTitle} (Slot #{adminAuditSlot.slotId})
                    </h3>
                  </div>
                  <button onClick={() => setAdminAuditSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  {(() => {
                    const stats = calculateOverallScore(adminAuditSlot.evaluations);
                    const isPass = stats.result === "Pass";

                    return (
                      <div className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-rose-50 dark:bg-rose-950/50 border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200"
                      }`}>
                        <div>
                          <span className="text-[10px] uppercase font-extrabold opacity-80">
                            คะแนนเฉลี่ยรวมจากกรรมการทั้งหมด ({stats.count} ท่าน)
                          </span>
                          <h4 className="text-2xl font-extrabold mt-0.5">
                            {stats.combinedAvg} / 5 ({stats.combinedPct}%)
                          </h4>
                          <p className="text-[11px] opacity-80 mt-0.5">
                            เกณฑ์การคัดเลือก: ผ่านที่ 70% ขึ้นไป (คะแนนเฉลี่ย 3.5 / 5.0)
                          </p>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className={`px-3 py-1.5 rounded-xl font-extrabold text-xs uppercase shadow-xs ${
                            isPass ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                          }`}>
                            {isPass ? "✓ ผ่านการประเมิน (Pass)" : "✗ ไม่ผ่านการประเมิน (Fail)"}
                          </span>
                        </div>
                      </div>
                    );
                  })()}

                  <div className="space-y-3">
                    <div className="font-bold text-slate-900 dark:text-white text-xs pb-1 border-b border-slate-200 dark:border-slate-800">
                      รายละเอียดคะแนนแยกรายบุคคล (Individual Submissions)
                    </div>

                    {(adminAuditSlot.evaluations || []).length === 0 ? (
                      <div className="p-8 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-2xl">
                        ยังไม่มีกรรมการหรือ HR บันทึกผลประเมินสำหรับตำแหน่งนี้
                      </div>
                    ) : (
                      adminAuditSlot.evaluations.map((ev, idx) => (
                        <div key={ev.id || idx} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-3">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 pb-2 border-b border-slate-200/60 dark:border-slate-700/60">
                            <div>
                              <div className="font-extrabold text-slate-900 dark:text-white text-sm flex items-center gap-2">
                                <span>#{idx + 1} {ev.evaluatorName}</span>
                                <span className="px-2 py-0.5 rounded-md bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 text-[10px] font-semibold">
                                  {ev.evaluatorRole}
                                </span>
                              </div>
                              <p className="text-[10px] text-slate-400 mt-0.5">วันที่ประเมิน: {ev.date}</p>
                            </div>
                            <div className="text-right">
                              <span className="text-base font-extrabold text-slate-900 dark:text-white">{ev.avg} / 5</span>
                              <span className="text-[10px] text-slate-400 ml-1">({ev.pct}%)</span>
                            </div>
                          </div>

                          <div className="grid grid-cols-5 gap-1.5 text-center text-[10px]">
                            {EVALUATION_CRITERIA.map(crit => (
                              <div key={crit.id} className="p-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700">
                                <span className="block text-slate-400 truncate" title={crit.label}>ข้อ {crit.id.replace('c','')}</span>
                                <strong className="text-xs font-bold text-brand-600">{ev.scores?.[crit.id] || '-'}/5</strong>
                              </div>
                            ))}
                          </div>

                          <div className="space-y-1 text-[11px] text-slate-600 dark:text-slate-300 pt-1">
                            {ev.strengths && <p><strong>จุดเด่น:</strong> {ev.strengths}</p>}
                            {ev.improvements && <p><strong>ข้อควรพัฒนา:</strong> {ev.improvements}</p>}
                            <p><strong>ข้อเสนอแนะ:</strong> <span className="font-semibold text-brand-600 dark:text-brand-400">{ev.recommendation || '-'}</span></p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                </div>

                <div className="pt-3 pb-4 px-6 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setAdminAuditSlot(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    ปิดหน้าต่าง Audit
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Add Candidate Modal */}
          {showAddCandidateModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                {/* Header */}
                <div className="px-6 py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200 block">
                      CANDIDATE POOL ENROLLMENT (ระบบบันทึกผู้สมัครงาน)
                    </span>
                    <h3 className="text-base sm:text-lg font-extrabold flex items-center gap-2 mt-0.5">
                      <Icon name="plus" className="w-5 h-5 text-white" />
                      <span>Add New Candidate to Candidate Pool (เพิ่มผู้สมัครใหม่เข้า Candidate Pool)</span>
                    </h3>
                  </div>
                  <button onClick={() => setShowAddCandidateModal(false)} className="p-2 text-white/80 hover:text-white rounded-xl hover:bg-white/10 transition">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Mandatory Policy Banner */}
                <div className="p-3.5 bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-800 text-[11.5px] text-amber-900 dark:text-amber-200 font-semibold flex items-center gap-2">
                  <span className="text-base">🔒</span>
                  <span><strong>Mandatory Completion Policy (นโยบายการกรอกข้อมูล):</strong> จำเป็นต้องระบุข้อมูลให้ครบทุกช่องที่มีเครื่องหมาย <span className="text-rose-600 font-bold">*</span> หากไม่ครบ ระบบจะไม่สามารถบันทึกได้</span>
                </div>

                <form onSubmit={handleSaveNewCandidate} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2">
                      <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                        Full Name (ชื่อ - นามสกุล) <span className="text-rose-600 font-bold">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. นาย สิทธิชัย อัศวเดช / John Smith"
                        value={newCandidateForm.fullName}
                        onChange={(e) => setNewCandidateForm({ ...newCandidateForm, fullName: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                        Nickname (ชื่อเล่น) <span className="text-rose-600 font-bold">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. ชัย / Jay"
                        value={newCandidateForm.nickname}
                        onChange={(e) => setNewCandidateForm({ ...newCandidateForm, nickname: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold text-xs"
                      />

  } catch (err) {

      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

{`function doPost(e) {

  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (data.action === "addCandidate") {

    sumSheet.clearContents();
    var s = data.summary;
    var rows = [
      ["TA Recruitment Real-Time Summary", s.updatedTimestamp, "", "", "", ""],
      ["Metric", "Value", "Subtext", "", "", ""],
      ["ตำแหน่งที่เปิดสรรหา", s.overview.openPositionsCount, "จากทั้งหมด " + s.overview.totalPositionsCount + " ตำแหน่ง", "", "", ""],

      ["รับเข้าแล้ว (รวม)", s.efficiency.hiredTotalCount, "จากต้องการ " + s.overview.totalRequiredHeadcount + " อัตรา", "", "", ""],

    ];
    sumSheet.getRange(1, 1, rows.length, 6).setValues(rows);
  }
}`}
