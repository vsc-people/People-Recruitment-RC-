                    <h3 className="text-base sm:text-lg font-extrabold text-white flex items-center gap-2 mt-0.5">
                      <Icon name="plus" className="w-5 h-5 text-white" />
                      <span>Manpower Requisition Form (แบบฟอร์มขอกำลังคน)</span>
                    </h3>
                  </div>
                  <button onClick={() => setShowRequestModal(false)} className="p-2 text-white/80 hover:text-white rounded-xl hover:bg-white/10 transition">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Policy Notice */}
                <div className="p-3.5 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700 text-[11.5px] text-slate-700 dark:text-slate-300 font-medium flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-base">📋</span>
                    <span>กรุณาระบุข้อมูลตำแหน่งงานและคุณสมบัติให้ครบถ้วนเพื่อส่งให้แอดมินดำเนินการสรรหา</span>
                  </div>
                  <span className="text-[10px] text-sky-600 dark:text-sky-400 font-semibold whitespace-nowrap shrink-0">
                    🔄 ดึงข้อมูลอัตโนมัติจาก Sheet
                  </span>
                </div>

                {/* Inline Validation Error Alert Banner */}
                {formValidationError && (
                  <div className="mx-6 mt-4 p-3.5 rounded-2xl bg-rose-50 dark:bg-rose-950/70 border border-rose-300 dark:border-rose-800 text-rose-800 dark:text-rose-200 text-xs font-bold flex items-center justify-between gap-2 animate-fadeIn">
                    <div className="flex items-center gap-2">
                      <span className="text-base shrink-0">⚠️</span>
                      <span>{formValidationError}</span>
                    </div>
                    <button
                      type="button"
                      onClick={() => setFormValidationError("")}
                      className="text-rose-500 hover:text-rose-700 p-1 shrink-0"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                )}

                <form id="reqFormModalBody" onSubmit={handleFormSubmit} noValidate className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  {/* Section 1: Requester Details */}
                  <div className="p-4 rounded-2xl bg-slate-50/70 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700 space-y-3">
                    <h4 className="font-extrabold text-slate-900 dark:text-white text-xs flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">
                      <span className="w-5 h-5 rounded-full bg-brand-600 text-white text-[10px] font-bold flex items-center justify-center">1</span>
                      <span>Requester Information (1. ข้อมูลผู้ยื่นคำขอ)</span>
                    </h4>
                    
                    {/* Row 1: Requester Name & Requester Position */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Requester Name - EN (ชื่อผู้ขอภาษาอังกฤษ) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <SearchableSelect
                          value={formInput.requesterName}
                          placeholder="-- เลือกชื่อผู้ขอ --"
                          options={requesterOptions}
                          onChange={(name) => {
                            const p = personnelList.find(x => (x.nameEn || x.name) === name);
                            if (p) {
                              setFormInput({
                                ...formInput,
                                requesterName: name,
                                requesterPosition: p.position || "",
                                requesterEmail: p.email || "",
                                department: (p.department && p.department !== "-") ? p.department : formInput.department,
                                division: (p.division && p.division !== "-") ? p.division : formInput.division
                              });
                            } else {
                              setFormInput({ ...formInput, requesterName: name });
                            }
                          }}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Requester Position (ตำแหน่งผู้ขอ) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <input
                          type="text"
                          placeholder="e.g. People Team Lead"
                          value={formInput.requesterPosition}
                          onChange={(e) => setFormInput({ ...formInput, requesterPosition: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>
                    </div>

                    {/* Row 2: Requester Email & Department */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-slate-200/60 dark:border-slate-700/60">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Requester Email (อีเมลผู้ขอ) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <input
                          type="email"
                          placeholder="requester@valuesourcing.co"
                          value={formInput.requesterEmail}
                          onChange={(e) => setFormInput({ ...formInput, requesterEmail: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>
                      <div>
                        <div className="flex items-center justify-between mb-1">
                          <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300">
                            Department (ฝ่ายงาน)
                          </label>
                          <span className="text-[10px] text-slate-400 font-medium">กรอกชื่อฝ่าย หรือใส่ "-" ได้</span>
                        </div>
                        <SearchableSelect
                          value={formInput.department || "-"}
                          emptyValue="-"
                          placeholder="-- เลือกฝ่ายงาน หรือพิมพ์ - --"
                          options={departmentOptions}
                          onChange={(dept) => setFormInput({ ...formInput, department: dept || "-" })}
                        />
                      </div>
                    </div>

                    {/* Row 3: Division & Candidate Supervisor */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-slate-200/60 dark:border-slate-700/60">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Division (สายงาน) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <input
                          type="text"
                          list="division-sheet-options"
                          placeholder="e.g. People & Culture / Technology"
                          value={formInput.division}
                          onChange={(e) => setFormInput({ ...formInput, division: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                        <datalist id="division-sheet-options">
                          {divisionOptions.map((divItem, idx) => (
                            <option key={idx} value={divItem} />
                          ))}
                        </datalist>
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Candidate Supervisor - EN (หัวหน้างานของผู้สมัคร) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <SearchableSelect
                          value={formInput.candidateSupervisor}
                          placeholder="-- เลือกหัวหน้างาน --"
                          options={supervisorOptions}
                          onChange={(supVal) => setFormInput({ ...formInput, candidateSupervisor: supVal })}
                        />
                      </div>
                    </div>
                  </div>

                  {/* Section 2: Approver & Routing */}
                  <div className="p-4 rounded-2xl bg-sky-50/60 dark:bg-sky-950/30 border border-sky-200/80 dark:border-sky-800 space-y-3">
                    <div className="flex items-center justify-between border-b border-sky-200 dark:border-sky-800 pb-2">
                      <h4 className="font-extrabold text-sky-900 dark:text-sky-200 text-xs flex items-center gap-2">
                        <span className="w-5 h-5 rounded-full bg-sky-600 text-white text-[10px] font-bold flex items-center justify-center">2</span>
                        <span>Approver &amp; Routing (2. ผู้อนุมัติและการส่งต่อ)</span>
                      </h4>
                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-sky-100 dark:bg-sky-900/60 text-sky-700 dark:text-sky-300 border border-sky-300 dark:border-sky-700">
                        🔒 Auto-Locked (กำหนดอัตโนมัติ)
                      </span>
                    </div>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-sky-900 dark:text-sky-300">
                          Approver Name (ชื่อผู้อนุมัติ)
                        </label>
                        <input
                          type="text"
                          disabled
                          readOnly
                          value="ศรัณย์ภัทธ อุบล"
                          className="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold cursor-not-allowed select-none"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-sky-900 dark:text-sky-300">
                          Approver Email (อีเมลผู้อนุมัติ)
                        </label>
                        <input
                          type="text"
                          disabled
                          readOnly
                          value="sarunpat.ub@valuesourcing.co"
                          className="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold cursor-not-allowed select-none"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Section 3: Position Requisition & Qualifications */}
                  <div className="p-4 rounded-2xl bg-slate-50/70 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700 space-y-3">
                    <h4 className="font-extrabold text-slate-900 dark:text-white text-xs flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">
                      <span className="w-5 h-5 rounded-full bg-brand-600 text-white text-[10px] font-bold flex items-center justify-center">3</span>
                      <span>Position &amp; Qualifications (3. ตำแหน่งและคุณสมบัติที่ต้องการ)</span>
                    </h4>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="sm:col-span-2">
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Job Title (ชื่อตำแหน่งงานที่ต้องการรับ) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <input
                          type="text"
                          placeholder="e.g. Senior Full-Stack AI Engineer"
                          value={formInput.jobTitle}
                          onChange={(e) => setFormInput({ ...formInput, jobTitle: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Headcount Required (จำนวนอัตรา) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <input
                          type="number"
                          min="1"
                          placeholder="1"
                          value={formInput.headcountRequired}
                          onChange={(e) => setFormInput({ ...formInput, headcountRequired: Math.max(1, parseInt(e.target.value, 10) || 1) })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-center"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300 truncate">
                          Position Type (ประเภทตำแหน่ง) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.positionType}
                          onChange={(e) => setFormInput({ ...formInput, positionType: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="Replacement">Replacement (ทดแทนตำแหน่งเดิม)</option>
                          <option value="New Headcount">New Headcount (เปิดรับตำแหน่งใหม่)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300 truncate">
                          Work Location (สถานที่ปฏิบัติงาน) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.workLocation || "Dusit Central Park"}
                          onChange={(e) => setFormInput({ ...formInput, workLocation: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="Dusit Central Park">Dusit Central Park (ดุสิต เซ็นทรัล พาร์ค)</option>
                          <option value="Headquarter">Headquarter (สำนักงานใหญ่)</option>
                          <option value="Factory">Factory (โรงงาน)</option>
                        </select>
                      </div>
                    </div>

                    {formInput.positionType === "Replacement" && (
                      <div className="p-3.5 rounded-xl bg-amber-50 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-800 animate-fadeIn">
                        <label className="block text-[11px] font-bold text-amber-900 dark:text-amber-200 mb-1">
                          Replaced Employee Name (ชื่อพนักงานเดิมที่ถูกทดแทน) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <input
                          type="text"
                          placeholder="ระบุชื่อพนักงานที่ลาออก"
                          value={formInput.replacedEmployeeName}
                          onChange={(e) => setFormInput({ ...formInput, replacedEmployeeName: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-amber-300 dark:border-amber-700 font-semibold focus:ring-2 focus:ring-amber-500"
                        />
                      </div>
                    )}

                    {/* Target Start Date & Buddy / Mentor - EN จัดวางให้อยู่ในบรรทัดเดียวกันอย่างสมดุล */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300 truncate">
                          Target Start Date (ต้องการให้เริ่มงานภายในวันที่) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <input
                          type="date"
                          value={formInput.targetDate}
                          onChange={(e) => setFormInput({ ...formInput, targetDate: e.target.value })}
                          className="w-full px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold text-xs h-[34px]"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300 truncate">
                          Buddy / Mentor - EN (พี่เลี้ยงภาษาอังกฤษ) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <SearchableSelect
                          value={formInput.buddy}
                          placeholder="-- เลือกพี่เลี้ยง --"
                          options={buddyOptions}
                          onChange={(buddyName) => setFormInput({ ...formInput, buddy: buddyName })}
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Gender (เพศ) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.gender}
                          onChange={(e) => setFormInput({ ...formInput, gender: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="ไม่ระบุ">Any / Not Specified (ไม่ระบุ)</option>
                          <option value="ชาย">Male (ชาย)</option>
                          <option value="หญิง">Female (หญิง)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Age Range (ช่วงอายุ) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.age}
                          onChange={(e) => setFormInput({ ...formInput, age: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="ไม่จำกัด">Any / No Limit (ไม่จำกัดอายุ)</option>
                          <option value="20-25 ปี">20-25 Years (20-25 ปี)</option>
                          <option value="25-30 ปี">25-30 Years (25-30 ปี)</option>
                          <option value="30-35 ปี">30-35 Years (30-35 ปี)</option>
                          <option value="35-40 ปี">35-40 Years (35-40 ปี)</option>
                          <option value="40 ปีขึ้นไป">40+ Years (40 ปีขึ้นไป)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Education Level (ระดับการศึกษา) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.educationLevel}
                          onChange={(e) => setFormInput({ ...formInput, educationLevel: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="ปริญญาตรี">Bachelor's Degree (ปริญญาตรี)</option>
                          <option value="ปริญญาโทขึ้นไป">Master's / Ph.D. (ปริญญาโทขึ้นไป)</option>
                          <option value="ปวส.">High Vocational Certificate (ปวส.)</option>
                          <option value="มัธยมศึกษา-ปวช.">High School / Vocational (มัธยมศึกษา-ปวช.)</option>
                          <option value="ไม่จำกัด">Any / No Limit (ไม่จำกัดวุฒิ)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Major / Field of Study (สาขาวิชา)
                        </label>
                        <input
                          type="text"
                          placeholder="e.g. Computer Science หรือ -"
                          value={formInput.major}
                          onChange={(e) => setFormInput({ ...formInput, major: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                          Work Experience (ประสบการณ์ทำงาน) <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.experience}
                          onChange={(e) => setFormInput({ ...formInput, experience: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="1-3 ปี">1-3 Years (1-3 ปี)</option>
                          <option value="3-5 ปี">3-5 Years (3-5 ปี)</option>
                          <option value="5 ปีขึ้นไป">5+ Years (5 ปีขึ้นไป)</option>
                          <option value="ยินดีรับนักศึกษาจบใหม่">Fresh Graduate (ยินดีรับนักศึกษาจบใหม่)</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                        Must-Have Qualifications (คุณสมบัติจำเป็น)
                      </label>
                      <textarea
                        rows="2"
                        placeholder="ระบุทักษะ หรือระบุ - หากไม่มีข้อกำหนดเฉพาะ..."
                        value={formInput.mustHaveQualifications}
                        onChange={(e) => setFormInput({ ...formInput, mustHaveQualifications: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-medium"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold mb-1 text-slate-700 dark:text-slate-300">
                        Job Description (ลักษณะงานโดยย่อ)
                      </label>
                      <textarea
                        rows="2"
                        placeholder="สรุปขอบเขตงาน หรือระบุ - ..."
                        value={formInput.jobDescription}
                        onChange={(e) => setFormInput({ ...formInput, jobDescription: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-medium"
                      ></textarea>
                    </div>
                  </div>

                  {/* Section 4: IT & Equipment Requirements */}
                  <div className="p-4 rounded-2xl bg-purple-50/60 dark:bg-purple-950/30 border border-purple-200/80 dark:border-purple-800 space-y-3">
                    <div className="flex items-center justify-between border-b border-purple-200 dark:border-purple-800 pb-2">
                      <h4 className="font-extrabold text-purple-900 dark:text-purple-300 text-xs flex items-center gap-2">
                        <span className="w-5 h-5 rounded-full bg-purple-600 text-white text-[10px] font-bold flex items-center justify-center">4</span>
                        <span>IT &amp; Equipment Requisition (4. อุปกรณ์และสิทธิ์ IT)</span>
                      </h4>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <label className="block text-[10px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                          Laptop / PC <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.itLaptop}
                          onChange={(e) => setFormInput({ ...formInput, itLaptop: e.target.value })}
                          className="w-full p-1.5 rounded-lg border text-xs font-bold bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"
                        >
                          <option value="ต้องการ">Required (ต้องการ)</option>
                          <option value="ไม่ต้องการ">Not Required (ไม่ต้องการ)</option>
                        </select>
                      </div>

                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <label className="block text-[10px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                          Sim / Phone <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.itSimCard}
                          onChange={(e) => setFormInput({ ...formInput, itSimCard: e.target.value })}
                          className="w-full p-1.5 rounded-lg border text-xs font-bold bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"
                        >
                          <option value="ไม่ต้องการ">Not Required (ไม่ต้องการ)</option>
                          <option value="ต้องการ">Required (ต้องการ)</option>
                        </select>
                      </div>

                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <label className="block text-[10px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                          Corporate Email <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.itEmail}
                          onChange={(e) => setFormInput({ ...formInput, itEmail: e.target.value })}
                          className="w-full p-1.5 rounded-lg border text-xs font-bold bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"
                        >
                          <option value="ต้องการ">Required (ต้องการ)</option>
                          <option value="ไม่ต้องการ">Not Required (ไม่ต้องการ)</option>
                        </select>
                      </div>

                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <label className="block text-[10px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                          ERP Netsuite <span className="text-rose-500 font-bold">*</span>
                        </label>
                        <select
                          value={formInput.itNetsuite}
                          onChange={(e) => setFormInput({ ...formInput, itNetsuite: e.target.value })}
                          className="w-full p-1.5 rounded-lg border text-xs font-bold bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"
                        >
                          <option value="ไม่ต้องการ">Not Required (ไม่ต้องการ)</option>
                          <option value="ต้องการ">Required (ต้องการ)</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  {/* Form Footer */}
                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                    <button
                      type="button"
                      onClick={() => setShowRequestModal(false)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-200 transition"
                    >
                      Cancel (ยกเลิก)
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition active:scale-95 cursor-pointer"
                    >
                      Next: Review &amp; Submit (ถัดไป: ตรวจสอบและบันทึกคำขอ) &rarr;
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* Admin Detail View Slide-Over / Modal (Requisition Queue Detail) */}
          {selectedRequisitionDetail && (
            <div className="fixed inset-0 z-[80] flex items-center justify-end bg-slate-950/70 backdrop-blur-sm animate-fadeIn">
              <div 
                className="relative w-full max-w-2xl h-full bg-white dark:bg-slate-900 shadow-2xl border-l border-slate-200 dark:border-slate-800 flex flex-col justify-between overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Header */}
                <div className="px-6 py-5 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between border-b border-slate-800">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-amber-400">
                        REQUISITION INSPECTION &amp; APPROVAL ACTION
                      </span>
                      <span className="text-[10px] text-slate-400">&bull; {formatCleanDateTime(selectedRequisitionDetail.requestDate)}</span>
                    </div>
                    <h3 className="text-base sm:text-lg font-extrabold text-white mt-0.5">
                      {selectedRequisitionDetail.jobTitle} ({selectedRequisitionDetail.id})
                    </h3>
                  </div>
                  <button 
                    onClick={() => setSelectedRequisitionDetail(null)} 
                    className="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-white/10 transition"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Workflow Progress Stepper */}
                <div className="bg-slate-50 dark:bg-slate-800/70 px-6 py-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center justify-between text-[11px] font-bold text-slate-500">
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_ADMIN" ? "text-amber-600 font-extrabold" : "text-emerald-600 font-bold"}>
                      1. Admin Verification
                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_APPROVER" ? "text-sky-600 font-extrabold" : (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_IT" || (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" ? "text-emerald-600" : ""}>
                      2. Approval
                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_IT" ? "text-purple-600 font-extrabold" : (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" ? "text-emerald-600" : ""}>
                      3. IT Setup
                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" || selectedRequisitionDetail.requestStatus === "Recruiting" ? "text-emerald-600 font-extrabold" : ""}>
                      4. Ready to Recruit
                    </span>
                  </div>
                </div>

                {/* Content Body */}
                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {/* Status Banner */}
                  <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-slate-400 font-bold uppercase">สถานะปัจจุบัน:</span>
                      <div className="mt-0.5">
                        {(() => {
                          const stId = selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus || "PENDING_ADMIN";
                          const cfg = REQUISITION_STATUSES.find(s => s.id === stId) || REQUISITION_STATUSES[0];
                          return (
                            <span className={`inline-block px-3 py-1 rounded-xl font-extrabold border ${cfg.badge}`}>
                              {cfg.label}
                            </span>
                          );
                        })()}
                      </div>
                    </div>

                    <div className="text-right">
                      <span className="text-[10px] text-slate-400 font-bold uppercase">จำนวนอัตราที่ต้องการ:</span>
                      <div className="text-base font-extrabold text-brand-600 mt-0.5">
                        {selectedRequisitionDetail.headcountRequired || 1} อัตรา ({selectedRequisitionDetail.positionType})
                      </div>
                    </div>
                  </div>

                  {/* Slot-by-Slot Independent Approval Table (อนุมัติแยกทีละอัตรา) */}
                  {(selectedRequisitionDetail.slots && selectedRequisitionDetail.slots.length > 1) && (
                    <div className="p-4 rounded-2xl bg-amber-50/60 dark:bg-amber-950/20 border-2 border-amber-300 dark:border-amber-700 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="text-[10px] font-extrabold uppercase text-amber-700 dark:text-amber-300 tracking-wider block">
                            ⚡ HEADCOUNT SLOTS APPROVAL (อนุมัติแยกรายอัตรา)
                          </span>
                          <h4 className="text-xs font-bold text-slate-900 dark:text-white mt-0.5">
                            คำขอนี้มี {selectedRequisitionDetail.slots.length} อัตรา &bull; แอดมินสามารถกดยืนยันทีละอัตราแยกกันได้
                          </h4>
                        </div>
                      </div>

                      <div className="space-y-2 pt-1">
                        {selectedRequisitionDetail.slots.map((s, idx) => {
                          const isSlotApproved = s.slotStatus === "READY_FOR_RECRUITMENT" || s.slotStatus === "Recruiting" || s.slotStatus === "Closed";
                          return (
                            <div key={s.slotId} className="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-3 shadow-2xs">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="font-mono font-bold text-xs text-sky-600 dark:text-sky-400">Slot #{s.slotId}</span>
                                  <span className="text-[11px] text-slate-500 font-medium">(อัตราที่ {idx + 1})</span>
                                </div>
                                <span className={`inline-block mt-1 text-[10px] font-extrabold px-2 py-0.5 rounded-lg border ${
                                  isSlotApproved
                                    ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-300"
                                    : "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-300"
                                }`}>
                                  {isSlotApproved ? "✅ ยืนยันแล้ว (พร้อมสรรหา)" : "⏳ รอแอดมินยืนยัน"}
                                </span>
                              </div>

                              <div>
                                {!isSlotApproved ? (
                                  <button
                                    type="button"
                                    disabled={isApprovingEmailSending}
                                    onClick={() => handleAdminApproveSpecificSlot(s.slotId, selectedRequisitionDetail.id)}
                                    className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs shadow-xs transition disabled:opacity-50"
                                  >
                                    Approve Slot
                                  </button>
                                ) : (
                                  <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400">
                                    Approved
                                  </span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Section 1: ข้อมูลผู้ยื่นคำขอ */}
                  <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-2">
                    <h4 className="font-bold text-slate-900 dark:text-white text-xs border-b border-slate-200 dark:border-slate-700 pb-1.5 flex items-center gap-1.5">
                      <span>👤 1. ข้อมูลผู้ยื่นคำขอ (Requester Details)</span>
                    </h4>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-[11px]">
                      <div>
                        <span className="text-slate-400 block text-[10px]">ผู้ขอ (Requester - EN):</span>
                        <strong className="text-slate-900 dark:text-white">{selectedRequisitionDetail.requesterName}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">ตำแหน่ง:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.requesterPosition || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">Email:</span>
                        <strong className="text-brand-600 dark:text-brand-400 truncate block">{selectedRequisitionDetail.requesterEmail || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">ฝ่ายงาน:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.department}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">สายงาน (Division):</span>
                        <strong className="text-emerald-700 dark:text-emerald-300">{selectedRequisitionDetail.division || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">หัวหน้างาน Candidate (EN):</span>
                        <strong className="text-indigo-600 dark:text-indigo-400">{selectedRequisitionDetail.candidateSupervisor || "-"}</strong>
                      </div>
                    </div>
                  </div>

                  {/* Section 2: ผู้อนุมัติ & การส่งต่อ */}
                  <div className="p-4 rounded-2xl bg-sky-50/60 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900/60 space-y-2">
                    <h4 className="font-bold text-sky-900 dark:text-sky-300 text-xs border-b border-sky-200 dark:border-sky-800 pb-1.5 flex items-center gap-1.5">
                      <span>📧 2. ผู้อนุมัติ &amp; การส่งต่อ (Approval &amp; Routing)</span>
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-[11px]">
                      <div>
                        <span className="text-slate-400 block text-[10px]">ผู้อนุมัติ (Approver Name):</span>
                        <strong className="text-slate-900 dark:text-white text-xs">{selectedRequisitionDetail.approverName || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">Email ผู้อนุมัติที่จะได้รับแจ้ง:</span>
                        <strong className="text-sky-600 dark:text-sky-400 font-bold text-xs">{selectedRequisitionDetail.approverEmail || "-"}</strong>
                      </div>
                    </div>
                  </div>

                  {/* Section 3: คุณสมบัติผู้สมัคร & ลักษณะงาน */}
                  <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-2.5">
                    <h4 className="font-bold text-slate-900 dark:text-white text-xs border-b border-slate-200 dark:border-slate-700 pb-1.5 flex items-center gap-1.5">
                      <span>📋 3. ตำแหน่งและคุณสมบัติ (Position Requisition)</span>
                    </h4>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-[11px]">
                      <div>
                        <span className="text-slate-400 block text-[10px]">เป้าหมายวันที่ต้องการ:</span>
                        <strong className="text-amber-600 font-bold">{formatCleanDateTime(selectedRequisitionDetail.targetDate)}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">พี่เลี้ยง (Buddy):</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.buddy || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">ประเภทตำแหน่ง:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.positionType}</strong>
                      </div>
                      {selectedRequisitionDetail.positionType === "Replacement" && selectedRequisitionDetail.replacedEmployeeName && (
                        <div className="col-span-2 sm:col-span-3 p-2 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-[11px] text-amber-900 dark:text-amber-200">
                          ทดแทนพนักงานเดิมที่ลาออก: <strong>{selectedRequisitionDetail.replacedEmployeeName}</strong>
                        </div>
                      )}
                      <div>
                        <span className="text-slate-400 block text-[10px]">เพศ:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.gender || "ไม่ระบุ"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">อายุ:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.age || "ไม่จำกัด"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">วุฒิการศึกษา:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.educationLevel || "ปริญญาตรี"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">สาขาวิชา:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.major || "-"}</strong>
                      </div>
                      <div>
                        <span className="text-slate-400 block text-[10px]">ประสบการณ์:</span>
                        <strong className="text-slate-800 dark:text-slate-200">{selectedRequisitionDetail.experience || "1-3 ปี"}</strong>
                      </div>
                    </div>

                    {selectedRequisitionDetail.mustHaveQualifications && (
                      <div className="pt-2 border-t border-slate-200 dark:border-slate-700">
                        <span className="text-slate-400 block text-[10px] font-bold">คุณสมบัติจำเป็น (Must-have):</span>
                        <p className="text-slate-800 dark:text-slate-200 mt-0.5 leading-relaxed">{selectedRequisitionDetail.mustHaveQualifications}</p>
                      </div>
                    )}

                    {selectedRequisitionDetail.jobDescription && (
                      <div className="pt-2 border-t border-slate-200 dark:border-slate-700">
                        <span className="text-slate-400 block text-[10px] font-bold">ลักษณะงานโดยย่อ (JD):</span>
                        <p className="text-slate-800 dark:text-slate-200 mt-0.5 leading-relaxed">{selectedRequisitionDetail.jobDescription}</p>
                      </div>
                    )}
                  </div>

                  {/* Section 4: อุปกรณ์และสิทธิ์ IT */}
                  <div className="p-4 rounded-2xl bg-purple-50/60 dark:bg-purple-950/30 border border-purple-200 dark:border-purple-900/60 space-y-2">
                    <h4 className="font-bold text-purple-900 dark:text-purple-300 text-xs border-b border-purple-200 dark:border-purple-800 pb-1.5 flex items-center gap-1.5">
                      <span>💻 4. อุปกรณ์และสิทธิ์ IT (IT &amp; Equipment Requirements)</span>
                    </h4>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-[10.5px]">
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">Laptop/PC:</span>
                        <strong className="text-brand-600 font-bold">{selectedRequisitionDetail.itLaptop || "ต้องการ"}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">Sim Card:</span>
                        <strong className="text-brand-600 font-bold">{selectedRequisitionDetail.itSimCard || "ไม่ต้องการ"}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">Email องค์กร:</span>
                        <strong className="text-brand-600 font-bold">{selectedRequisitionDetail.itEmail || "ต้องการ"}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800">
                        <span className="text-slate-400 block text-[10px]">ERP Netsuite:</span>
                        <strong className="text-brand-600 font-bold">{selectedRequisitionDetail.itNetsuite || "ไม่ต้องการ"}</strong>
                      </div>
                    </div>
                  </div>

                  {/* Rejection Reason Notice if rejected */}
                  {selectedRequisitionDetail.rejectionReason && (
                    <div className="p-3.5 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-300 dark:border-rose-900 text-rose-800 dark:text-rose-200">
                      <strong className="block text-xs font-extrabold mb-0.5">เหตุผลที่ตีกลับ/ปฏิเสธคำขอ:</strong>
                      <p className="text-[11px]">{selectedRequisitionDetail.rejectionReason}</p>
                    </div>
                  )}
                </div>

                {/* Footer Actions */}
                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onClick={() => setSelectedRequisitionDetail(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 transition"
                  >
                    Close (ปิด)
                  </button>

                  <div className="flex items-center gap-2">
                    {/* Reject / Return button */}
                    {(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) !== "REJECTED_BY_ADMIN" && (
                      <button
                        type="button"
                        onClick={() => {
                          setRejectionNoteInput(selectedRequisitionDetail.rejectionReason || "");
                          setShowRejectModal(true);
                        }}
                        className="px-4 py-2 rounded-xl text-xs font-bold text-rose-600 dark:text-rose-400 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 transition active:scale-95"
                      >
                        Reject (ปฏิเสธ)
                      </button>
                    )}

                    {/* Approve & Start Recruiting */}
                    {(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_ADMIN" && (
                      <button
                        type="button"
                        disabled={isApprovingEmailSending}
                        onClick={() => handleAdminApproveAndMoveToManpower(selectedRequisitionDetail)}

                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={() => handleAdminRejectRequisition(selectedRequisitionDetail.id)}

                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200">

                      </div>
                    </div>
                  </div>

                      <div className="min-w-0 p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700/70">
                        <span className="text-slate-400 block text-[10px] font-semibold mb-0.5">เป้าหมายเริ่มงาน:</span>

                    </div>

                      </div>
                    )}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 text-[10.5px]">
                      <div className="min-w-0 p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60"><span className="text-slate-400 block">เพศ:</span><span className="font-semibold text-slate-800 dark:text-slate-200">{pendingConfirmationForm.gender}</span></div>
                      <div className="min-w-0 p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60"><span className="text-slate-400 block">อายุ:</span><span className="font-semibold text-slate-800 dark:text-slate-200">{pendingConfirmationForm.age}</span></div>
                      <div className="min-w-0 p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60"><span className="text-slate-400 block">การศึกษา:</span><span className="font-semibold text-slate-800 dark:text-slate-200">{pendingConfirmationForm.educationLevel}</span></div>
                      <div className="min-w-0 p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60"><span className="text-slate-400 block">ประสบการณ์:</span><span className="font-semibold text-slate-800 dark:text-slate-200">{pendingConfirmationForm.experience}</span></div>
                    </div>
                    {pendingConfirmationForm.mustHaveQualifications && (
                      <div className="pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                        <span className="text-slate-400 block text-[10px] font-bold">คุณสมบัติจำเป็น:</span>
                        <p className="text-slate-700 dark:text-slate-300 mt-0.5 leading-relaxed">{pendingConfirmationForm.mustHaveQualifications}</p>
                      </div>
                    )}
                  </div>

                  {/* Section 4 Preview */}
                  <div className="p-3.5 rounded-2xl bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-800 space-y-2">
                    <h4 className="font-bold text-sky-900 dark:text-sky-300 text-xs border-b border-sky-200/80 dark:border-sky-800 pb-1.5 flex items-center gap-1.5">
                      <span>💻 4. อุปกรณ์และสิทธิ์ IT (IT &amp; Equipment Requirements)</span>
                    </h4>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-[10.5px]">
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-sky-200 dark:border-sky-700">
                        <span className="text-slate-400 block">Laptop/PC:</span>
                        <strong className="text-brand-600 font-bold">{pendingConfirmationForm.itLaptop}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-sky-200 dark:border-sky-700">

                        <strong className="text-brand-600 font-bold">{pendingConfirmationForm.itSimCard}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-sky-200 dark:border-sky-700">
                        <span className="text-slate-400 block">Corporate Email:</span>
                        <strong className="text-brand-600 font-bold">{pendingConfirmationForm.itEmail}</strong>
                      </div>
                      <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-sky-200 dark:border-sky-700">
                        <span className="text-slate-400 block">ERP Netsuite:</span>
                        <strong className="text-brand-600 font-bold">{pendingConfirmationForm.itNetsuite}</strong>
                      </div>
                    </div>
                  </div>
                </div>

                  </button>

                    type="button"
                    onClick={handleConfirmFinalSubmit}

              </div>

          {showAdminReviewModal && selectedAdminReviewSlot && (
            <div className="fixed inset-0 z-[75] flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                <div className="px-6 py-4 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-amber-400 uppercase tracking-wider">
                      REQUISITION VERIFICATION (การตรวจสอบและอนุมัติคำขอ)
                    </span>
                    <h3 className="text-base font-extrabold mt-0.5">
                      {selectedAdminReviewSlot.jobTitle} ({selectedAdminReviewSlot.slotId})
                    </h3>
                  </div>

                  </button>

                      </div>
